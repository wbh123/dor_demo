openapi: 3.0.3
info:
  title: Wust Dormitory Select 学生欢迎接口
  version: 1.0.0
paths:
  /api/v1/auth/welcome/acknowledge:
    post:
      tags: [Welcome]
      operationId: acknowledgeStudentWelcome
      summary: 确认学生首次登录欢迎信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 确认成功；重复调用保持幂等
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/VoidSuccessResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
components:
  responses:
    ErrorResponse:
      description: 业务错误
      content:
        application/json:
          schema:
            $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
