openapi: 3.0.3
info:
  title: 学校功能启用设置接口
  version: 1.0.0
paths:
  /api/v1/admin/settings/features:
    get:
      tags: [SchoolFeatureSetting]
      operationId: listSchoolFeatureSettings
      summary: 查询系统授权、本校开关和最终有效状态
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/settings/features/{featureCode}:
    put:
      tags: [SchoolFeatureSetting]
      operationId: updateSchoolFeatureSetting
      summary: 使用乐观锁修改本校功能启用状态
      security: [{ bearerAuth: [] }]
      parameters:
        - name: featureCode
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolFeatureSettingUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
components:
  schemas:
    SchoolFeatureSettingUpdateRequest:
      type: object
      additionalProperties: false
      required: [enabled, expectedVersion, reason, highRiskConfirmed]
      properties:
        enabled: { type: boolean }
        expectedVersion: { type: integer, format: int32, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        highRiskConfirmed: { type: boolean }
  responses:
    ObjectSuccess:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ObjectSuccessResponse' }
    ListSuccess:
      description: 查询成功
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ListSuccessResponse' }
    ErrorResponse:
      description: 业务错误
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
