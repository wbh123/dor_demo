openapi: 3.0.3
info:
  title: Wust Dormitory Select 系统设置接口
  version: 1.1.0
paths:
  /api/v1/admin/settings/student-welcome:
    get:
      tags: [SystemSetting]
      operationId: getStudentWelcomeSetting
      summary: 获取学生首次登录多语言欢迎语
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前欢迎语配置
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ObjectSuccessResponse'
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    put:
      tags: [SystemSetting]
      operationId: updateStudentWelcomeSetting
      summary: 更新学生首次登录多语言欢迎语
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentWelcomeSettingUpdateRequest'
      responses:
        '200':
          description: 更新后的欢迎语配置
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ObjectSuccessResponse'
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
components:
  responses:
    ErrorResponse:
      description: 业务错误
      content:
        application/json:
          schema:
            $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse'
  schemas:
    StudentWelcomeSettingUpdateRequest:
      type: object
      required: [messages, expectedVersion]
      properties:
        messages:
          type: object
          minProperties: 2
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 1000
        expectedVersion:
          type: integer
          format: int32
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
