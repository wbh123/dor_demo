openapi: 3.0.3
info:
  title: 上线体检与单校试点准备接口
  version: 1.0.0
paths:
  /api/v1/admin/system-readiness:
    get:
      tags: [SystemReadiness]
      operationId: getSystemReadiness
      summary: 执行一次只读的上线体检
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 体检完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemReadinessReport'
        '401': { description: 未登录 }
        '403': { description: 无学校管理权限 }
components:
  schemas:
    SystemReadinessReport:
      type: object
      required: [overallStatus, checkedAt, summary, categories, checks]
      properties:
        overallStatus:
          type: string
          enum: [READY, READY_WITH_WARNINGS, BLOCKED]
        checkedAt: { type: string, format: date-time }
        summary:
          $ref: '#/components/schemas/SystemReadinessSummary'
        categories:
          type: array
          items: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ReadinessCheckResult' }
    SystemReadinessSummary:
      type: object
      required: [total, passed, info, warnings, errors, blocking]
      properties:
        total: { type: integer }
        passed: { type: integer }
        info: { type: integer }
        warnings: { type: integer }
        errors: { type: integer }
        blocking: { type: integer }
    ReadinessCheckResult:
      type: object
      required: [code, category, title, severity, blocking, status, summary, evidence, checkedAt]
      properties:
        code: { type: string }
        category: { type: string }
        title: { type: string }
        severity:
          type: string
          enum: [PASS, INFO, WARNING, ERROR]
        blocking: { type: boolean }
        status: { type: string }
        summary: { type: string }
        evidence:
          type: object
          additionalProperties: true
        suggestedAction: { type: string, nullable: true }
        actionRoute: { type: string, nullable: true }
        checkedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
