openapi: 3.0.3
info:
  title: Wust Dormitory Select 学生资料管理接口
  version: 1.1.0
paths:
  /api/v1/admin/students:
    get:
      tags: [Admin]
      operationId: listStudents
      security: [{ bearerAuth: [] }]
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: gender
          in: query
          schema: { type: string, pattern: '^[MF]$' }
        - name: majorId
          in: query
          schema: { type: integer, format: int64 }
        - name: studentCategory
          in: query
          schema: { type: string, enum: [DOMESTIC, INTERNATIONAL] }
        - name: enrollmentSource
          in: query
          schema: { type: string, enum: [INITIAL_IMPORT, TRANSFER_MANUAL, ADMIN_MANUAL, BATCH_IMPORT] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
    post:
      tags: [Admin]
      operationId: createStudent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentRequest' }
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /api/v1/admin/students/{id}:
    put:
      tags: [Admin]
      operationId: updateStudent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentRequest' }
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /api/v1/admin/students/import:
    post:
      tags: [Admin]
      operationId: importStudents
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 5000
              items: { $ref: '#/components/schemas/StudentRequest' }
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '400': { $ref: '#/components/responses/ErrorResponse' }

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    ObjectSuccess:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ObjectSuccessResponse' }
    ErrorResponse:
      description: 业务错误
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse' }

  schemas:
    StudentRequest:
      type: object
      required: [studentNumber, studentName, gender, majorId, studentCategory]
      properties:
        studentNumber: { type: string, pattern: '^\d{12}$' }
        studentName: { type: string, minLength: 1, maxLength: 128 }
        gender: { type: string, pattern: '^[MF]$' }
        majorId: { type: integer, format: int64, minimum: 1 }
        nationalityCode:
          type: string
          pattern: '^[A-Z]{2}$'
          default: CN
        studentCategory:
          type: string
          enum: [DOMESTIC, INTERNATIONAL]
        enrollmentSource:
          type: string
          enum: [INITIAL_IMPORT, TRANSFER_MANUAL, ADMIN_MANUAL, BATCH_IMPORT]
          default: ADMIN_MANUAL
        phoneNumber:
          type: string
          nullable: true
          maxLength: 32
          pattern: '^\+?[0-9][0-9 -]{5,30}$'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
