openapi: 3.0.3
info:
  title: Actual bed confirmation review API
  version: 1.0.0
paths:
  /api/v1/student/bed-confirmations:
    get:
      tags: [BedConfirmation]
      operationId: getMyBedConfirmation
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/ObjectSuccess' } }
    post:
      tags: [BedConfirmation]
      operationId: submitBedConfirmation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BedConfirmationSubmitRequest' }
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/student/bed-confirmations/{requestId}/cancel:
    post:
      tags: [BedConfirmation]
      operationId: cancelBedConfirmation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BedConfirmationActionRequest' }
      responses: { '200': { $ref: '#/components/responses/ObjectSuccess' } }
  /api/v1/admin/bed-confirmations/rooms:
    get:
      tags: [BedConfirmation]
      operationId: listBedConfirmationRooms
      security: [{ bearerAuth: [] }]
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 128 }
      responses: { '200': { $ref: '#/components/responses/ListSuccess' } }
  /api/v1/admin/bed-confirmations/rooms/{roomId}:
    get:
      tags: [BedConfirmation]
      operationId: getBedConfirmationRoom
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RoomId' }]
      responses: { '200': { $ref: '#/components/responses/ObjectSuccess' } }
  /api/v1/admin/bed-confirmations/rooms/{roomId}/approve:
    post:
      tags: [BedConfirmation]
      operationId: approveRoomBedConfirmations
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RoomId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BedConfirmationActionRequest' }
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/bed-confirmations/requests/{requestId}/reject:
    post:
      tags: [BedConfirmation]
      operationId: rejectBedConfirmation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BedConfirmationActionRequest' }
      responses: { '200': { $ref: '#/components/responses/ObjectSuccess' } }
components:
  parameters:
    RequestId: { name: requestId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    RoomId: { name: roomId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  schemas:
    BedConfirmationSubmitRequest:
      type: object
      required: [bedId, reason]
      properties:
        bedId: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    BedConfirmationActionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
  responses:
    ObjectSuccess:
      description: success
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ObjectSuccessResponse' }
    ListSuccess:
      description: success
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ListSuccessResponse' }
    ErrorResponse:
      description: business error
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse' }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: Token }
