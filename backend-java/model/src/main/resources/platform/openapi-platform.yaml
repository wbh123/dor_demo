paths:
  /api/v1/platform/login:
    post:
      operationId: platformLogin
      tags: [Platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformLoginResponse'
  /api/v1/platform/me:
    get:
      operationId: getPlatformCurrentUser
      tags: [Platform]
      responses:
        '200': { description: 当前系统管理员 }
  /api/v1/platform/password:
    post:
      operationId: changePlatformPassword
      tags: [Platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformPasswordChangeRequest'
      responses:
        '200': { description: 密码修改成功，需要重新登录 }
  /api/v1/platform/plans:
    get:
      operationId: listSubscriptionPlans
      tags: [Platform]
      responses:
        '200': { description: 套餐列表 }
    post:
      operationId: createSubscriptionPlan
      tags: [Platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreateRequest'
      responses:
        '200': { description: 套餐创建成功 }
  /api/v1/platform/plans/revisions/{revisionId}:
    get:
      operationId: getSubscriptionPlanRevision
      tags: [Platform]
      parameters:
        - name: revisionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 套餐修订 }
  /api/v1/platform/plans/revisions/{sourceRevisionId}:
    post:
      operationId: createSubscriptionPlanRevision
      tags: [Platform]
      parameters:
        - name: sourceRevisionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRevisionCreateRequest'
      responses:
        '200': { description: 套餐修订创建成功 }
  /api/v1/platform/subscription:
    get:
      operationId: getCurrentServiceSubscription
      tags: [Platform]
      responses:
        '200':
          description: 当前订阅
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSubscription'
  /api/v1/platform/subscription/history:
    get:
      operationId: listServiceSubscriptionHistory
      tags: [Platform]
      responses:
        '200': { description: 订阅修订历史 }
  /api/v1/platform/subscription/preview:
    get:
      operationId: previewServiceSubscriptionChange
      tags: [Platform]
      parameters:
        - name: targetPlanRevisionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: 订阅切换影响预览 }
  /api/v1/platform/subscription/plan:
    post:
      operationId: changeServiceSubscriptionPlan
      tags: [Platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPlanChangeRequest'
      responses:
        '200': { description: 升级或降级成功 }
  /api/v1/platform/subscription/status:
    post:
      operationId: changeServiceSubscriptionStatus
      tags: [Platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionStatusRequest'
      responses:
        '200': { description: 状态修改成功 }
  /api/v1/platform/features:
    get:
      operationId: listFeatureCatalog
      tags: [Platform]
      responses:
        '200': { description: 固化功能目录 }
  /api/v1/platform/feature-overrides:
    get:
      operationId: listFeatureOverrides
      tags: [Platform]
      responses:
        '200': { description: 功能覆盖列表 }
    post:
      operationId: createFeatureOverride
      tags: [Platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureOverrideRequest'
      responses:
        '200': { description: 功能覆盖创建成功 }
  /api/v1/platform/quotas:
    get:
      operationId: getQuotaSummary
      tags: [Platform]
      responses:
        '200': { description: 配额目录、覆盖、有效值和使用率 }
  /api/v1/platform/quota-overrides:
    post:
      operationId: createQuotaOverride
      tags: [Platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaOverrideRequest'
      responses:
        '200': { description: 配额覆盖创建成功 }
  /api/v1/platform/audit:
    get:
      operationId: listPlatformAuditLogs
      tags: [Platform]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        '200': { description: 平台审计列表 }
components:
  schemas:
    PlatformLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128 }
    PlatformLoginResponse:
      type: object
      required: [accessToken, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        expiresInSeconds: { type: integer, format: int64 }
        user:
          type: object
          required: [userId, username, displayName, userType, passwordChangeRequired]
          properties:
            userId: { type: integer, format: int64 }
            username: { type: string }
            displayName: { type: string }
            userType: { type: string, enum: [SYSTEM_ADMIN] }
            passwordChangeRequired: { type: boolean }
    PlatformPasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    PlanCreateRequest:
      type: object
      required: [planCode, planName, revisionName, features, quotas, reason]
      properties:
        planCode: { type: string, maxLength: 64 }
        planName: { type: string, maxLength: 128 }
        revisionName: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        features: { type: array, items: { type: string } }
        quotas:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PlanRevisionCreateRequest:
      type: object
      required: [revisionName, features, quotas, reason]
      properties:
        revisionName: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        features: { type: array, items: { type: string } }
        quotas:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CurrentSubscription:
      type: object
      properties:
        revisionId: { type: integer, format: int64 }
        subscriptionId: { type: integer, format: int64 }
        revision: { type: integer }
        planRevisionId: { type: integer, format: int64 }
        planCode: { type: string }
        planName: { type: string }
        planRevision: { type: integer }
        subscriptionType: { type: string, enum: [TRIAL, FIXED_TERM, LONG_TERM] }
        serviceStatus: { type: string, enum: [TRIAL, ACTIVE, SUSPENDED, EXPIRED, TERMINATED] }
        contractNumber: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        emergencyStopped: { type: boolean }
    SubscriptionPlanChangeRequest:
      type: object
      required: [planRevisionId, direction, reason]
      properties:
        planRevisionId: { type: integer, format: int64 }
        direction: { type: string, enum: [UPGRADE, DOWNGRADE] }
        contractNumber: { type: string, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    SubscriptionStatusRequest:
      type: object
      required: [action, reason]
      properties:
        action: { type: string, enum: [SUSPEND, RESUME, TERMINATE, EMERGENCY_STOP, EMERGENCY_RESUME] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    FeatureOverrideRequest:
      type: object
      required: [featureCode, overrideType, reason]
      properties:
        featureCode: { type: string }
        overrideType: { type: string, enum: [GRANT, REVOKE] }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: string, format: date-time, nullable: true }
        reason: { type: string, minLength: 1, maxLength: 500 }
    QuotaOverrideRequest:
      type: object
      required: [quotaCode, quotaValue, reason]
      properties:
        quotaCode: { type: string }
        quotaValue: { type: integer, format: int64, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: string, format: date-time, nullable: true }
        reason: { type: string, minLength: 1, maxLength: 500 }
