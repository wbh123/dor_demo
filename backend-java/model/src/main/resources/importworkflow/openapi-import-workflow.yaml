openapi: 3.0.3
info:
  title: 数据导入质量任务接口
  version: 1.0.0
paths:
  /api/v1/admin/import-tasks/preview:
    post:
      tags: [ImportWorkflow]
      operationId: previewImportTask
      summary: 上传学生或宿舍文件并执行字段级预检
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [STUDENT, ROOM] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/import-tasks:
    get:
      tags: [ImportWorkflow]
      operationId: listImportTasks
      summary: 查询导入任务历史
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
  /api/v1/admin/import-tasks/{taskId}:
    get:
      tags: [ImportWorkflow]
      operationId: getImportTask
      summary: 查询单个导入任务和字段错误
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/import-tasks/{taskId}/commit:
    post:
      tags: [ImportWorkflow]
      operationId: commitImportTask
      summary: 提交无字段错误的预检任务
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/import-tasks/{taskId}/rollback:
    post:
      tags: [ImportWorkflow]
      operationId: rollbackImportTask
      summary: 回滚已经提交的导入任务
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200': { $ref: '#/components/responses/ObjectSuccess' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /api/v1/admin/import-tasks/{taskId}/errors.csv:
    get:
      tags: [ImportWorkflow]
      operationId: exportImportTaskErrors
      summary: 导出字段级错误报告
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: 字段错误CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/ErrorResponse' }
components:
  parameters:
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ObjectSuccess:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ObjectSuccessResponse' }
    ListSuccess:
      description: 查询成功
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ListSuccessResponse' }
    ErrorResponse:
      description: 业务错误
      content:
        application/json:
          schema: { $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse' }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
