<div class="content-column">
  <div class="page-title">
    <span class="eyebrow">SELECTION OPERATIONS</span>
    <h2>选寝批次与统一分配</h2>
    <p>创建草稿后选择参与学生和可选宿舍，再完成发布预检。保存范围、确认发布和最终发布可以在同一连续流程内完成。</p>
  </div>
  <p v-if="error" class="alert error">{{ error }}</p>
  <p v-if="message" class="alert success">{{ message }}</p>

  <BatchCreationPanel
    :form="form"
    :rule-templates="ruleTemplates"
    :bed-mode-authorized="bedModeAuthorized"
    :rule-template-summary="ruleTemplateSummary"
    :creating="creatingDraft"
    @update:form="Object.assign(form, $event)"
    @submit="createBatch"
  />

  <BatchListPanel
    :batches="batches"
    :publish-flow-busy="publishFlowBusy"
    :next-actions="nextActions"
    :mode-text="modeText"
    :status-text="statusText"
    :action-text="actionText"
    @open-scope="openScope"
    @preflight="preflight"
    @open-copy="openCopy"
    @change-status="changeStatus"
    @preview-allocation="previewAllocation"
    @download="download"
  />

  <BatchScopeDialog
    :open="scopeDialog"
    :scope-batch="scopeBatch"
    :scope-loading="scopeLoading"
    :scope-saving="scopeSaving"
    :selected-student-ids="selectedStudentIds"
    :selected-room-ids="selectedRoomIds"
    :student-filter="studentFilter"
    :student-gender-filter="studentGenderFilter"
    :student-category-filter="studentCategoryFilter"
    :student-degree-filter="studentDegreeFilter"
    :student-major-filter="studentMajorFilter"
    :student-grade-filter="studentGradeFilter"
    :room-filter="roomFilter"
    :room-gender-filter="roomGenderFilter"
    :room-scope-filter="roomScopeFilter"
    :room-building-filter="roomBuildingFilter"
    :room-floor-filter="roomFloorFilter"
    :scope-major-options="scopeMajorOptions"
    :scope-grade-options="scopeGradeOptions"
    :scope-building-options="scopeBuildingOptions"
    :scope-floor-options="scopeFloorOptions"
    :filtered-students="filteredStudents"
    :filtered-rooms="filteredRooms"
    :publish-after-scope="publishAfterScope"
    :publish-flow-state="publishFlowState"
    :publish-flow-busy="publishFlowBusy"
    :running-preflight="runningPreflight"
    @close="closeScope"
    @toggle-student="toggleStudent"
    @toggle-room="toggleRoom"
    @select-all-students="selectAllStudents"
    @clear-students="selectedStudentIds=[]"
    @select-all-rooms="selectAllRooms"
    @clear-rooms="selectedRoomIds=[]"
    @update:student-filter="studentFilter=$event"
    @update:student-gender-filter="studentGenderFilter=$event"
    @update:student-category-filter="studentCategoryFilter=$event"
    @update:student-degree-filter="studentDegreeFilter=$event"
    @update:student-major-filter="studentMajorFilter=$event"
    @update:student-grade-filter="studentGradeFilter=$event"
    @update:room-filter="roomFilter=$event"
    @update:room-gender-filter="roomGenderFilter=$event"
    @update:room-scope-filter="roomScopeFilter=$event"
    @update:room-building-filter="roomBuildingFilter=$event"
    @update:room-floor-filter="roomFloorFilter=$event"
    @save="saveScope"
    @save-and-publish="saveScopeAndContinuePublish"
  />

  <BatchPreflightDialog
    :open="Boolean(preflightBatch && roomPreflight)"
    :preflight-batch="preflightBatch"
    :room-preflight="roomPreflight"
    :preflight-rooms="preflightRooms"
    :preflight-blockers="preflightBlockers"
    :preflight-missing-steps="preflightMissingSteps"
    :running-preflight="runningPreflight"
    :issue-text="issueText"
    @close="closePreflight"
    @reopen-scope="reopenScopeFromPreflight"
  />

  <BatchPublishConfirmationDialog
    :open="Boolean(publishConfirmation)"
    :publish-confirmation="publishConfirmation"
    :publish-preflight-snapshot="publishPreflightSnapshot"
    :selected-student-count="selectedStudentIds.length"
    :scope-open="scopeDialog"
    :publishing="publishing"
    :action="confirmPublish"
    :mode-text="modeText"
    :format-date-time="formatDateTime"
    :batch-rule-summary="batchRuleSummary"
    @close="closePublishConfirmation"
  />

  <BatchCopyDialog
    :open="copyDialog"
    :copy-source="copySource"
    :copy-form="copyForm"
    :busy="copying"
    @update:copy-form="Object.assign(copyForm, $event)"
    @submit="copyBatch"
    @close="closeCopy"
  />

  <BatchAllocationPreviewDialog
    :open="Boolean(allocationPreview)"
    :allocation-preview="allocationPreview"
    :allocation-batch-id="allocationBatchId"
    :allocation-summary="allocationSummary"
    :unassigned-students="unassignedStudents"
    @close="allocationPreview = null; allocationBatchId = null"
    @commit="commitAllocation"
  />
</div>
