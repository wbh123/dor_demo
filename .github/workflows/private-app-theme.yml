name: Private APP Theme Compatibility

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-app-theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          [[ -n "$private_ref" && "$private_ref" != "$candidate" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install APP dependencies
        working-directory: private-repo/app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm ci

      - name: Verify theme and icon contracts
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/system-dark-mode.spec.ts src/platform/android-icon-safe-zone.spec.ts

      - name: Verify APP version
        working-directory: private-repo/app
        run: npm run version:check

      - name: Verify APP production build
        working-directory: private-repo/app
        run: npm run build

      - name: Verify Android resources
        working-directory: private-repo/app/android
        run: ./gradlew :app:processDebugResources
