name: Incremental Build Plan CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: incremental-build-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incremental-plan:
    name: Incremental build and restart plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate incremental build classification
        run: python3 scripts/ci/test_incremental_build_plan.py
      - name: Validate tracked build cleanup safety
        run: python3 scripts/ci/test_build_worktree_cleanup.py
      - name: Validate release build worktree cleanup
        run: python3 scripts/ci/test_release_build_cleanup.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/ci/incremental_build_plan.sh
          bash -n scripts/ci/cleanup_build_worktree.sh
          bash -n scripts/ci/pull_image_with_fallback.sh
          bash -n scripts/ci/prepare_runtime_images_contract.sh
      - name: Validate source archive and Git modes
        run: python3 scripts/ci/test_source_archive_mode.py
      - name: Validate Vite build-time env hash tracking
        run: python3 scripts/ci/test_build_env_hash_plan.py
      - name: Validate deferred APP build after skip-app
        run: python3 scripts/ci/test_app_build_pending.py
      - name: Validate per-service runtime env restart planning
        run: python3 scripts/ci/test_runtime_env_service_plan.py
      - name: Validate MySQL root credential guard
        run: python3 scripts/ci/test_mysql_root_guard.py
      - name: Validate mainland container image mirror tags and fallback
        run: python3 scripts/ci/test_container_image_mirrors.py
      - name: Validate source and release runtime image preflight modes
        run: python3 scripts/ci/test_runtime_image_preflight.py
      - name: Validate APT and PyPI mainland mirror fallback
        run: python3 scripts/ci/test_dependency_mirrors.py
      - name: Validate Gradle distribution mainland mirror fallback
        run: python3 scripts/ci/test_gradle_distribution_mirror.py
      - name: Validate Ubuntu/Debian Docker host bootstrap
        run: python3 scripts/ci/test_host_bootstrap.py
      - name: Validate Nginx dynamic Docker DNS syntax
        run: python3 scripts/ci/test_proxy_dynamic_dns.py
      - name: Validate Java 21 backend runtime packages and privilege drop
        run: python3 scripts/ci/test_backend_runtime_packages.py
      - name: Validate mysqldump across Docker containers
        run: python3 scripts/ci/test_cross_container_mysqldump.py
      - name: Validate Android SDK mainland mirror endpoints
        run: python3 scripts/ci/test_android_sdk_mirror.py
      - name: Prove sdkmanager installs through mainland mirror with Google blocked
        run: python3 scripts/ci/test_android_sdkmanager_mainland_mirror.py
