name: Incremental Build Plan CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: incremental-build-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incremental-plan:
    name: Incremental build and restart plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate incremental build classification
        run: python3 scripts/ci/test_incremental_build_plan.py
      - name: Validate tracked build cleanup safety
        run: python3 scripts/ci/test_build_worktree_cleanup.py
      - name: Validate shell syntax
        run: |
          bash -n scripts/ci/incremental_build_plan.sh
          bash -n scripts/ci/cleanup_build_worktree.sh
      - name: Validate Nginx dynamic Docker DNS syntax
        run: python3 scripts/ci/test_proxy_dynamic_dns.py
      - name: Validate Java 21 backend runtime packages and privilege drop
        run: python3 scripts/ci/test_backend_runtime_packages.py
      - name: Validate mysqldump across Docker containers
        run: python3 scripts/ci/test_cross_container_mysqldump.py
      - name: Validate Android SDK mainland mirror endpoints
        run: python3 scripts/ci/test_android_sdk_mirror.py
      - name: Prove sdkmanager installs through mainland mirror with Google blocked
        run: python3 scripts/ci/test_android_sdkmanager_mainland_mirror.py
