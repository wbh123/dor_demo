name: Mobile Label History Menu Verification

on:
  push:
    branches:
      - verify/mobile-status-inspection-red-20260817

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private candidate
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/mobile-label-history-menu-safe-area-20260817
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run historical label menu regression
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/resource-label-batch-history-menu-layout.spec.ts
