name: Tablet Viewport Regression Verification

on:
  push:
    branches:
      - verify/mobile-status-inspection-red-20260817

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private candidate
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/tablet-profile-full-height-20260817
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run tablet viewport regressions
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/account-identity-menu.spec.ts src/platform/tablet-responsive-layout.spec.ts
