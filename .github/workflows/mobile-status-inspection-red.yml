name: Mobile Status Inspection RED

on:
  push:
    branches:
      - verify/mobile-status-inspection-red-20260817

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private candidate
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/mobile-dashboard-status-colors-inspection-tab-20260817
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm ci
      - name: Verify regression tests are red before implementation
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/mobile-dashboard-color-contract.spec.ts src/platform/inspection-navigation.spec.ts
