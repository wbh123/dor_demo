name: Mobile Status Inspection Verification

on:
  push:
    branches:
      - verify/mobile-status-inspection-red-20260817

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private candidate
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/mobile-dashboard-status-colors-inspection-tab-20260817
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm ci
      - name: Fetch latest private main
        working-directory: private-repo
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Check mobile version source consistency
        working-directory: private-repo/app
        run: node scripts/check-version-sync.mjs
      - name: Require mobile version bump
        working-directory: private-repo/app
        run: node scripts/check-version-bump.mjs origin/main
      - name: Run full mobile tests
        working-directory: private-repo/app
        run: npm test
      - name: Build mobile web bundle
        working-directory: private-repo/app
        run: npm run build
