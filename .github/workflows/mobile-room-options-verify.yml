name: Mobile Room Options Verify

on:
  push:
    branches:
      - 'private-compat/fix/mobile-room-options-timeout-20260815'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: integration/mobile-room-options-timeout-main-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - name: Run focused room-options regression suite
        working-directory: private-repo/backend-java
        run: >-
          mvn -B -ntp -pl server -am test
          -Dtest=MobileRoomOptionsPerformanceTest,MobileWorkspaceFacadeTest,MobileWorkspaceControllerTest,MybatisMapperXmlTest,MybatisMySqlIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false
