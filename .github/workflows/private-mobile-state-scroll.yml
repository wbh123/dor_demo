name: Private Mobile State Scroll

on:
  push:
    branches:
      - 'private-compat/fix/mobile-checkin-state-and-scroll-layout-20260815'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private feature branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/mobile-checkin-state-and-scroll-layout-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Run selection queue contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/residency-workbench.spec.ts
      - name: Run mobile state, checkin and native overscroll contracts
        working-directory: private-repo/app
        run: |
          node --experimental-strip-types --test src/platform/mobile-state-scroll-contract.spec.ts
          node --experimental-strip-types --test src/platform/checkin-bed-workflow.spec.ts
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install
      - name: Type check mobile app
        working-directory: private-repo/app
        run: npx vue-tsc -b
      - name: Build mobile app
        working-directory: private-repo/app
        run: npm run build
      - name: Run atomic onsite checkin tests
        working-directory: private-repo/backend-java
        run: mvn -pl server -am -Dtest=MobileSelectionOnsiteCheckinServiceTest,MobileRoomSelectionBedAuditTest -Dsurefire.failIfNoSpecifiedTests=false test
