name: Private Mobile State Scroll

on:
  push:
    branches:
      - 'private-compat/fix/mobile-checkin-state-and-scroll-layout-20260815'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private regression branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: test/mobile-selection-checkin-regression-contracts-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install
      - name: Run full mobile tests
        working-directory: private-repo/app
        run: npm test
      - name: Type check mobile app
        working-directory: private-repo/app
        run: npx vue-tsc -b
      - name: Build mobile app
        working-directory: private-repo/app
        run: npm run build
      - name: Sync Capacitor Android
        working-directory: private-repo/app
        run: npx cap sync android
      - name: Verify Android Gradle build
        working-directory: private-repo/app/android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
