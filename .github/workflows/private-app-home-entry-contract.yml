name: Private App Home Entry Contract

on:
  push:
    branches:
      - 'private-compat/fix/app-home-remove-duplicate-scan-anomaly-20260816'

permissions:
  contents: read

jobs:
  candidate-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/app-home-remove-duplicate-scan-anomaly-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json
      - working-directory: private-repo/app
        run: npm ci
      - name: Run candidate APP specs one by one
        working-directory: private-repo/app
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          while IFS= read -r spec; do
            [[ -z "$spec" ]] && continue
            if ! node --experimental-strip-types --test "$spec"; then
              echo "::error file=$spec::Candidate standalone APP spec failed"
              failures=$((failures + 1))
            fi
          done < <(node -e "const p=require('./package.json'); for (const x of p.scripts.test.split(/\\s+/)) if (x.endsWith('.ts')) console.log(x)")
          echo "candidate_failed_spec_count=$failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0

  baseline-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: main
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json
      - working-directory: private-repo/app
        run: npm ci
      - name: Run main APP specs one by one
        working-directory: private-repo/app
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          while IFS= read -r spec; do
            [[ -z "$spec" ]] && continue
            if ! node --experimental-strip-types --test "$spec"; then
              echo "::error file=$spec::Main standalone APP spec failed"
              failures=$((failures + 1))
            fi
          done < <(node -e "const p=require('./package.json'); for (const x of p.scripts.test.split(/\\s+/)) if (x.endsWith('.ts')) console.log(x)")
          echo "baseline_failed_spec_count=$failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0

  candidate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/app-home-remove-duplicate-scan-anomaly-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json
      - working-directory: private-repo/app
        run: npm ci
      - name: Build candidate APP
        working-directory: private-repo/app
        run: npm run build
