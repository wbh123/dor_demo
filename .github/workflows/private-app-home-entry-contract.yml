name: Private App Home Entry Contract

on:
  push:
    branches:
      - 'private-compat/fix/app-home-remove-duplicate-scan-anomaly-20260816'

permissions:
  contents: read

jobs:
  app-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private repair branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/app-home-remove-duplicate-scan-anomaly-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json
      - name: Install APP dependencies
        working-directory: private-repo/app
        run: npm ci
      - name: Run APP tests
        working-directory: private-repo/app
        run: npm test
      - name: Build APP
        working-directory: private-repo/app
        run: npm run build
