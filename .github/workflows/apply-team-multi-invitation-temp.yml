name: Apply Team Multi Invitation Fix
on:
  push:
    branches:
      - fix/team-multi-invitation-20260806
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: apply-team-multi-invitation
  cancel-in-progress: false
jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/team-multi-invitation-20260806')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/team-multi-invitation-20260806
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          echo '524af1d4fd87c44da2c7b38a345fcd6b249fa2c73d954abba476945d8369287a  scripts/ci/team-multi-invitation/patch.b64' | sha256sum -c -
          base64 -d scripts/ci/team-multi-invitation/patch.b64 | gzip -dc > /tmp/team-multi-invitation.patch
          echo '509d38b945621872ec5482921fc8a52dc11ef916ab75b30f33ab49c716fdd2f8  /tmp/team-multi-invitation.patch' | sha256sum -c -
      - name: Confirm RED baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('backend-java/server/src/main/java/com/wust/dormitory/student/TeamService.java').read_text(encoding='utf-8')
          test_file = Path('backend-java/server/src/test/java/com/wust/dormitory/student/TeamInvitationConcurrencyServiceTest.java')
          assert 'active_marker=1' in service, 'baseline no longer contains broad active-marker membership check'
          assert 'TEAM_INVITATION_PENDING_DUPLICATE' not in service, 'production fix already present before patch'
          assert not test_file.exists(), 'new concurrency regression test already exists before patch'
          print('RED confirmed: pending INVITED membership still blocks other teams.')
          PY
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/team-multi-invitation.patch
          git apply /tmp/team-multi-invitation.patch
          git diff --check
      - name: Correct deterministic database test stubs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend-java/server/src/test/java/com/wust/dormitory/student/TeamInvitationConcurrencyServiceTest.java')
          text = path.read_text(encoding='utf-8')
          old = """        when(jdbc.queryForObject(anyString(), any(MapSqlParameterSource.class), eq(Integer.class)))
                .thenReturn(0, 1);
        when(jdbc.queryForList(anyString(), anyMap()))
"""
          new = """        when(jdbc.queryForObject(anyString(), any(MapSqlParameterSource.class), eq(Integer.class)))
                .thenReturn(0, 0, 1);
        when(jdbc.queryForList(anyString(), anyMap()))
"""
          assert text.count(old) == 1, 'expected one duplicate-invitation MapSqlParameterSource stub sequence'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Export applied source for review
        uses: actions/upload-artifact@v4
        with:
          name: team-multi-invitation-applied-source
          path: |
            backend-java/server/src/main/java/com/wust/dormitory/student/TeamService.java
            backend-java/server/src/test/java/com/wust/dormitory/student/TeamInvitationConcurrencyServiceTest.java
          if-no-files-found: error
          retention-days: 1
      - name: Run targeted Java tests
        run: mvn -f backend-java/pom.xml -pl server -am -Dtest=TeamInvitationConcurrencyServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Run cross-layer contracts
        run: bash scripts/ci/run_contracts.sh
      - name: Remove temporary delivery files
        run: |
          rm -rf scripts/ci/team-multi-invitation
          rm -f .github/workflows/apply-team-multi-invitation-temp.yml
      - name: Commit formal source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: 支持同一学生接收多支队伍邀请'
          git push origin HEAD:fix/team-multi-invitation-20260806
