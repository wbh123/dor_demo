name: Final Main Mobile Auth Scope Labels

on:
  push:
    branches:
      - 'private-compat/feat/mobile-auth-scope-qr-v49-v50-20260815'

permissions:
  contents: read

jobs:
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private main
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: main
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            private-repo/frontend/package-lock.json
            private-repo/app/package-lock.json

      - name: Verify V49 V50 contracts
        working-directory: private-repo
        run: |
          python - <<'PY'
          from pathlib import Path
          v49=Path('backend-java/server/src/main/resources/db/migration/V49__split_admin_scope_read_write.sql').read_text()
          v50=Path('backend-java/server/src/main/resources/db/migration/V50__add_resource_labels.sql').read_text()
          assert 'scope_access' in v49 and "'ROOM'" in v49
          assert 'public_code CHAR(8)' in v50 and "REGEXP '^[0-9]{8}$'" in v50
          print('V49/V50 OK')
          PY

      - name: Verify Java
        working-directory: private-repo/backend-java
        run: mvn -B -ntp clean verify

      - name: Verify Web frontend
        working-directory: private-repo
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: bash scripts/ci/run_frontend.sh

      - name: Verify mobile frontend
        working-directory: private-repo/app
        run: |
          npm ci
          node --experimental-strip-types --test src/platform/session-invalidator.spec.ts src/platform/resource-label.spec.ts
          npm run build

      - name: Verify Android debug build
        working-directory: private-repo/app
        run: npm run android:build:debug
