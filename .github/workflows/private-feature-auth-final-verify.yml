name: Private Feature Authorization Final Verify

on:
  push:
    branches:
      - 'private-compat/fix/feature-authorization-abc-catalog-20260816'

permissions:
  contents: read

concurrency:
  group: private-feature-auth-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/feature-authorization-abc-catalog-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify feature authorization contracts
        working-directory: private-repo
        run: |
          python scripts/subscription/test_platform_feature_gui.py -v
          python scripts/subscription/test_mobile_feature_authorization.py -v

  mysql-v56:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wust_dormitory
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/feature-authorization-abc-catalog-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - name: Reproduce drift and execute V56 on MySQL 8.4
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -proot --skip-column-names wust_dormitory)
          "${MYSQL[@]}" <<'SQL'
          CREATE TABLE feature_category (
            category_code VARCHAR(16) NOT NULL PRIMARY KEY,
            category_name VARCHAR(64) NOT NULL UNIQUE,
            sort_order INT NOT NULL DEFAULT 0
          );
          CREATE TABLE feature_catalog (
            feature_code VARCHAR(96) NOT NULL PRIMARY KEY,
            phase VARCHAR(16) NOT NULL,
            category_code VARCHAR(16) NULL
          );
          INSERT INTO feature_category VALUES
            ('C','扩展业务功能',300),
            ('MOBILE','移动管理端',350);
          INSERT INTO feature_catalog VALUES
            ('P1_TEST','PHASE1','MISSING_A'),
            ('P2_TEST','PHASE2','MISSING_B'),
            ('P3_TEST','PHASE3','MISSING_C'),
            ('P3_MOBILE_ADMIN_ACCESS','PHASE3','MISSING_MOBILE');
          SQL
          "${MYSQL[@]}" < backend-java/server/src/main/resources/db/migration/V56__repair_feature_category_catalog.sql
          test "$("${MYSQL[@]}" -e "SELECT GROUP_CONCAT(category_code ORDER BY sort_order SEPARATOR ',') FROM feature_category")" = "A,B,C,MOBILE"
          test "$("${MYSQL[@]}" -e "SELECT category_code FROM feature_catalog WHERE feature_code='P1_TEST'")" = "A"
          test "$("${MYSQL[@]}" -e "SELECT category_code FROM feature_catalog WHERE feature_code='P2_TEST'")" = "B"
          test "$("${MYSQL[@]}" -e "SELECT category_code FROM feature_catalog WHERE feature_code='P3_TEST'")" = "C"
          test "$("${MYSQL[@]}" -e "SELECT category_code FROM feature_catalog WHERE feature_code='P3_MOBILE_ADMIN_ACCESS'")" = "MOBILE"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/feature-authorization-abc-catalog-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Java modules
        working-directory: private-repo/backend-java
        run: mvn -B -ntp clean verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_INSTITUTION_NAME: Example University
      VITE_CAMPUS_NAME: Example Campus
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/feature-authorization-abc-catalog-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify web frontend
        working-directory: private-repo
        run: bash scripts/ci/run_frontend.sh
