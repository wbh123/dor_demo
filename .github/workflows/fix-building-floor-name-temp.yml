name: Fix Building Floor Name
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          service_path = Path('backend-java/server/src/main/java/com/wust/dormitory/admin/RoomManagementService.java')
          text = service_path.read_text(encoding='utf-8')
          old = '''                    INSERT INTO dormitory_floor (building_id, floor_number, enabled)
                    VALUES (:buildingId, :floor, 1)
                    """, Map.of("buildingId", buildingId, "floor", floor));'''
          new = '''                    INSERT INTO dormitory_floor (building_id, floor_number, floor_name, enabled)
                    VALUES (:buildingId, :floor, :floorName, 1)
                    """, Map.of(
                            "buildingId", buildingId,
                            "floor", floor,
                            "floorName", floor + "层"));'''
          if old not in text:
              raise SystemExit('expected floor insert block not found')
          service_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          runner = Path('scripts/ci/run_contracts.sh')
          runner_text = runner.read_text(encoding='utf-8')
          command = 'python scripts/ci/test_building_floor_name_contract.py\n'
          if command not in runner_text:
              runner_text += '\n' + command
              runner.write_text(runner_text, encoding='utf-8')
          PY
          python scripts/ci/test_building_floor_name_contract.py
          bash scripts/ci/run_contracts.sh
          rm -f .github/workflows/fix-building-floor-name-temp.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: write floor names when creating buildings"
          git push origin HEAD:main
