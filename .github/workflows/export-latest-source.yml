name: Export latest public source

on:
  push:
    branches:
      - export/latest-public-main-20260804
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package source
        run: tar --exclude=.git --exclude=.github/workflows/export-latest-source.yml --exclude=.export-latest-source-trigger -czf "${RUNNER_TEMP}/latest-public-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: latest-public-source
          path: ${{ runner.temp }}/latest-public-source.tar.gz
          retention-days: 1
