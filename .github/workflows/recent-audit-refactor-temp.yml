name: Apply Recent Audit Log Refactor

on:
  push:
    branches:
      - refactor/recent-audit-log-mapper-20260806

permissions:
  contents: write

concurrency:
  group: recent-audit-refactor-temp
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/recent-audit-log-mapper-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply incremental refactor
        run: python scripts/ci/apply_recent_audit_log_refactor.py
      - name: Remove temporary migration files
        run: |
          rm -f scripts/ci/apply_recent_audit_log_refactor.py
          rm -f .github/workflows/recent-audit-refactor-temp.yml
      - name: Commit formal source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: move recent audit logs to dedicated MyBatis service"
          git push origin HEAD:refactor/recent-audit-log-mapper-20260806
