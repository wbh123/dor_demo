name: Fix Building Floor Name Branch
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/building-floor-name-20260805
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          service_path = Path('backend-java/server/src/main/java/com/wust/dormitory/admin/RoomManagementService.java')
          text = service_path.read_text(encoding='utf-8')
          replacements = [
              ('INSERT INTO dormitory_floor (building_id, floor_number, enabled)',
               'INSERT INTO dormitory_floor (building_id, floor_number, floor_name, enabled)'),
              ('VALUES (:buildingId, :floor, 1)',
               'VALUES (:buildingId, :floor, :floorName, 1)'),
              ('""", Map.of("buildingId", buildingId, "floor", floor));',
               '""", Map.of(\n                            "buildingId", buildingId,\n                            "floor", floor,\n                            "floorName", floor + "层"));'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected floor insert fragment not found: {old}')
              text = text.replace(old, new, 1)
          service_path.write_text(text, encoding='utf-8')

          runner = Path('scripts/ci/run_contracts.sh')
          runner_text = runner.read_text(encoding='utf-8')
          command = 'python3 "$ROOT_DIR/scripts/ci/test_building_floor_name_contract.py"\n'
          if command not in runner_text:
              runner_text += '\n' + command
              runner.write_text(runner_text, encoding='utf-8')
          PY
          python scripts/ci/test_building_floor_name_contract.py
          bash scripts/ci/run_contracts.sh
          rm -f .github/workflows/fix-building-floor-name-branch-temp.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: write floor names when creating buildings"
          git push origin HEAD:fix/building-floor-name-20260805
