name: Validate mobile version bump

on:
  push:
    branches:
      - diagnostics/mobile-profile-account-menu-20260816

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/mobile-version-governance-1.4.3-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Sync package lock version
        working-directory: private-repo/app
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        working-directory: private-repo
        run: |
          if git diff --quiet -- app/package-lock.json; then
            echo 'package-lock already synchronized'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/package-lock.json
            git commit -m 'chore: sync mobile package lock version'
            git push origin HEAD:fix/mobile-version-governance-1.4.3-20260816
          fi
      - name: Version consistency
        working-directory: private-repo/app
        run: node scripts/check-version-sync.mjs
      - name: Version bump guard
        working-directory: private-repo/app
        run: node scripts/check-version-bump.mjs ec61d86a3ab358583887f1a61dd47238d5f92471
