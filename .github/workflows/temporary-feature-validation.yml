name: Temporary feature validation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-team-i18n-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wust_dormitory
          MYSQL_USER: wust_dormitory
          MYSQL_PASSWORD: RuntimeTestPassword2026
          MYSQL_ROOT_PASSWORD: RuntimeRootPassword2026
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pRuntimeRootPassword2026"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    env:
      WUST_DORMITORY_DB_HOST: 127.0.0.1
      WUST_DORMITORY_DB_PORT: '3306'
      WUST_DORMITORY_DB_NAME: wust_dormitory
      WUST_DORMITORY_DB_USER: wust_dormitory
      WUST_DORMITORY_DB_PASSWORD: RuntimeTestPassword2026
      WUST_DORMITORY_REDIS_HOST: 127.0.0.1
      WUST_DORMITORY_REDIS_PORT: '6379'
      WUST_DORMITORY_REDIS_PASSWORD: ''
      WUST_DORMITORY_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:backend-java/server/src/test/resources/db/dev-migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/team-i18n-layout-refinement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate feature branch and record result
        shell: bash
        run: |
          set +e
          LOG=/tmp/feature-validation.log
          : > "$LOG"
          run_step() {
            echo "===== $1 =====" | tee -a "$LOG"
            shift
            "$@" 2>&1 | tee -a "$LOG"
            local step_status=${PIPESTATUS[0]}
            if [ $step_status -ne 0 ]; then
              echo "FAILED_STEP=$1" >> /tmp/validation-status.env
              return $step_status
            fi
          }

          python -m pip install --disable-pip-version-check pyyaml pymysql 2>&1 | tee -a "$LOG"
          STATUS=${PIPESTATUS[0]}

          if [ $STATUS -eq 0 ]; then
            python scripts/db/build_frozen_baseline.py 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            python -m unittest \
              scripts/dev/test_infra_config.py \
              scripts/db/test_database_baseline.py \
              scripts/db/test_mysql_compatibility.py \
              scripts/db/test_frozen_schema.py \
              scripts/api/test_openapi_contract.py \
              scripts/backend/test_phase1_source.py \
              scripts/frontend/test_frontend_baseline.py \
              scripts/ux/test_ux_refinement.py \
              scripts/experience/test_student_experience.py \
              scripts/phase2/test_room_layout.py \
              scripts/phase2/test_room_bed_type_and_preference_ui.py \
              scripts/phase2/test_team_i18n_layout_refinement.py \
              scripts/phase2/test_matching_operations.py -v 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            mvn -f backend-java/pom.xml --batch-mode --no-transfer-progress clean verify 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            (cd frontend && npm install --no-audit --no-fund && npm run build) 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            mvn -f backend-java/pom.xml --batch-mode --no-transfer-progress package -DskipTests 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            java -jar backend-java/starter/target/Service.jar > /tmp/wust-dormitory.log 2>&1 &
            echo $! > /tmp/wust-dormitory.pid
            HEALTH=1
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:8080/actuator/health; then
                HEALTH=0
                break
              fi
              sleep 2
            done
            if [ $HEALTH -ne 0 ]; then
              cat /tmp/wust-dormitory.log | tee -a "$LOG"
              STATUS=1
            fi
          fi
          if [ $STATUS -eq 0 ]; then
            python scripts/e2e/phase1_smoke.py 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            python scripts/e2e/student_experience_smoke.py 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            python scripts/e2e/team_invite_smoke.py 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            python scripts/e2e/phase2_room_layout_smoke.py 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -eq 0 ]; then
            python scripts/e2e/phase2_matching_operations_smoke.py 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
          fi

          mkdir -p docs/ci
          if [ $STATUS -eq 0 ]; then
            {
              echo "status=success"
              echo "validated_commit=$(git rev-parse HEAD)"
              echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > docs/ci/team-i18n-validation.txt
            rm -f docs/ci/team-i18n-validation-failure.log
          else
            {
              echo "status=failure"
              echo "validated_commit=$(git rev-parse HEAD)"
              echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > docs/ci/team-i18n-validation.txt
            tail -n 500 "$LOG" > docs/ci/team-i18n-validation-failure.log
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-java/docs/sql/schema.sql docs/ci/team-i18n-validation.txt docs/ci/team-i18n-validation-failure.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: 记录组队国际化验证结果"
            git push origin HEAD:feature/team-i18n-layout-refinement
          fi

          exit $STATUS
