name: Phase 1 and 2 CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    name: Static contract and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run infrastructure tests
        run: python -m unittest scripts/dev/test_infra_config.py -v
      - name: Run database tests
        run: python -m unittest scripts/db/test_database_baseline.py scripts/db/test_mysql_compatibility.py scripts/db/test_frozen_schema.py -v
      - name: Run OpenAPI contract tests
        run: python -m unittest scripts/api/test_openapi_contract.py -v
      - name: Run backend source tests
        run: python -m unittest scripts/backend/test_phase1_source.py -v
      - name: Run frontend source tests
        run: python -m unittest scripts/frontend/test_frontend_baseline.py -v
      - name: Run UX refinement tests
        run: python -m unittest scripts/ux/test_ux_refinement.py -v
      - name: Run student experience tests
        run: python -m unittest scripts/experience/test_student_experience.py -v
      - name: Run Phase 2 room layout tests
        run: python -m unittest scripts/phase2/test_room_layout.py -v
      - name: Run Phase 2 matching operations tests
        run: python -m unittest scripts/phase2/test_matching_operations.py -v

  backend:
    name: Generate OpenAPI and build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate API and compile all modules
        run: mvn -f backend-java/pom.xml --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Generate types and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Generate OpenAPI types and build
        working-directory: frontend
        run: npm run build

  runtime-smoke:
    name: Run Flyway and Spring Boot against MySQL and Redis
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wust_dormitory
          MYSQL_USER: wust_dormitory
          MYSQL_PASSWORD: RuntimeTestPassword2026
          MYSQL_ROOT_PASSWORD: RuntimeRootPassword2026
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pRuntimeRootPassword2026"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    env:
      WUST_DORMITORY_DB_HOST: 127.0.0.1
      WUST_DORMITORY_DB_PORT: '3306'
      WUST_DORMITORY_DB_NAME: wust_dormitory
      WUST_DORMITORY_DB_USER: wust_dormitory
      WUST_DORMITORY_DB_PASSWORD: RuntimeTestPassword2026
      WUST_DORMITORY_REDIS_HOST: 127.0.0.1
      WUST_DORMITORY_REDIS_PORT: '6379'
      WUST_DORMITORY_REDIS_PASSWORD: ''
      WUST_DORMITORY_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:backend-java/server/src/test/resources/db/dev-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build executable service
        run: mvn -f backend-java/pom.xml --batch-mode --no-transfer-progress clean package -DskipTests
      - name: Start service and wait for health
        run: |
          java -jar backend-java/starter/target/Service.jar > /tmp/wust-dormitory.log 2>&1 &
          echo $! > /tmp/wust-dormitory.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wust-dormitory.log
          exit 1
      - name: Assert Flyway V8 and matching revision rules
        run: |
          python -m pip install --disable-pip-version-check pymysql
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(
              host='127.0.0.1',
              port=3306,
              user='wust_dormitory',
              password='RuntimeTestPassword2026',
              database='wust_dormitory',
              charset='utf8mb4',
          )
          with connection.cursor() as cursor:
              cursor.execute("SELECT MAX(CAST(version AS UNSIGNED)) FROM flyway_schema_history WHERE success=1")
              assert cursor.fetchone()[0] >= 8
              cursor.execute("SHOW TABLES LIKE 'major'")
              assert cursor.fetchone() is not None
              cursor.execute("SHOW TABLES LIKE 'organization'")
              assert cursor.fetchone() is None
              cursor.execute("SHOW TABLES LIKE 'active_batch_student_lock'")
              assert cursor.fetchone() is not None
              cursor.execute("SHOW TABLES LIKE 'room_bed_layout'")
              assert cursor.fetchone() is not None
              cursor.execute("SHOW TABLES LIKE 'system_setting'")
              assert cursor.fetchone() is not None
              cursor.execute("SHOW COLUMNS FROM app_user LIKE 'welcome_acknowledged_at'")
              assert cursor.fetchone() is not None
              cursor.execute("SELECT setting_value FROM system_setting WHERE setting_key='STUDENT_WELCOME_MESSAGE'")
              assert cursor.fetchone()[0]
              cursor.execute("SHOW COLUMNS FROM room_bed_layout")
              layout_columns = {row[0] for row in cursor.fetchall()}
              assert layout_columns == {
                  'bed_id', 'layout_x', 'layout_z', 'rotation_degrees',
                  'updated_by', 'version', 'created_at', 'updated_at'
              }
              cursor.execute("SHOW COLUMNS FROM matching_weight_scheme")
              scheme_columns = {row[0] for row in cursor.fetchall()}
              assert {'revision', 'created_by', 'change_reason', 'published_at'} <= scheme_columns
              cursor.execute("SHOW INDEX FROM matching_weight_scheme WHERE Key_name='uk_weight_scheme_revision'")
              assert len(cursor.fetchall()) == 2
              cursor.execute("SELECT COUNT(*) FROM matching_weight_scheme WHERE enabled=1")
              assert cursor.fetchone()[0] == 1
              cursor.execute("SHOW COLUMNS FROM student")
              columns = {row[0] for row in cursor.fetchall()}
              assert columns == {'id', 'student_number', 'student_name', 'gender', 'major_id', 'created_at', 'updated_at'}
              cursor.execute("SELECT question_type FROM questionnaire_question WHERE question_code='SMOKING_ACCEPTANCE'")
              assert cursor.fetchone()[0] == 'SINGLE_CHOICE'
              cursor.execute("""
                  SELECT GROUP_CONCAT(qo.option_code ORDER BY qo.sort_order)
                  FROM questionnaire_option qo
                  JOIN questionnaire_question qq ON qq.id=qo.question_id
                  WHERE qq.question_code='SMOKING_ACCEPTANCE'
              """)
              assert cursor.fetchone()[0] == 'ACCEPT,REJECT,ANY'
              cursor.execute("SELECT COUNT(*) FROM questionnaire_question WHERE question_code IN ('SUMMER_AC_OVERNIGHT','SUMMER_AC_TEMPERATURE','WINTER_HEATING_ACCEPTANCE','WINTER_HEATING_TEMPERATURE','AFTER_LIGHTS_ACTIVITY','ALARM_SNOOZE','STRONG_FOOD_ODOR_ACCEPTANCE')")
              assert cursor.fetchone()[0] == 7
          connection.close()
          PY
      - name: Run full Phase 1 and Phase 2 HTTP smoke flow
        run: |
          python scripts/e2e/phase1_smoke.py
          python scripts/e2e/student_experience_smoke.py
          python scripts/e2e/team_invite_smoke.py
          python scripts/e2e/phase2_room_layout_smoke.py
          python scripts/e2e/phase2_matching_operations_smoke.py
      - name: Print service log
        if: always()
        run: cat /tmp/wust-dormitory.log || true
