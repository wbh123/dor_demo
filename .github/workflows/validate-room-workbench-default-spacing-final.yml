name: Validate Room Workbench Default Spacing Final

on:
  push:
    branches:
      - 'private-validate/mobile-room-workbench-default-spacing-final'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private target branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/mobile-room-workbench-default-spacing-20260817
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APP dependencies
        working-directory: private-repo/app
        run: npm install --no-audit --no-fund

      - name: Verify version source
        working-directory: private-repo/app
        run: node scripts/check-version-sync.mjs

      - name: Verify version increment against main
        working-directory: private-repo/app
        run: node scripts/check-version-bump.mjs origin/main

      - name: Run room workbench regression
        working-directory: private-repo/app
        run: node --test src/platform/room-workbench-layout.spec.ts

      - name: Run mobile full tests
        working-directory: private-repo/app
        run: npm test

      - name: Run TypeScript typecheck
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Build production APP
        working-directory: private-repo/app
        run: npm run build

      - name: Build Android Debug APK
        working-directory: private-repo/app
        run: npm run android:build:debug
