name: Private Mobile Diagnostics

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install --no-audit --no-fund
      - name: Run mobile tests
        working-directory: private-repo/app
        run: npm test
      - name: Run mobile typecheck
        working-directory: private-repo/app
        run: npm run typecheck
      - name: Build mobile web bundle
        working-directory: private-repo/app
        run: npm run build
      - name: Build Android debug APK
        working-directory: private-repo/app
        run: npm run android:build:debug
