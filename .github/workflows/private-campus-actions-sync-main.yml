name: Private Campus Actions Sync Main

on:
  push:
    branches:
      - 'private-compat/fix/campus-disable-delete-actions-20260816'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private repair branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/campus-disable-delete-actions-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0
      - name: Merge latest main without overwriting parallel changes
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "548c84097474b90ba60eab73515bfb9b5ca4f04a"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "e8bac247aa97a0053711a93a2238922a7173cefa"
          git config user.name "Wust Dormitory CI"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit origin/main
          git diff --check origin/main...HEAD
          git push origin HEAD:refs/heads/fix/campus-disable-delete-actions-20260816
