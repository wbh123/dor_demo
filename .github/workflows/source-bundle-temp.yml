name: Apply UI Patch
on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dormitory-login-preference-ui-20260805
      - name: Apply patch
        run: |
          cat scripts/ci/patch_chunk_*.txt | base64 -d | gzip -d > /tmp/ui.patch
          awk '
            /^diff -ruN .*\.github\/workflows\/source-bundle-temp\.yml / { skip=1; next }
            skip && /^diff -ruN / { skip=0 }
            !skip { print }
          ' /tmp/ui.patch > /tmp/ui-clean.patch
          patch --batch --forward -p1 < /tmp/ui-clean.patch
          rm -f scripts/ci/patch_chunk_*.txt .github/workflows/source-bundle-temp.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: improve dormitory resources login and preference UI"
          git push origin HEAD:fix/dormitory-login-preference-ui-20260805
