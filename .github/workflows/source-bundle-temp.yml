name: Temporary Source Bundle
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: source-bundle
          path: .
          include-hidden-files: true
          retention-days: 1
