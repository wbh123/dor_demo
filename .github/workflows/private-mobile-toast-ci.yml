name: Private Mobile Toast CI

on:
  push:
    branches:
      - 'private-compat/refactor/mobile-global-toast-20260815'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/mobile-global-toast-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run mobile notice contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/mobile-notice.spec.ts

      - name: Run transient notice contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/mobile-transient-notice-layout.spec.ts

      - name: Audit all mobile transient notices
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/mobile-notice-audit.spec.ts

      - name: Run mobile login emblem contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/login-emblem-layout.spec.ts

      - name: Install dependencies
        if: success()
        working-directory: private-repo/app
        run: npm install --no-audit --no-fund

      - name: Run mobile tests
        id: mobile_tests
        if: success()
        working-directory: private-repo/app
        shell: bash
        run: |
          set +e
          npm test > ../mobile-test-output.txt 2>&1
          status=$?
          cat ../mobile-test-output.txt
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload mobile test output
        if: always() && steps.mobile_tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-output
          path: private-repo/mobile-test-output.txt
          if-no-files-found: error

      - name: Fail on mobile test errors
        if: steps.mobile_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Typecheck mobile app
        if: success()
        working-directory: private-repo/app
        run: npm run generate:api && npm run typecheck

      - name: Build mobile app
        if: success()
        working-directory: private-repo/app
        run: npm run build

      - name: Verify emblem is bundled
        if: success()
        working-directory: private-repo/app
        run: test -f dist/logo-only.png
