name: Validate batch scope pagination

on:
  push:
    branches:
      - diagnostics/batch-scope-pagination-20260816

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/batch-scope-server-pagination-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Preflight SQL contract
        working-directory: private-repo
        run: python scripts/ci/test_batch_scope_preflight_sql.py
      - name: Backend focused tests
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl server -am -Dtest=BatchScopeQueryServiceTest,BatchScopeServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Frontend install
        working-directory: private-repo/frontend
        run: npm ci --ignore-scripts
      - name: Frontend tests
        working-directory: private-repo/frontend
        run: npm test
      - name: Frontend typecheck
        working-directory: private-repo/frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: private-repo/frontend
        run: npm run build
