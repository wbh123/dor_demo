name: Private Mobile Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-mobile-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-mobile:
    name: Verify private mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          [[ -n "$private_ref" && "$private_ref" != "$candidate" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm ci
      - name: Verify mobile OpenAPI drift
        working-directory: private-repo/app
        run: npm run generate:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Verify auth navigation and inspection tests
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/api/auth-policy.spec.ts src/platform/navigation.spec.ts src/platform/header-navigation.spec.ts src/platform/tablet-navigation.spec.ts src/platform/account-identity-menu.spec.ts src/inspection/state.spec.ts src/inspection/store.spec.ts src/platform/inspection-navigation.spec.ts src/platform/inspection-workflow-layout.spec.ts src/platform/inspection-scanner.spec.ts
      - name: Verify scanner test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/scanner.spec.ts
      - name: Verify resource label test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/resource-label.spec.ts
      - name: Verify resource label print layout test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/resource-label-print-layout.spec.ts
      - name: Verify tablet print fixed test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/tablet-print-fixed-contract.spec.ts
      - name: Verify mobile label tools navigation test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/mobile-label-tools-navigation.spec.ts
      - name: Verify label scan performance test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/label-scan-performance-contract.spec.ts
      - name: Verify room selection workbench tests
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/placement.spec.ts src/platform/room-options.spec.ts src/platform/room-selector.spec.ts src/platform/room-selector-layout.spec.ts src/platform/room-navigation.spec.ts src/platform/issue-room-context.spec.ts src/platform/bed-finder.spec.ts src/platform/bed-finder-layout.spec.ts
      - name: Verify residency and student workbench tests
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/residency-workbench.spec.ts src/platform/student-adjustment-panel-layout.spec.ts src/platform/student-residency-workbench-layout.spec.ts src/platform/student-workbench-pagination.spec.ts
      - name: Verify room workbench layout test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/room-workbench-layout.spec.ts
      - name: Verify confirmation pipeline actions contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test --test-name-pattern='选寝模式连续确认面板' src/platform/room-confirmation-pipeline-layout.spec.ts
      - name: Verify occupied bed confirmation contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test --test-name-pattern='已占床只用于定位占用学生' src/platform/room-confirmation-pipeline-layout.spec.ts
      - name: Verify room confirmation permission contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test --test-name-pattern='寝室详情是统一确认工作台' src/platform/room-confirmation-pipeline-layout.spec.ts
      - name: Verify confirmation soft refresh contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test --test-name-pattern='流水线确认成功后软刷新寝室数据' src/platform/room-confirmation-pipeline-layout.spec.ts
      - name: Verify confirmation worklist deep-link contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test --test-name-pattern='确认任务列表的选房与选床入口' src/platform/room-confirmation-pipeline-layout.spec.ts
      - name: Verify legacy confirmation redirect contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test --test-name-pattern='旧独立寝室确认页面被移除' src/platform/room-confirmation-pipeline-layout.spec.ts
      - name: Verify room detail layout test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/room-detail-layout.spec.ts
      - name: Verify bed confirmation pagination test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/bed-confirmation-pagination.spec.ts
      - name: Verify workbench home and state tests
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/recent-workbench.spec.ts src/platform/room-workbench-home.spec.ts src/platform/room-workbench-state.spec.ts src/platform/student-workbench-filter.spec.ts src/platform/student-workbench-home.spec.ts
      - name: Verify runtime and recovery tests
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/native-runtime.spec.ts src/platform/native-scanner-contract.spec.ts src/platform/native-app-runtime.spec.ts src/platform/network-runtime.spec.ts src/platform/server-profile.spec.ts src/platform/server-runtime-contract.spec.ts src/platform/secure-storage-contract.spec.ts src/platform/server-switch.spec.ts src/platform/server-control.spec.ts src/platform/server-scoped-cache.spec.ts src/platform/server-settings-view.spec.ts src/platform/native-recovery-contract.spec.ts src/platform/recovery-provisioning.spec.ts src/platform/recovery-runtime-contract.spec.ts src/platform/recovery-settings-view.spec.ts src/platform/recovery-entry.spec.ts src/platform/connection-recovery-view.spec.ts src/platform/initial-server-provisioning.spec.ts src/platform/native-http-gateway-contract.spec.ts src/platform/recovery-audit-contract.spec.ts src/platform/app-update-metadata-contract.spec.ts src/platform/native-apk-updater-contract.spec.ts src/platform/app-update-gate.spec.ts src/platform/app-update-flow.spec.ts
      - name: Verify layout overlay and notice tests
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/natural-resource-sort.spec.ts src/platform/vite-dev-proxy-contract.spec.ts src/platform/page-heading-layout.spec.ts src/platform/global-mobile-header-layout.spec.ts src/platform/home-viewport.spec.ts src/platform/device-form-factor.spec.ts src/platform/orientation-policy.spec.ts src/platform/device-runtime.spec.ts src/platform/tablet-responsive-layout.spec.ts src/platform/tablet-shell-layout.spec.ts src/platform/login-device-layout.spec.ts src/platform/android-adaptive-shell-contract.spec.ts src/platform/server-probe-login-entry.spec.ts src/platform/action-overlay.spec.ts src/platform/student-placement-overlay.spec.ts src/platform/room-detail-overlay.spec.ts src/platform/student-workbench-overlay.spec.ts src/platform/room-workbench-overlay.spec.ts src/platform/mobile-overlay-flow.spec.ts src/platform/issue-overlay-flow.spec.ts src/platform/checkin-bed-workflow.spec.ts src/platform/dorm-staff-bed-verification.spec.ts src/platform/mobile-notice.spec.ts src/platform/mobile-transient-notice-layout.spec.ts src/platform/mobile-notice-audit.spec.ts src/platform/login-emblem-layout.spec.ts
      - name: Verify full mobile test script
        working-directory: private-repo/app
        run: npm test
      - name: Verify mobile typecheck
        working-directory: private-repo/app
        run: npm run typecheck
      - name: Verify mobile production build
        working-directory: private-repo/app
        run: npm run build
