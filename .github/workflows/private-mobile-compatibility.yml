name: Private Mobile Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-mobile-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-mobile:
    name: Verify private mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          [[ -n "$private_ref" && "$private_ref" != "$candidate" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm ci
      - name: Verify mobile OpenAPI drift
        working-directory: private-repo/app
        run: npm run generate:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Verify auth policy test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/api/auth-policy.spec.ts
      - name: Verify navigation test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/navigation.spec.ts
      - name: Verify header navigation test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/header-navigation.spec.ts
      - name: Verify tablet navigation test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/tablet-navigation.spec.ts
      - name: Verify account identity menu test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/account-identity-menu.spec.ts
      - name: Verify inspection state test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/inspection/state.spec.ts
      - name: Verify inspection store test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/inspection/store.spec.ts
      - name: Verify inspection navigation test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/inspection-navigation.spec.ts
      - name: Verify inspection workflow layout test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/inspection-workflow-layout.spec.ts
      - name: Verify inspection scanner test
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/inspection-scanner.spec.ts
      - name: Verify remaining mobile tests
        working-directory: private-repo/app
        run: npm test
      - name: Verify mobile typecheck
        working-directory: private-repo/app
        run: npm run typecheck
      - name: Verify mobile production build
        working-directory: private-repo/app
        run: npm run build
