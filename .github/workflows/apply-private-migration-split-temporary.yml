name: Apply private migration split temporary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/private-migration-split-20260805
          fetch-depth: 0
      - name: Split large views deterministically
        shell: python
        run: |
          from pathlib import Path
          import re
          files = [
              Path('frontend/src/views/admin/AdminBatchView.vue'),
              Path('frontend/src/views/admin/AdminDataView.vue'),
              Path('frontend/src/views/student/StudentHomeContent.vue'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              match = re.fullmatch(r'(?s)<script setup lang="ts">\n(.*?)\n</script>\n\n<template>\n(.*?)\n</template>\n\n<style scoped>\n(.*?)\n</style>\n?', text)
              if not match:
                  raise RuntimeError(f'cannot parse {path}')
              script, template, style = match.groups()
              component_imports, logic_imports, body = [], [], []
              in_imports = True
              for line in script.splitlines():
                  if in_imports and (line.startswith('import ') or not line.strip()):
                      if line.startswith('import '):
                          (component_imports if '.vue' in line else logic_imports).append(line)
                      continue
                  in_imports = False
                  body.append(line)
              names = []
              for line in body:
                  if line.startswith('const {'):
                      inside = line.split('{', 1)[1].split('}', 1)[0]
                      for part in inside.split(','):
                          name = part.strip().split(':', 1)[0].strip()
                          if name and name not in names:
                              names.append(name)
                  declaration = re.match(r'^(?:const|let|var)\s+([A-Za-z_$][\w$]*)', line)
                  if declaration and declaration.group(1) not in names:
                      names.append(declaration.group(1))
                  function = re.match(r'^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)', line)
                  if function and function.group(1) not in names:
                      names.append(function.group(1))
              stem = path.stem
              hook = f'use{stem}'
              indented = '\n'.join(('  ' + line if line else '') for line in body)
              returns = ',\n'.join('    ' + name for name in names)
              logic = '\n'.join(logic_imports) + f'\n\nexport function {hook}() {{\n{indented}\n\n  return {{\n{returns}\n  }}\n}}\n'
              wrapper = '<script setup lang="ts">\n'
              if component_imports:
                  wrapper += '\n'.join(component_imports) + '\n'
              wrapper += f"import {{ {hook} }} from './{stem}.logic'\n\n"
              wrapper += 'const {\n' + ',\n'.join('  ' + name for name in names) + f'\n}} = {hook}()\n'
              wrapper += '</script>\n\n'
              wrapper += f'<template src="./{stem}.template.html"></template>\n\n'
              wrapper += f'<style scoped src="./{stem}.css"></style>\n'
              path.write_text(wrapper, encoding='utf-8')
              path.with_name(f'{stem}.logic.ts').write_text(logic, encoding='utf-8')
              path.with_name(f'{stem}.template.html').write_text(template + '\n', encoding='utf-8')
              path.with_name(f'{stem}.css').write_text(style + '\n', encoding='utf-8')
      - name: Commit split views
        run: |
          rm -f .github/workflows/apply-private-migration-split-temporary.yml
          git config user.name "wbh123"
          git config user.email "21192079+wbh123@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 拆分大型页面以支持稳定迁移"
          git push origin HEAD
