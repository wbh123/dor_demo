name: Mobile Admin P0 Focused Validation

on:
  push:
    branches:
      - 'private-compat/main'
    paths:
      - '.mobile-p0-trigger'
      - '.github/workflows/mobile-admin-p0-validation.yml'

permissions:
  contents: read

jobs:
  validate-mobile-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private main
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: main
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1

      - name: Verify private main head
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "private main: $actual"
          test "$actual" = "21934caefc9df5a0b52bb91dc7f66f1376fe339e"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate mobile app
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - name: Validate backend
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify

      - name: Validate existing web frontend
        working-directory: private-repo
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          bash scripts/ci/run_frontend.sh
