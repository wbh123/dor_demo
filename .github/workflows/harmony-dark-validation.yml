name: HarmonyOS Dark Mode Validation

on:
  push:
    branches:
      - private-compat/fix/harmonyos2-dark-mode-runtime-20260818
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/harmonyos2-dark-mode-runtime-20260818
          token: ${{ secrets.PRIVATE_CI }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run HarmonyOS appearance contract
        working-directory: app
        run: node --experimental-strip-types --test src/platform/native-appearance-contract.spec.ts
