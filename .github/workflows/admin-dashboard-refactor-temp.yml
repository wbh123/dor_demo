name: Apply Admin Dashboard Mapper Refactor

on:
  push:
    branches:
      - refactor/admin-dashboard-mapper-20260806

permissions:
  contents: write

concurrency:
  group: admin-dashboard-refactor-temp
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/admin-dashboard-mapper-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply incremental service refactor
        run: python scripts/ci/apply_admin_dashboard_mapper_refactor.py
      - name: Remove temporary migration files
        run: |
          rm -f scripts/ci/apply_admin_dashboard_mapper_refactor.py
          rm -f .github/workflows/admin-dashboard-refactor-temp.yml
      - name: Commit formal source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: migrate admin dashboard statistics to MyBatis"
          git push origin HEAD:refactor/admin-dashboard-mapper-20260806
