name: Apply split refactor temporary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: refactor/split-large-views-20260804
          fetch-depth: 0
      - name: Rebuild and apply verified patch
        run: |
          cat .automation/split-refactor.part* | base64 -d > /tmp/split.patch.gz
          echo "19409e4dbf9fd5bdb5f9ee1a1a486563bcf98bccf95ef27d14b715194a8ae007  /tmp/split.patch.gz" | sha256sum -c -
          gzip -dc /tmp/split.patch.gz > /tmp/split.patch
          echo "d24d9027f2d0507a80687f114057eff7d8be1ebaf6b1bc3a623c37e21860bcfc  /tmp/split.patch" | sha256sum -c -
          git apply --check /tmp/split.patch
          git apply /tmp/split.patch
      - name: Commit split refactor
        run: |
          rm -rf .automation
          rm -f .github/workflows/apply-split-refactor-temporary.yml
          git config user.name "wbh123"
          git config user.email "21192079+wbh123@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 拆分大型页面以便稳定迁移"
          git push origin HEAD:refactor/split-large-views-20260804
