name: Apply batch scope pagination

on:
  push:
    branches:
      - diagnostics/batch-scope-pagination-20260816

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/batch-scope-server-pagination-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
      - name: Patch batch scope frontend integration
        working-directory: private-repo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          p = root / 'frontend/src/features/admin-batch/composables/useAdminBatchView.ts'
          text = p.read_text()
          text = text.replace(
              "import { actionText, batchRuleSummary, formatDateTime, issueText, modeText, nextActions, statusText, toggleId, uniqueIds } from '../adminBatchViewHelpers'\n",
              "import { actionText, batchRuleSummary, formatDateTime, issueText, modeText, nextActions, statusText, toggleId, uniqueIds } from '../adminBatchViewHelpers'\nimport { useBatchScopePagination } from './useBatchScopePagination'\n"
          )
          old_decl = """  const scopeDialog = ref(false), scopeLoading = ref(false), scopeBatch = ref<DataObject | null>(null), scopeData = ref<DataObject | null>(null)\n  const selectedStudentIds = ref<number[]>([]), selectedRoomIds = ref<number[]>([])\n  const studentFilter = ref(''), studentGenderFilter = ref(''), studentCategoryFilter = ref(''), studentDegreeFilter = ref(''), studentMajorFilter = ref(''), studentGradeFilter = ref('')\n  const roomFilter = ref(''), roomGenderFilter = ref(''), roomScopeFilter = ref(''), roomBuildingFilter = ref(''), roomFloorFilter = ref('')\n"""
          new_decl = """  const scopeDialog = ref(false), scopeLoading = ref(false), scopeBatch = ref<DataObject | null>(null)\n  const {\n    scopeData, selectedStudentIds, selectedRoomIds, scopeStudents, scopeRooms, filteredStudents, filteredRooms,\n    studentFilter, studentGenderFilter, studentCategoryFilter, studentDegreeFilter, studentMajorFilter, studentGradeFilter,\n    roomFilter, roomGenderFilter, roomScopeFilter, roomCampusFilter, roomBuildingFilter, roomFloorFilter,\n    studentSortField, studentSortDirection, roomSortField, roomSortDirection,\n    scopeMajorOptions, scopeGradeOptions, scopeCampusOptions, scopeBuildingOptions, scopeFloorOptions,\n    studentTotal, roomTotal, studentPage, roomPage, studentPageSize, roomPageSize, studentPageLoading, roomPageLoading,\n    openScopePagination, loadStudentPage, loadRoomPage, resetScopePagination, selectAllStudents, selectAllRooms,\n  } = useBatchScopePagination()\n"""
          if old_decl not in text:
              raise SystemExit('useAdminBatchView declaration anchor missing')
          text = text.replace(old_decl, new_decl)
          text, count = re.subn(
              r"  const scopeStudents = computed\(.*?\n\n  onMounted\(load\)",
              "  onMounted(load)", text, count=1, flags=re.S
          )
          if count != 1:
              raise SystemExit('scope computed block replacement failed')
          text, count = re.subn(
              r"  async function openScope\(batch: DataObject, continuePublish = false\) \{.*?\n  function resetScopeFilters\(\) \{.*?\n  \}",
              """  async function openScope(batch: DataObject, continuePublish = false) {\n    scopeDialog.value = true; scopeLoading.value = true; scopeBatch.value = batch; publishAfterScope.value = continuePublish; error.value = ''\n    try { await openScopePagination(Number(batch.id)) }\n    catch (reason) { error.value = reason instanceof Error ? reason.message : '批次范围加载失败'; resetScopeDialog() } finally { scopeLoading.value = false }\n  }""",
              text, count=1, flags=re.S
          )
          if count != 1:
              raise SystemExit('openScope block replacement failed')
          text = text.replace(
              "  function resetScopeDialog() { scopeDialog.value = false; scopeBatch.value = null; scopeData.value = null; publishAfterScope.value = false }",
              "  function resetScopeDialog() { scopeDialog.value = false; scopeBatch.value = null; resetScopePagination(); publishAfterScope.value = false }"
          )
          text = re.sub(r"\n  function selectAllStudents\(\) \{.*?\}\n  function selectAllRooms\(\) \{.*?\}", "", text, count=1)
          old_return = "scopeDialog, scopeLoading, scopeSaving, scopeBatch, scopeData, selectedStudentIds, selectedRoomIds, studentFilter, studentGenderFilter, studentCategoryFilter, studentDegreeFilter, studentMajorFilter, studentGradeFilter, roomFilter, roomGenderFilter, roomScopeFilter, roomBuildingFilter, roomFloorFilter"
          new_return = "scopeDialog, scopeLoading, scopeSaving, scopeBatch, scopeData, selectedStudentIds, selectedRoomIds, studentFilter, studentGenderFilter, studentCategoryFilter, studentDegreeFilter, studentMajorFilter, studentGradeFilter, roomFilter, roomGenderFilter, roomScopeFilter, roomCampusFilter, roomBuildingFilter, roomFloorFilter, studentSortField, studentSortDirection, roomSortField, roomSortDirection, studentTotal, roomTotal, studentPage, roomPage, studentPageSize, roomPageSize, studentPageLoading, roomPageLoading"
          if old_return not in text:
              raise SystemExit('return filter anchor missing')
          text = text.replace(old_return, new_return)
          text = text.replace(
              "scopeStudents, scopeRooms, scopeMajorOptions, scopeGradeOptions, scopeBuildingOptions, scopeFloorOptions, filteredStudents, filteredRooms, load,",
              "scopeStudents, scopeRooms, scopeMajorOptions, scopeGradeOptions, scopeCampusOptions, scopeBuildingOptions, scopeFloorOptions, filteredStudents, filteredRooms, loadStudentPage, loadRoomPage, load,"
          )
          p.write_text(text)

          p = root / 'frontend/src/views/admin/AdminBatchView.vue'
          text = p.read_text()
          text = text.replace(
              "roomGenderFilter, roomScopeFilter, roomBuildingFilter, roomFloorFilter, publishAfterScope,",
              "roomGenderFilter, roomScopeFilter, roomCampusFilter, roomBuildingFilter, roomFloorFilter, studentSortField, studentSortDirection, roomSortField, roomSortDirection, studentTotal, roomTotal, studentPage, roomPage, studentPageSize, roomPageSize, studentPageLoading, roomPageLoading, publishAfterScope,"
          )
          text = text.replace(
              "scopeGradeOptions, scopeBuildingOptions, scopeFloorOptions, filteredStudents, filteredRooms,",
              "scopeGradeOptions, scopeCampusOptions, scopeBuildingOptions, scopeFloorOptions, filteredStudents, filteredRooms,"
          )
          text = text.replace(
              "createBatch, openScope, closeScope, toggleStudent, toggleRoom, selectAllStudents, selectAllRooms,",
              "createBatch, openScope, closeScope, toggleStudent, toggleRoom, selectAllStudents, selectAllRooms, loadStudentPage, loadRoomPage,"
          )
          # same anchors occur again in void binding; replace all occurrences above intentionally.
          p.write_text(text)

          p = root / 'frontend/src/views/admin/AdminBatchView.template.html'
          text = p.read_text()
          text = text.replace(
              '    :room-scope-filter="roomScopeFilter"\n    :room-building-filter="roomBuildingFilter"',
              '    :room-scope-filter="roomScopeFilter"\n    :room-campus-filter="roomCampusFilter"\n    :room-building-filter="roomBuildingFilter"'
          )
          text = text.replace(
              '    :scope-grade-options="scopeGradeOptions"\n    :scope-building-options="scopeBuildingOptions"',
              '    :scope-grade-options="scopeGradeOptions"\n    :scope-campus-options="scopeCampusOptions"\n    :scope-building-options="scopeBuildingOptions"'
          )
          text = text.replace(
              '    :scope-rooms="scopeRooms"\n    :filtered-students="filteredStudents"\n    :filtered-rooms="filteredRooms"',
              '    :filtered-students="filteredStudents"\n    :filtered-rooms="filteredRooms"\n    :student-sort-field="studentSortField"\n    :student-sort-direction="studentSortDirection"\n    :room-sort-field="roomSortField"\n    :room-sort-direction="roomSortDirection"\n    :student-total="studentTotal"\n    :room-total="roomTotal"\n    :student-page="studentPage"\n    :room-page="roomPage"\n    :student-page-size="studentPageSize"\n    :room-page-size="roomPageSize"\n    :student-page-loading="studentPageLoading"\n    :room-page-loading="roomPageLoading"'
          )
          text = text.replace(
              '    @update:room-scope-filter="roomScopeFilter=$event"\n    @update:room-building-filter="roomBuildingFilter=$event"',
              '    @update:room-scope-filter="roomScopeFilter=$event"\n    @update:room-campus-filter="roomCampusFilter=$event"\n    @update:room-building-filter="roomBuildingFilter=$event"'
          )
          text = text.replace(
              '    @update:room-floor-filter="roomFloorFilter=$event"\n    @save="saveScope"',
              '    @update:room-floor-filter="roomFloorFilter=$event"\n    @update:student-sort-field="studentSortField=$event"\n    @update:student-sort-direction="studentSortDirection=$event"\n    @update:room-sort-field="roomSortField=$event"\n    @update:room-sort-direction="roomSortDirection=$event"\n    @update:student-page="studentPage=$event"\n    @update:student-page-size="studentPageSize=$event"\n    @update:room-page="roomPage=$event"\n    @update:room-page-size="roomPageSize=$event"\n    @reload-students="loadStudentPage"\n    @reload-rooms="loadRoomPage"\n    @save="saveScope"'
          )
          p.write_text(text)

          p = root / 'frontend/src/features/admin-batch/components/BatchScopeDialog.vue'
          old = p.read_text()
          style = old[old.index('<style scoped>'):]
          new_body = r'''<script setup lang="ts">
          import { computed } from 'vue'
          import type { DataObject } from '../../../api/types'
          import PaginationBar from '../../../components/common/PaginationBar.vue'
          import AppModal from '../../../components/modal/AppModal.vue'

          type SelectOption = { id: string; label: string; campusId?: string }

          const props = defineProps<{
            open: boolean
            scopeBatch: DataObject | null
            scopeLoading: boolean
            scopeSaving: boolean
            selectedStudentIds: number[]
            selectedRoomIds: number[]
            studentFilter: string
            studentGenderFilter: string
            studentCategoryFilter: string
            studentDegreeFilter: string
            studentMajorFilter: string
            studentGradeFilter: string
            roomFilter: string
            roomGenderFilter: string
            roomScopeFilter: string
            roomCampusFilter: string
            roomBuildingFilter: string
            roomFloorFilter: string
            studentSortField: string
            studentSortDirection: 'asc' | 'desc'
            roomSortField: string
            roomSortDirection: 'asc' | 'desc'
            scopeMajorOptions: SelectOption[]
            scopeGradeOptions: string[]
            scopeCampusOptions: SelectOption[]
            scopeBuildingOptions: SelectOption[]
            scopeFloorOptions: string[]
            filteredStudents: DataObject[]
            filteredRooms: DataObject[]
            studentTotal: number
            roomTotal: number
            studentPage: number
            roomPage: number
            studentPageSize: number
            roomPageSize: number
            studentPageLoading: boolean
            roomPageLoading: boolean
            publishAfterScope: boolean
            publishFlowState: string
            publishFlowBusy: boolean
            runningPreflight: boolean
          }>()

          const emit = defineEmits<{
            close: []
            'toggle-student': [studentId: number]
            'toggle-room': [roomId: number]
            'select-all-students': []
            'clear-students': []
            'select-all-rooms': []
            'clear-rooms': []
            'update:student-filter': [value: string]
            'update:student-gender-filter': [value: string]
            'update:student-category-filter': [value: string]
            'update:student-degree-filter': [value: string]
            'update:student-major-filter': [value: string]
            'update:student-grade-filter': [value: string]
            'update:room-filter': [value: string]
            'update:room-gender-filter': [value: string]
            'update:room-scope-filter': [value: string]
            'update:room-campus-filter': [value: string]
            'update:room-building-filter': [value: string]
            'update:room-floor-filter': [value: string]
            'update:student-sort-field': [value: string]
            'update:student-sort-direction': [value: 'asc' | 'desc']
            'update:room-sort-field': [value: string]
            'update:room-sort-direction': [value: 'asc' | 'desc']
            'update:student-page': [value: number]
            'update:student-page-size': [value: number]
            'update:room-page': [value: number]
            'update:room-page-size': [value: number]
            'reload-students': []
            'reload-rooms': []
            save: []
            'save-and-publish': []
          }>()

          const visibleBuildingOptions = computed(() => props.roomCampusFilter
            ? props.scopeBuildingOptions.filter(building => building.campusId === props.roomCampusFilter)
            : props.scopeBuildingOptions)
          </script>

          <template>
            <AppModal
              :open="open"
              :title="`${scopeBatch?.batch_name ?? '批次'} · 参与范围`"
              description="候选范围按页从服务端加载；筛选和排序不会再下载完整学生、宿舍数据。"
              size="large"
              max-height="94dvh"
              :busy="scopeLoading"
              :prevent-close="publishFlowBusy || publishFlowState === 'WAITING_CONFIRMATION'"
              @close="emit('close')"
            >
              <template v-if="!scopeLoading">
                <div class="scope-summary">
                  <article><span>已选学生</span><strong>{{ selectedStudentIds.length }}</strong></article>
                  <article><span>已选宿舍</span><strong>{{ selectedRoomIds.length }}</strong></article>
                </div>
                <div class="scope-grid">
                  <section class="scope-column">
                    <header class="scope-column-header"><div><strong>参与学生</strong><small>服务端筛选、排序与分页，跨页选择会保留</small></div><div class="button-row"><button class="button ghost small" type="button" @click="emit('select-all-students')">全选本页</button><button class="button ghost small" type="button" @click="emit('clear-students')">清空</button></div></header>
                    <div class="scope-filter-panel scope-filter-grid">
                      <input :value="studentFilter" class="input span-2" placeholder="搜索学号、姓名或专业" @input="emit('update:student-filter', ($event.target as HTMLInputElement).value.trim())" />
                      <select :value="studentGenderFilter" class="input" @change="emit('update:student-gender-filter', ($event.target as HTMLSelectElement).value)"><option value="">全部性别</option><option value="M">男生</option><option value="F">女生</option></select>
                      <select :value="studentCategoryFilter" class="input" @change="emit('update:student-category-filter', ($event.target as HTMLSelectElement).value)"><option value="">国内外不限</option><option value="DOMESTIC">国内生</option><option value="INTERNATIONAL">国际生</option></select>
                      <select :value="studentDegreeFilter" class="input" @change="emit('update:student-degree-filter', ($event.target as HTMLSelectElement).value)"><option value="">培养层次不限</option><option value="JUNIOR_COLLEGE">专科</option><option value="UNDERGRADUATE">本科生</option><option value="MASTER">硕士生</option><option value="DOCTOR">博士生</option><option value="MASTER_DOCTOR">硕博连读</option><option value="BACHELOR_MASTER">本硕连读</option><option value="BACHELOR_DOCTOR">本博连读</option></select>
                      <select :value="studentMajorFilter" class="input" @change="emit('update:student-major-filter', ($event.target as HTMLSelectElement).value)"><option value="">全部专业</option><option v-for="major in scopeMajorOptions" :key="major.id" :value="major.id">{{ major.label }}</option></select>
                      <select :value="studentGradeFilter" class="input span-2" @change="emit('update:student-grade-filter', ($event.target as HTMLSelectElement).value)"><option value="">全部年级</option><option v-for="grade in scopeGradeOptions" :key="grade" :value="grade">{{ grade }}级</option></select>
                    </div>
                    <div class="scope-sort-row"><select :value="studentSortField" class="input" @change="emit('update:student-sort-field', ($event.target as HTMLSelectElement).value)"><option value="student_number">按学号</option><option value="student_name">按姓名</option><option value="major_name">按专业</option><option value="grade_year">按年级</option><option value="student_category">按学生类别</option></select><select :value="studentSortDirection" class="input" @change="emit('update:student-sort-direction', ($event.target as HTMLSelectElement).value as 'asc' | 'desc')"><option value="asc">升序</option><option value="desc">降序</option></select></div>
                    <div class="scope-result-summary"><span>筛选结果 {{ studentTotal }} 人</span><span>已选择 {{ selectedStudentIds.length }} 人</span></div>
                    <div class="scope-result-list"><p v-if="studentPageLoading" class="empty-state compact">正在加载本页学生…</p><template v-else><label v-for="student in filteredStudents" :key="String(student.id)" class="scope-option"><input type="checkbox" :checked="selectedStudentIds.includes(Number(student.id))" @change="emit('toggle-student', Number(student.id))" /><div><strong>{{ student.student_number }} · {{ student.student_name }}</strong><span>{{ student.major_name }} · {{ student.gender === 'M' ? '男' : '女' }} · {{ student.student_category === 'INTERNATIONAL' ? '国际生' : '国内生' }}</span></div></label><p v-if="!filteredStudents.length" class="empty-state compact">没有符合当前条件的学生。</p></template></div>
                    <PaginationBar :page="studentPage" :page-size="studentPageSize" :total="studentTotal" :page-sizes="[20, 50, 100]" @update:page="emit('update:student-page', $event)" @update:page-size="emit('update:student-page-size', $event)" @change="emit('reload-students')" />
                  </section>
                  <section class="scope-column">
                    <header class="scope-column-header"><div><strong>可选宿舍</strong><small>先按校区、楼栋定位；跨页选择会保留</small></div><div class="button-row"><button class="button ghost small" type="button" @click="emit('select-all-rooms')">全选本页可用</button><button class="button ghost small" type="button" @click="emit('clear-rooms')">清空</button></div></header>
                    <div class="scope-filter-panel scope-filter-grid">
                      <input :value="roomFilter" class="input span-2" placeholder="搜索楼栋、楼层或房间号" @input="emit('update:room-filter', ($event.target as HTMLInputElement).value.trim())" />
                      <select :value="roomGenderFilter" class="input" @change="emit('update:room-gender-filter', ($event.target as HTMLSelectElement).value)"><option value="">全部性别</option><option value="M">男寝</option><option value="F">女寝</option></select>
                      <select :value="roomScopeFilter" class="input" @change="emit('update:room-scope-filter', ($event.target as HTMLSelectElement).value)"><option value="">国内外不限</option><option value="DOMESTIC_ONLY">国内生宿舍</option><option value="INTERNATIONAL_ONLY">国际生宿舍</option><option value="MIXED">混住宿舍</option></select>
                      <select :value="roomCampusFilter" class="input" @change="emit('update:room-campus-filter', ($event.target as HTMLSelectElement).value)"><option value="">全部校区</option><option v-for="campus in scopeCampusOptions" :key="campus.id" :value="campus.id">{{ campus.label }}</option></select>
                      <select :value="roomBuildingFilter" class="input" @change="emit('update:room-building-filter', ($event.target as HTMLSelectElement).value)"><option value="">全部楼栋</option><option v-for="building in visibleBuildingOptions" :key="building.id" :value="building.id">{{ building.label }}</option></select>
                      <select :value="roomFloorFilter" class="input span-2" @change="emit('update:room-floor-filter', ($event.target as HTMLSelectElement).value)"><option value="">全部楼层</option><option v-for="floor in scopeFloorOptions" :key="floor" :value="floor">{{ floor }}层</option></select>
                    </div>
                    <div class="scope-sort-row"><select :value="roomSortField" class="input" @change="emit('update:room-sort-field', ($event.target as HTMLSelectElement).value)"><option value="building_name">按楼栋</option><option value="room_number">按寝室号</option><option value="floor_number">按楼层</option><option value="capacity">按容量</option><option value="operational_status">按运行状态</option></select><select :value="roomSortDirection" class="input" @change="emit('update:room-sort-direction', ($event.target as HTMLSelectElement).value as 'asc' | 'desc')"><option value="asc">升序</option><option value="desc">降序</option></select></div>
                    <div class="scope-result-summary"><span>筛选结果 {{ roomTotal }} 间</span><span>已选择 {{ selectedRoomIds.length }} 间</span></div>
                    <div class="scope-result-list"><p v-if="roomPageLoading" class="empty-state compact">正在加载本页宿舍…</p><template v-else><label v-for="room in filteredRooms" :key="String(room.id)" class="scope-option" :class="{ disabled: !room.selectable }"><input type="checkbox" :disabled="!room.selectable" :checked="selectedRoomIds.includes(Number(room.id))" @change="emit('toggle-room', Number(room.id))" /><div><strong>{{ room.campus_name }} · {{ room.building_name }} {{ room.room_number }}</strong><span>{{ room.floor_number }}层 · 容量{{ room.capacity }} · {{ room.gender_restriction === 'M' ? '男寝' : '女寝' }} · {{ room.operational_status }}</span></div></label><p v-if="!filteredRooms.length" class="empty-state compact">没有符合当前条件的宿舍。</p></template></div>
                    <PaginationBar :page="roomPage" :page-size="roomPageSize" :total="roomTotal" :page-sizes="[20, 50, 100]" @update:page="emit('update:room-page', $event)" @update:page-size="emit('update:room-page-size', $event)" @change="emit('reload-rooms')" />
                  </section>
                </div>
              </template>
              <template #footer><div class="scope-footer-status"><strong>{{ publishAfterScope ? '需要补齐范围后继续发布' : '当前状态：' + publishFlowState }}</strong><span>范围保存成功后即使发布失败也不会丢失。</span></div><button class="button ghost" type="button" :disabled="publishFlowBusy" @click="emit('close')">关闭</button><button class="button secondary" type="button" :disabled="scopeLoading || publishFlowBusy" @click="emit('save')">{{ scopeSaving ? '保存中…' : '仅保存范围' }}</button><button class="button primary" type="button" :disabled="scopeLoading || publishFlowBusy" @click="emit('save-and-publish')">{{ scopeSaving || runningPreflight ? '正在准备发布…' : '保存并发布' }}</button></template>
            </AppModal>
          </template>

          '''.replace('          ', '')
          p.write_text(new_body + style)
          PY
          git diff --check
          git status --short
          git config user.name 'Wust Dormitory CI'
          git config user.email 'ci@wust-dormitory.local'
          git add frontend/src/features/admin-batch/composables/useAdminBatchView.ts frontend/src/views/admin/AdminBatchView.vue frontend/src/views/admin/AdminBatchView.template.html frontend/src/features/admin-batch/components/BatchScopeDialog.vue
          git commit -m 'feat: 接入批次参与范围服务端分页'
          git push origin HEAD:fix/batch-scope-server-pagination-20260816
