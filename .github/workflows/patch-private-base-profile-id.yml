name: Patch Private Generator Database Name

on:
  push:
    branches:
      - 'private-compat/fix/huangjiahu-test-data-gender-20260815'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private feature branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/huangjiahu-test-data-gender-20260815
          token: ${{ secrets.PRIVATE_CI }}
          persist-credentials: true
          fetch-depth: 1
      - name: Patch generated integrity database name and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/db/generate_navicat_sql.py')
          text = path.read_text(encoding='utf-8')
          old = "    integrity = _core.INTEGRITY_SOURCE.read_text(encoding=\"utf-8\").rstrip()\n"
          new = """    integrity = _core.INTEGRITY_SOURCE.read_text(encoding=\"utf-8\").rstrip()\n    integrity = integrity.replace(\"USE `wust_dormitory`;\", f\"USE `{database_name}`;\")\n    integrity = integrity.replace(\n        \"IF DATABASE()<>'wust_dormitory' THEN SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='当前数据库不是wust_dormitory'; END IF;\",\n        f\"IF DATABASE()<>'{database_name}' THEN SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='当前数据库与生成目标不一致'; END IF;\",\n    )\n"""
          if old not in text:
              raise SystemExit('expected integrity loading pattern not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git config user.name 'WangBinghao'
          git config user.email '2495680763@qq.com'
          git add scripts/db/generate_navicat_sql.py
          git diff --cached --check
          git commit -m 'fix: 生成完整性检查时使用目标数据库名'
          git push origin HEAD:fix/huangjiahu-test-data-gender-20260815
