name: Private Inspection P0B CI
on:
  push:
    branches: ['private-compat/refactor/inspection-workflow-p0b-mainline-20260814']
permissions:
  contents: read
jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/inspection-workflow-p0b-mainline-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify V46 inspection schema contract
        working-directory: private-repo
        run: python scripts/db/test_v46_inspection_workflow_schema.py

  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/inspection-workflow-p0b-mainline-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Verify inspection backend contracts
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl server -am -Dtest=InspectionMapperContractTest,AdminInspectionServiceTest,MobileInspectionServiceTest,InspectionRoomServiceTest,InspectionIssueServiceTest,InspectionControllerRouteContractTest -Dsurefire.failIfNoSpecifiedTests=false test

  mobile-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/inspection-workflow-p0b-mainline-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run mobile inspection verification with diagnostics
        id: mobile_verify
        working-directory: private-repo/app
        shell: bash
        run: |
          set +e
          set -o pipefail
          : > ../../mobile-inspection-p0b.log
          failed=""
          run_stage() {
            stage="$1"; shift
            echo "===== $stage =====" | tee -a ../../mobile-inspection-p0b.log
            "$@" 2>&1 | tee -a ../../mobile-inspection-p0b.log
            status=${PIPESTATUS[0]}
            if [[ $status -ne 0 && -z "$failed" ]]; then failed="$stage"; fi
            return $status
          }
          run_stage install npm install --no-audit --no-fund || true
          if [[ -z "$failed" ]]; then run_stage generate-api npm run generate:api || true; fi
          if [[ -z "$failed" ]]; then run_stage test npm test || true; fi
          if [[ -z "$failed" ]]; then run_stage typecheck npm run typecheck || true; fi
          if [[ -z "$failed" ]]; then run_stage build npm run build || true; fi
          echo "failed_stage=$failed" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload mobile diagnostics
        if: steps.mobile_verify.outputs.failed_stage != ''
        uses: actions/upload-artifact@v4
        with:
          name: mobile-inspection-p0b-${{ steps.mobile_verify.outputs.failed_stage }}
          path: mobile-inspection-p0b.log
          if-no-files-found: error
      - name: Fail when mobile verification failed
        if: steps.mobile_verify.outputs.failed_stage != ''
        run: exit 1
