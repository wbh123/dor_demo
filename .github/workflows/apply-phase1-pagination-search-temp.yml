name: Apply Phase 1 Pagination Search Patch
on:
  push:
    branches:
      - fix/phase1-pagination-exchange-search-20260806
permissions:
  contents: write
concurrency:
  group: apply-phase1-pagination-search
  cancel-in-progress: false
jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/phase1-pagination-exchange-search-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/ci/phase1-patch-gzip/part-*.b64 > /tmp/phase1.patch.gz.b64
          echo '80229ee1f3c6956bfe39f0494f5db8e5424f505cdc5a1364598597a404c52ee9  /tmp/phase1.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/phase1.patch.gz.b64 | gzip -dc > /tmp/phase1.patch
          echo '572cd6b679156d765f354f8f5a72fde9bb519abc50fb8bfca44f5188dc290aaa  /tmp/phase1.patch' | sha256sum -c -
      - name: Confirm RED baseline
        run: |
          test ! -e scripts/ci/test_room_pagination_and_exchange_search.py
          ! grep -q 'ROOM_ROWS_PER_PAGE = 4' frontend/src/views/student/RoomListView.vue
          ! grep -q 'LIMIT 20' backend-java/server/src/main/java/com/wust/dormitory/roomexchange/RoomExchangeService.java
      - name: Apply patch and run cross-layer contracts
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/phase1.patch
          git apply /tmp/phase1.patch
          git diff --check
          bash scripts/ci/run_policy.sh
          bash scripts/ci/run_contracts.sh
          bash scripts/ci/run_redis.sh
      - name: Remove temporary delivery files
        run: |
          rm -rf scripts/ci/phase1-patch scripts/ci/phase1-patch-gzip
          rm -f .github/workflows/apply-phase1-pagination-search-temp.yml
      - name: Commit formal source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: 完善候选宿舍分页与换寝学号查找'
          git push origin HEAD:fix/phase1-pagination-exchange-search-20260806
