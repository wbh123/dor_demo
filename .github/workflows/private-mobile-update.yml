name: Private Mobile Update Contract

on:
  push:
    branches:
      - 'private-compat/feat/mobile-app-update-flow-20260815'

permissions:
  contents: read

jobs:
  verify-update-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: integration/mobile-app-update-flow-v2-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install --ignore-scripts
      - name: Run full mobile tests
        working-directory: private-repo/app
        run: npm test
      - name: Type check mobile app
        working-directory: private-repo/app
        run: npx vue-tsc -b
      - name: Build mobile app
        working-directory: private-repo/app
        run: npm run build
      - name: Sync Capacitor Android
        working-directory: private-repo/app
        run: npx cap sync android
      - name: Verify Android Gradle build
        working-directory: private-repo/app/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Run backend metadata validation contract
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl server -am -Dtest=MobileAppVersionControllerTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Run full backend verification
        working-directory: private-repo/backend-java
        run: mvn -B -ntp clean verify
