name: Private Main Baseline Validation

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-main-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve private branch
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          test -n "$private_ref"
          test "$private_ref" != "$candidate"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install --no-audit --no-fund

      - name: Run complete mobile tests
        working-directory: private-repo/app
        run: npm test

      - name: Type-check mobile app
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Build mobile web bundle
        working-directory: private-repo/app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: private-repo/app
        run: npx cap sync android

      - name: Verify Android project
        working-directory: private-repo/app/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Verify backend Maven modules
        working-directory: private-repo/backend-java
        run: mvn -B -ntp clean verify
