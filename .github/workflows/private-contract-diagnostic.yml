name: Private Contract Diagnostic

on:
  push:
    branches:
      - private-compat/feat/mobile-school-profile-splash-harmony-dark-20260817-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/mobile-school-profile-splash-harmony-dark-20260817-v3
          token: ${{ secrets.PRIVATE_CI }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trace contracts until first failure
        shell: bash
        run: |
          set +e
          bash -x scripts/ci/run_contracts.sh 2>&1 | tee /tmp/contracts.log
          status=${PIPESTATUS[0]}
          echo "CONTRACT_EXIT_CODE=${status}" >> "$GITHUB_ENV"
          exit 0
      - name: Upload contract trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-contract-trace
          path: /tmp/contracts.log
          if-no-files-found: error
      - name: Preserve contract result
        if: always()
        shell: bash
        run: exit "${CONTRACT_EXIT_CODE:-1}"
