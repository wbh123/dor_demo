name: Static font full backend verify

on:
  push:
    branches:
      - diagnostics/materialize-static-print-fonts-20260816

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/pdf-preview-font-weight-parity-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Full Maven verify
        working-directory: private-repo/backend-java
        run: mvn -B -ntp clean verify
