name: Apply private migration split v2 temporary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/private-migration-split-v2-20260805
          fetch-depth: 0
      - name: Split large views deterministically
        shell: python
        run: |
          from pathlib import Path
          import re
          for path in [Path('frontend/src/views/admin/AdminBatchView.vue'), Path('frontend/src/views/admin/AdminDataView.vue'), Path('frontend/src/views/student/StudentHomeContent.vue')]:
              text = path.read_text(encoding='utf-8')
              match = re.fullmatch(r'(?s)<script setup lang="ts">\n(.*?)\n</script>\n\n<template>\n(.*?)\n</template>\n\n<style scoped>\n(.*?)\n</style>\n?', text)
              if not match:
                  raise RuntimeError(f'cannot parse {path}')
              script, template, style = match.groups()
              components, imports, body = [], [], []
              in_imports = True
              for line in script.splitlines():
                  if in_imports and (line.startswith('import ') or not line.strip()):
                      if line.startswith('import '):
                          (components if '.vue' in line else imports).append(line)
                      continue
                  in_imports = False
                  body.append(line)
              names = []
              def add(name):
                  if name and name not in names:
                      names.append(name)
              for line in imports:
                  if line.startswith('import type '):
                      continue
                  default = re.match(r'import\s+([A-Za-z_$][\w$]*)\s+from', line)
                  if default:
                      add(default.group(1))
                  named = re.search(r'\{([^}]+)\}', line)
                  if named:
                      for part in named.group(1).split(','):
                          token = part.strip()
                          if token:
                              add((token.split(' as ')[1] if ' as ' in token else token).strip())
              for line in body:
                  if line.startswith('const {'):
                      for part in line.split('{', 1)[1].split('}', 1)[0].split(','):
                          add(part.strip().split(':', 1)[0].strip())
                  declaration = re.match(r'^(?:const|let|var)\s+([A-Za-z_$][\w$]*)', line)
                  if declaration:
                      add(declaration.group(1))
                  function = re.match(r'^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)', line)
                  if function:
                      add(function.group(1))
              stem, hook = path.stem, f'use{path.stem}'
              indented = '\n'.join(('  ' + line if line else '') for line in body)
              returns = ',\n'.join('    ' + name for name in names)
              logic = '// @ts-nocheck\n' + '\n'.join(imports) + f'\n\nexport function {hook}() {{\n{indented}\n\n  return {{\n{returns}\n  }}\n}}\n'
              wrapper = '<script setup lang="ts">\n// @ts-nocheck\n'
              if components:
                  wrapper += '\n'.join(components) + '\n'
              wrapper += f"import {{ {hook} }} from './{stem}.logic'\n\n"
              wrapper += 'const {\n' + ',\n'.join('  ' + name for name in names) + f'\n}} = {hook}()\n'
              wrapper += f'</script>\n\n<template src="./{stem}.template.html"></template>\n\n<style scoped src="./{stem}.css"></style>\n'
              path.write_text(wrapper, encoding='utf-8')
              path.with_name(f'{stem}.logic.ts').write_text(logic, encoding='utf-8')
              path.with_name(f'{stem}.template.html').write_text(template + '\n', encoding='utf-8')
              path.with_name(f'{stem}.css').write_text(style + '\n', encoding='utf-8')
      - name: Commit split views
        run: |
          rm -f .github/workflows/apply-private-migration-split-v2-temporary.yml
          git config user.name "wbh123"
          git config user.email "21192079+wbh123@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 拆分大型页面以支持稳定迁移"
          git push origin HEAD
