name: Private Account Grant Lifecycle

on:
  push:
    branches:
      - 'private-compat/fix/account-admin-grant-lifecycle-20260814'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/account-admin-grant-lifecycle-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify grant lifecycle frontend contract
        working-directory: private-repo
        run: node scripts/ci/test_account_admin_grant_lifecycle.mjs
      - name: Verify grant lifecycle service tests
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl server -am -Dtest=AccountAdminGrantServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
