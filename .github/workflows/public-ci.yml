name: Public Repository CI

on:
  push:
    branches:
      - feature/comprehensive-student-selection-enhancements-v3

permissions:
  contents: write

jobs:
  apply-comprehensive-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore and apply patch
        run: |
          cat .patch/cpatch.* | base64 --decode | xz --decompress > /tmp/comprehensive.patch
          git apply --check /tmp/comprehensive.patch
          git apply /tmp/comprehensive.patch
          rm -rf .patch
          rm -f .github/workflows/export-source-snapshot.yml
          git show origin/main:.github/workflows/public-ci.yml > .github/workflows/public-ci.yml
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 完善学生数据偏好与选寝全流程"
          git push origin HEAD:feature/comprehensive-student-selection-enhancements-v3
