name: Apply comprehensive source changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/comprehensive-student-selection-enhancements-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/comprehensive-student-selection-enhancements-v3
          fetch-depth: 0
      - name: Apply verified local patch
        run: |
          cat .patch/cpatch.* | base64 --decode | xz --decompress > /tmp/comprehensive.patch
          git apply --check /tmp/comprehensive.patch
          git apply /tmp/comprehensive.patch
          rm -rf .patch
          rm -f .ci-normal-trigger
          rm -f .github/workflows/export-source-snapshot.yml
          git show origin/main:.github/workflows/public-ci.yml > .github/workflows/public-ci.yml
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 完善学生数据偏好与选寝全流程"
          git push origin HEAD:feature/comprehensive-student-selection-enhancements-v3
