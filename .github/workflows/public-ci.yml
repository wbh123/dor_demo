name: Export private migration source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pack public source snapshot
        run: tar --exclude=.git -czf /tmp/dor-demo-migration-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: dor-demo-migration-source
          path: /tmp/dor-demo-migration-source.tar.gz
          retention-days: 1
