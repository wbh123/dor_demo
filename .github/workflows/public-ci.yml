name: Public Repository CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Public content policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate public repository boundary
        run: bash scripts/ci/run_policy.sh

  contracts:
    name: Cross-layer system contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate OpenAPI, backend and frontend contracts
        shell: bash
        run: |
          set +e
          bash scripts/ci/run_contracts.sh 2>&1 | tee contract-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-diagnostics-${{ github.run_id }}
          path: contract-output.txt
          retention-days: 1

  redis:
    name: Redis database reset safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate selected-database Redis cleanup
        run: bash scripts/ci/run_redis.sh

  backend:
    name: Java 21 backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend modules and unit tests
        run: bash scripts/ci/run_backend.sh

  frontend:
    name: Node 22 frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify generated API types and production build
        env:
          VITE_INSTITUTION_NAME: 示例大学
          VITE_CAMPUS_NAME: 示例校区
        run: bash scripts/ci/run_frontend.sh
