name: Public Repository CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Public content policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public repository boundary
        run: python scripts/ci/validate_public_repository.py .

  backend:
    name: Java 21 backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: mvn -f backend-java/pom.xml --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Node 22 frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Build frontend
        env:
          VITE_INSTITUTION_NAME: 示例大学
          VITE_CAMPUS_NAME: 示例校区
        run: npm run --prefix frontend build
