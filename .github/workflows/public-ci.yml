name: Apply comprehensive compile fixes

on:
  push:
    branches:
      - feature/comprehensive-student-selection-enhancements-v3

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/comprehensive-student-selection-enhancements-v3
          fetch-depth: 0
      - name: Apply focused fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          transfer = Path('backend-java/server/src/main/java/com/wust/dormitory/admin/TransferStudentService.java')
          text = transfer.read_text(encoding='utf-8')
          old = '''                        "TRANSFER_MANUAL",
                        normalized.phoneNumber()),'''
          new = '''                        "TRANSFER_MANUAL",
                        normalized.phoneNumber(),
                        null,
                        null),'''
          if old not in text:
              raise SystemExit('TransferStudentService target block not found')
          transfer.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = Path('frontend/src/views/student/StudentHomeView.vue')
          text = home.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\nasync function loadQuestionnaire\(id: number\) \{\n'
              r'  const response = await api\.get<ObjectSuccessResponse>\(`\/api\/v1\/student\/batches\/\$\{id\}\/questionnaire`\)\n'
              r'  questionnaire\.value = \(response\.data\.data \?\? \{\}\) as DataObject\n'
              r'\}\n'
          )
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit('StudentHomeView target block not found')
          home.write_text(text, encoding='utf-8')
          PY
          rm -f .ci-trigger .ci-normal-trigger .ci-fix-trigger
          rm -f .github/workflows/fix-comprehensive-build.yml
          git show origin/main:.github/workflows/public-ci.yml > .github/workflows/public-ci.yml
      - name: Commit fixes and restore standard CI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: 修复综合功能前后端编译问题"
          git push origin HEAD:feature/comprehensive-student-selection-enhancements-v3
