name: Private Mobile Full Validation

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

jobs:
  mobile-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve private branch
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private ref
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: private-repo/app
        run: npm ci --no-audit --no-fund
      - name: Run all mobile tests
        working-directory: private-repo/app
        shell: bash
        run: |
          set +e
          npm test > /tmp/mobile-tests.log 2>&1
          status=$?
          cat /tmp/mobile-tests.log
          if [[ $status -ne 0 ]]; then
            python - <<'PY' >/tmp/mobile-failures.log
          from pathlib import Path
          lines = Path('/tmp/mobile-tests.log').read_text(errors='replace').splitlines()
          hits = [i for i, line in enumerate(lines) if line.startswith('not ok ') or line.startswith('# Subtest:') and i + 1 < len(lines) and lines[i + 1].startswith('not ok ')]
          emitted = set()
          for i in hits:
              start = max(0, i - 3)
              end = min(len(lines), i + 35)
              key = (start, end)
              if key in emitted:
                  continue
              emitted.add(key)
              print('\n'.join(lines[start:end]))
              print('\n---\n')
          if not hits:
              for line in lines:
                  if 'failureType' in line or "error:" in line or '# fail ' in line:
                      print(line)
          PY
            cat /tmp/mobile-failures.log
            summary=$(tail -c 12000 /tmp/mobile-failures.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Full mobile tests failed::$summary"
            exit "$status"
          fi
      - name: Typecheck
        working-directory: private-repo/app
        run: npm run typecheck
      - name: Production build
        working-directory: private-repo/app
        run: npm run build
      - name: Android Debug build
        working-directory: private-repo/app
        run: npm run android:build:debug
      - name: Verify APK
        working-directory: private-repo/app
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
