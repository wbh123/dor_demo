name: Private Backup Recovery Scenario CI

on:
  push:
    branches:
      - 'private-compat/feat/backup-recovery-scenarios-20260814'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/backup-recovery-scenarios-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r private-repo/scripts/ops/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
      - name: Apply isolated drill implementation in working tree
        working-directory: private-repo
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ops/backup_recovery.py')
          source = path.read_text(encoding='utf-8')

          function_anchor = '''def validate_database_name(value: str) -> str:\n    if not DATABASE_PATTERN.fullmatch(value):\n        raise ValueError(f"DATABASE_NAME_INVALID:{value!r}")\n    return value\n\n\n'''
          function_body = '''def render_integrity_sql_for_database(database_name: str) -> str:\n    """将完整性检查安全绑定到显式目标库，供隔离恢复/演练复用。"""\n    target = validate_database_name(database_name)\n    if not INTEGRITY_SQL.exists():\n        raise ValueError("INTEGRITY_SQL_NOT_FOUND")\n    rendered = INTEGRITY_SQL.read_text(encoding="utf-8")\n    replacements = (\n        ("USE `wust_dormitory`;", f"USE `{target}`;"),\n        ("DATABASE()<>'wust_dormitory'", f"DATABASE()<>'{target}'"),\n        ("当前数据库不是wust_dormitory", f"当前数据库不是{target}"),\n    )\n    for original, replacement in replacements:\n        if original not in rendered:\n            raise ValueError("INTEGRITY_SQL_DATABASE_BINDING_NOT_FOUND")\n        rendered = rendered.replace(original, replacement, 1)\n    return rendered\n\n\n'''
          if 'def render_integrity_sql_for_database(' not in source:
              if function_anchor not in source:
                  raise SystemExit('validate_database_name anchor not found')
              source = source.replace(function_anchor, function_anchor + function_body, 1)

          old_drill = '''    integrity_status = "WARNING"\n    if INTEGRITY_SQL.exists():\n        command = build_mysql_base_command(settings) + [target]\n        with INTEGRITY_SQL.open("rb") as input_file:\n            completed = subprocess.run(\n                command,\n                stdin=input_file,\n                stdout=subprocess.PIPE,\n                stderr=subprocess.PIPE,\n                check=False,\n                env=mysql_process_environment(settings),\n            )\n        if completed.returncode != 0:\n            integrity_status = "FAILED"\n        else:\n            integrity_status = "PASSED"\n'''
          new_drill = '''    integrity_status = "WARNING"\n    if INTEGRITY_SQL.exists():\n        command = build_mysql_base_command(settings) + [target]\n        integrity_sql = render_integrity_sql_for_database(target)\n        completed = subprocess.run(\n            command,\n            input=integrity_sql,\n            text=True,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.PIPE,\n            check=False,\n            env=mysql_process_environment(settings),\n        )\n        if completed.returncode != 0:\n            integrity_status = "FAILED"\n        else:\n            integrity_status = "PASSED"\n'''
          if old_drill in source:
              source = source.replace(old_drill, new_drill, 1)
          elif new_drill not in source:
              raise SystemExit('run_drill integrity block not found')

          path.write_text(source, encoding='utf-8')
          PY
      - name: Backup recovery contracts
        working-directory: private-repo
        run: python -m unittest scripts/ops/test_backup_recovery.py -v
      - name: Drill isolation contracts
        working-directory: private-repo
        run: python -m unittest scripts/ops/test_backup_recovery_drill_safety.py -v
      - name: Scenario contracts
        working-directory: private-repo
        run: |
          python -m unittest scripts/db/test_scenario_matrix.py -v
          python -m unittest scripts/db/test_recovery_scenarios.py -v
      - name: Execute V47 integrity SQL on MySQL 8.4
        working-directory: private-repo
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          SQL_FILE='backend-java/docs/sql/navicat/generated/00_一键重置数据库.sql'
          python scripts/db/generate_navicat_sql.py --scenario realistic --scale standard --skip-redis
          mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot --default-character-set=utf8mb4 --show-warnings < "${SQL_FILE}"
      - name: Commit verified drill fix to private feature branch
        working-directory: private-repo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ops/backup_recovery.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: bind disaster recovery integrity checks to isolated database'
            git push origin HEAD:feat/backup-recovery-scenarios-20260814
          fi

# rerun: drill-isolation-green
