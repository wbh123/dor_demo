name: Private Backup Recovery Scenario CI

on:
  push:
    branches:
      - 'private-compat/feat/backup-recovery-scenarios-20260814'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/backup-recovery-scenarios-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r private-repo/scripts/ops/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
      - name: Backup recovery RED/GREEN contracts
        working-directory: private-repo
        run: python -m unittest scripts/ops/test_backup_recovery.py -v
      - name: Scenario matrix RED/GREEN contracts
        working-directory: private-repo
        run: python -m unittest scripts/db/test_scenario_matrix.py -v
      - name: Historical recovery RED/GREEN contracts
        working-directory: private-repo
        run: python -m unittest scripts/db/test_recovery_scenarios.py -v
      - name: Generate SQL contract checks
        working-directory: private-repo
        run: |
          python scripts/db/generate_navicat_sql.py --scenario selection_peak --scale standard --check
          python scripts/db/generate_navicat_sql.py --scenario selection_peak --scale large --check
          python scripts/db/generate_navicat_sql.py --scenario mixed_extreme --scale xlarge --check
          python scripts/db/generate_navicat_sql.py --scenario recovery_mid_selection --scale standard --check
          python scripts/db/generate_navicat_sql.py --scenario redis_loss_recovery --scale large --check
          python scripts/db/generate_navicat_sql.py --scenario recovery_after_assignment --scale small --students 20000 --check
      - name: Execute generated SQL on MySQL 8.4
        working-directory: private-repo
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          SQL_FILE='backend-java/docs/sql/navicat/generated/00_一键重置数据库.sql'
          for scenario in clean selection_peak authorization_matrix recovery_after_assignment mixed_extreme; do
            echo "=== MySQL execute scenario: ${scenario} ==="
            python scripts/db/generate_navicat_sql.py --scenario "${scenario}" --scale standard --skip-redis
            mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot --default-character-set=utf8mb4 --show-warnings < "${SQL_FILE}"
            mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -N -e "SELECT '${scenario}', COUNT(*) FROM wust_dormitory.student;"
          done

# rerun: mysql-runtime-matrix
