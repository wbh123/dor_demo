name: Private Backup Recovery Scenario CI

on:
  push:
    branches:
      - 'private-compat/feat/backup-recovery-scenarios-20260814'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/backup-recovery-scenarios-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ops dependencies
        working-directory: private-repo
        run: python -m pip install -r scripts/ops/requirements.txt
      - name: Backup recovery RED/GREEN contracts
        working-directory: private-repo
        run: python -m unittest scripts/ops/test_backup_recovery.py -v
      - name: Scenario matrix RED/GREEN contracts
        working-directory: private-repo
        run: python -m unittest scripts/db/test_scenario_matrix.py -v
      - name: Historical recovery RED/GREEN contracts
        working-directory: private-repo
        run: python -m unittest scripts/db/test_recovery_scenarios.py -v
      - name: Generate SQL contract checks
        working-directory: private-repo
        run: |
          python scripts/db/generate_navicat_sql.py --scenario selection_peak --scale standard --check
          python scripts/db/generate_navicat_sql.py --scenario selection_peak --scale large --check
          python scripts/db/generate_navicat_sql.py --scenario mixed_extreme --scale xlarge --check
          python scripts/db/generate_navicat_sql.py --scenario recovery_mid_selection --scale standard --check
          python scripts/db/generate_navicat_sql.py --scenario redis_loss_recovery --scale large --check
          python scripts/db/generate_navicat_sql.py --scenario recovery_after_assignment --scale small --students 20000 --check

# rerun: generated-sql-matrix
