name: Contract diagnostic comment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'refactor/admin-batch-create-copy-components-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run contracts and capture output
        id: contracts
        shell: bash
        run: |
          set +e
          bash scripts/ci/run_contracts.sh > contract-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment diagnostic tail
        if: steps.contracts.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### 临时契约诊断'
            echo '```text'
            tail -n 80 contract-output.txt
            echo '```'
          } > diagnostic-comment.md
          gh pr comment "$PR_NUMBER" --body-file diagnostic-comment.md
      - name: Fail after commenting
        if: steps.contracts.outputs.status != '0'
        run: exit 1
