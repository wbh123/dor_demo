name: Validate Room Workbench Android JDK21

on:
  push:
    branches:
      - 'private-validate/mobile-room-workbench-android-jdk21'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private target branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/mobile-room-workbench-default-spacing-20260817
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install APP dependencies
        working-directory: private-repo/app
        run: npm install --no-audit --no-fund

      - name: Build Android Debug APK
        working-directory: private-repo/app
        run: npm run android:build:debug
