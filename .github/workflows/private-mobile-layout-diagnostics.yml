name: Private Mobile Layout Diagnostics

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-mobile-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose private mobile layout contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          [[ -n "$private_ref" && "$private_ref" != "$candidate" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm ci
      - name: natural-resource-sort
        continue-on-error: true
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/natural-resource-sort.spec.ts
      - name: vite-dev-proxy-contract
        continue-on-error: true
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/vite-dev-proxy-contract.spec.ts
      - name: page-heading-layout
        continue-on-error: true
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/page-heading-layout.spec.ts
      - name: global-mobile-header-layout
        continue-on-error: true
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/global-mobile-header-layout.spec.ts
      - name: home-viewport
