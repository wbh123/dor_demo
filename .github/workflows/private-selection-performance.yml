name: Private Selection Performance Validation

on:
  push:
    branches:
      - 'private-compat/perf/selection-room-profile-bootstrap-lease-20260810'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private performance branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: perf/selection-room-profile-bootstrap-lease-20260810
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Verify selection performance contracts
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/test_selection_candidate_bulk_read.py
          python scripts/ci/test_selection_candidate_summary.py
          python scripts/ci/test_selection_load_runtime_diagnostics.py
          python scripts/ci/test_selection_load_low_disturbance_contract.py
          python scripts/ci/test_selection_redis_runtime_contract.py
          python -m py_compile scripts/ci/test_selection_load_low_disturbance_contract.py
          bash -n scripts/load/run-selection-load-test-1000-auto.sh
          bash -n scripts/load/run-selection-load-test-1000-diagnostic.sh

      - name: Verify private Java modules
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify

      - name: Verify private frontend
        working-directory: private-repo
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          bash scripts/ci/run_frontend.sh
