name: Private Mobile Campus Workbench CI

on:
  push:
    branches:
      - 'private-compat/feat/mobile-campus-floor-room-workbench-20260814'

permissions:
  contents: read

jobs:
  verify-private-mobile-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private fix branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/mobile-student-workbench-500-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify mobile tests and build
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm test
          npm run typecheck
          npm run build

      - name: Verify mobile student workbench regressions
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl server -am -Dtest=MobileStudentWorkbenchMapperMySqlIntegrationTest,MobileWorkbenchThreeLevelContractTest,MobileResidencyFilterContractTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify server module
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl server -am test
