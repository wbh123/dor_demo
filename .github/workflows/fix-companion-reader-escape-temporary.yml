name: Fix companion reader escape temporary

on:
  push:
    branches:
      - refactor/private-migration-split-v2-20260805

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/private-migration-split-v2-20260805
          fetch-depth: 0
      - name: Fix escaped newline in contract readers
        shell: python
        run: |
          from pathlib import Path
          targets = [
              'scripts/ci/validate_system_contracts.py',
              'scripts/ci/test_phase2_phase3_operations.py',
              'scripts/ci/test_import_recovery_anomaly_workflows.py',
              'scripts/ci/test_welcome_brand_room_exchange.py',
              'scripts/ci/test_waitlist_core.py',
              'scripts/ci/test_v25_integrated_workflow.py',
              'scripts/ci/test_admin_scope_questionnaire_team_ux.py',
              'scripts/ci/test_ui_business_closure.py',
              'scripts/ci/test_requested_ui_regressions.py',
          ]
          broken = 'text += "' + '\n' + '" + companion.read_text(encoding="utf-8")'
          fixed = 'text += "\\n" + companion.read_text(encoding="utf-8")'
          for relative in targets:
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if broken not in text:
                  raise RuntimeError(f'broken reader not found in {relative}')
              path.write_text(text.replace(broken, fixed), encoding='utf-8')
      - name: Commit reader fix
        run: |
          rm -f .github/workflows/fix-companion-reader-escape-temporary.yml
          rm -f scripts/ci/.private-migration-final-ci-trigger
          git config user.name "wbh123"
          git config user.email "21192079+wbh123@users.noreply.github.com"
          git add -A
          git commit -m "test: 修正拆分页面契约读取器"
          git push origin HEAD
