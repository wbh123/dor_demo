name: Private Mobile Lockfile Commit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit:
    name: Commit generated private mobile lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          [[ -n "$private_ref" && "$private_ref" != "$candidate" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate and validate lockfile
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/package-lock.json
          (cd app && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          node -e "const p=require('./app/package-lock.json'); if(p.lockfileVersion!==3||p.packages[''].version!=='1.2.2') process.exit(1)"
          git add app/package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "app/package-lock.json"
      - name: Commit and push lockfile
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wust Dormitory CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "build(app): add reproducible mobile dependency lockfile"
          git push origin "HEAD:refs/heads/${{ steps.target.outputs.private_ref }}"
