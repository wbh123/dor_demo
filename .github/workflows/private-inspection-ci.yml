name: Private Inspection Compatibility CI

# private inspection refresh 14
on:
  push:
    branches:
      - 'private-compat/feat/inspection-workflow-skeleton-20260814'
permissions:
  contents: read
jobs:
  verify-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private feature branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/inspection-workflow-skeleton-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify inspection OpenAPI contract
        working-directory: private-repo
        run: python scripts/ci/test_inspection_openapi_contract.py
      - name: Verify mobile inspection app
        working-directory: private-repo/app
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Verify admin inspection route contract
        working-directory: private-repo/frontend
        run: node --experimental-strip-types --test src/router/admin-inspection-route.spec.ts
      - name: Verify school admin frontend
        working-directory: private-repo/frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
