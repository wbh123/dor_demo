name: Private Inspection Compatibility CI

# private inspection refresh 5
on:
  push:
    branches:
      - 'private-compat/feat/inspection-workflow-skeleton-20260814'

permissions:
  contents: read

jobs:
  verify-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private feature branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/inspection-workflow-skeleton-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify inspection OpenAPI contract
        working-directory: private-repo
        run: python scripts/ci/test_inspection_openapi_contract.py
      - name: Verify inspection mobile contracts
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/inspection/state.spec.ts src/platform/inspection-navigation.spec.ts src/platform/inspection-workflow-layout.spec.ts
