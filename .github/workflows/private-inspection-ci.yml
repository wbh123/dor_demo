name: Private Inspection Compatibility CI
on:
  push:
    branches: ['private-compat/feat/inspection-workflow-skeleton-20260814']
permissions:
  contents: read
jobs:
  verify-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/inspection-workflow-skeleton-mainline-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Diagnose first failing private contract
        working-directory: private-repo
        shell: bash
        run: |
          set -uo pipefail
          while IFS= read -r command; do
            [[ "$command" == python\ * ]] || continue
            echo "==> $command"
            output=$(eval "$command" 2>&1)
            status=$?
            printf '%s\n' "$output"
            if [[ $status -ne 0 ]]; then
              detail=$(printf '%s\n' "$output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-1500)
              echo "::error title=Private contract failure::$command :: $detail"
              exit $status
            fi
          done < scripts/ci/run_contracts.sh
      - name: Verify inspection OpenAPI contract
        working-directory: private-repo
        run: python scripts/ci/test_inspection_openapi_contract.py
      - name: Verify mobile inspection app
        working-directory: private-repo/app
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Verify admin inspection route contract
        working-directory: private-repo/frontend
        run: node --experimental-strip-types --test src/router/admin-inspection-route.spec.ts
      - name: Install school admin dependencies
        working-directory: private-repo/frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck school admin frontend
        id: admin_typecheck
        continue-on-error: true
        working-directory: private-repo/frontend
        shell: bash
        run: |
          set +e
          set -o pipefail
          output=$(npm run typecheck 2>&1)
          status=$?
          printf '%s\n' "$output" | tee ../../admin-typecheck.log
          if [[ $status -ne 0 ]]; then
            detail=$(printf '%s\n' "$output" | grep -m 1 -E 'error TS[0-9]+|error:' || printf '%s\n' "$output" | tail -n 8 | tr '\n' ' ')
            detail=$(printf '%s' "$detail" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-1500)
            echo "::error title=Admin TypeScript typecheck::$detail"
          fi
          exit $status
      - name: Upload admin typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-typecheck-log
          path: admin-typecheck.log
          if-no-files-found: error
      - name: Fail when admin typecheck failed
        if: steps.admin_typecheck.outcome == 'failure'
        run: exit 1
      - name: Build school admin frontend
        working-directory: private-repo/frontend
        run: npm run build
