name: Resource Label V60 MySQL 8.4 Validation

on:
  push:
    branches:
      - 'test/resource-label-lifecycle-*'
    paths:
      - 'validation/resource-label/**'
      - '.github/workflows/resource-label-v60-mysql84-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql84:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: label_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: label_test
      MYSQL_USER: root
      MYSQL_PASSWORD: root-test-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require Docker runner
        run: docker info
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pymysql==1.1.1
      - name: Validate V60 lifecycle on MySQL 8.4
        run: python validation/resource-label/run_v60_mysql84.py
