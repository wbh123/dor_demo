name: Sanitize Public UI Validation
on:
  push:
    branches: [fix/welcome-brand-home-ui-20260806]
permissions:
  contents: write
jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/welcome-brand-home-ui-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply public-only sanitization
        run: python scripts/ci/sanitize_public_ui_validation.py
      - name: Verify public boundaries and contracts
        run: |
          bash scripts/ci/run_policy.sh
          bash scripts/ci/run_contracts.sh
      - name: Remove temporary files
        run: |
          rm -f scripts/ci/sanitize_public_ui_validation.py
          rm -f .github/workflows/sanitize-public-ui-temp.yml
      - name: Commit sanitized formal source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test: 使用公开占位品牌验证非根路径部署'
          git push origin HEAD:fix/welcome-brand-home-ui-20260806
