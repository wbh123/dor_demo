name: One-time public sanitization

on:
  push:
    branches:
      - sanitize/validation

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sanitize/validation
          fetch-depth: 0
      - name: Remove private-only content and replace institution display text
        run: |
          rm -rf records http docs docker data local-ci-logs
          rm -rf backend-java/docs backend-java/scripts
          rm -rf backend-java/server/src/main/resources/db
          rm -rf backend-java/server/src/test/resources/db
          rm -rf backend-java/server/src/main/resources/mybatis-generator
          rm -rf .idea .vscode frontend/.vscode
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          replacements = {
              '武汉科技大学学生宿舍智能选择系统': '示例大学学生宿舍智能选择系统',
              '武汉科技大学宿舍智能选择系统': '示例大学宿舍智能选择系统',
              'WUHAN UNIVERSITY OF SCIENCE AND TECHNOLOGY': 'DEMO UNIVERSITY',
              '武科大选寝': '高校选寝',
              '武汉科技大学': '示例大学',
              '武科大': '高校',
              '黄家湖校区': '示例校区',
              '黄家湖': '示例校区',
          }
          skip = {
              Path('scripts/ci/validate_public_repository.py'),
              Path('.github/workflows/sanitize-once.yml'),
          }
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in skip:
                  continue
              try:
                  raw = path.read_bytes()
                  if b'\x00' in raw[:8192]:
                      continue
                  text = raw.decode('utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              updated = text
              for source, target in replacements.items():
                  updated = updated.replace(source, target)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          rm -f .github/workflows/sanitize-once.yml
      - name: Commit sanitized result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: apply public sanitization'
          git push origin HEAD:sanitize/validation
