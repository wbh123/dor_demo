name: Temporary validation dispatcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch temporary feature validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run temporary-feature-validation.yml --repo ${{ github.repository }}
