name: Apply UI layout restoration

on:
  push:
    branches:
      - fix/ui-layout-regressions-20260805
    paths:
      - scripts/ci/apply_ui_layout_restoration.py
      - .github/workflows/apply-ui-layout-restoration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ui-layout-regressions-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply requested layout repairs
        run: python scripts/ci/apply_ui_layout_restoration.py
      - name: Verify focused layout contract
        run: python scripts/ci/test_ui_layout_restoration.py .
      - name: Commit repaired source and remove one-time patch tools
        run: |
          rm scripts/ci/apply_ui_layout_restoration.py
          rm .github/workflows/apply-ui-layout-restoration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore batch modal and room layout styling"
          git push origin HEAD:fix/ui-layout-regressions-20260805
