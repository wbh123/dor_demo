name: Apply Room Catalog Mapper Refactor

on:
  push:
    branches:
      - refactor/room-catalog-mapper-20260806

permissions:
  contents: write

concurrency:
  group: room-catalog-refactor-temp
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/room-catalog-mapper-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply incremental service refactor
        run: python scripts/ci/apply_room_catalog_mapper_refactor.py
      - name: Verify formal contracts
        run: |
          python scripts/ci/test_admin_catalog_mybatis.py
          python scripts/ci/test_backend_layering.py
          python scripts/ci/test_no_embedded_sql.py
      - name: Remove temporary migration files
        run: |
          rm -f scripts/ci/apply_room_catalog_mapper_refactor.py
          rm -f .github/workflows/room-catalog-refactor-temp.yml
      - name: Commit formal source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor: migrate room catalog query to MyBatis"
          git push origin HEAD:refactor/room-catalog-mapper-20260806
