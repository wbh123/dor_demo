name: Agent UI Business Closure Round 2

on:
  push:
    branches:
      - agent/ui-business-closure-20260804
    paths:
      - scripts/ci/apply_ui_business_closure_round2.py
      - .github/workflows/agent-ui-business-closure-round2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-business-closure-20260804
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply second closure patch
        run: python3 scripts/ci/apply_ui_business_closure_round2.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes generated"
            exit 0
          fi
          git commit -m "feat: 完成权限住宿与发布业务闭环"
          git push origin HEAD:agent/ui-business-closure-20260804
