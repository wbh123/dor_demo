name: Private Mobile Android Debug Build

on:
  push:
    branches:
      - 'private-compat/feat/mobile-session-experience-20260816'

permissions:
  contents: read

concurrency:
  group: private-mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build private Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json

      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm ci

      - name: Build Android debug APK
        working-directory: private-repo/app
        run: npm run android:build:debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-session-experience-debug-apk
          path: private-repo/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
