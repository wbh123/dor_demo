name: Build sanitized public snapshot artifact

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-public-snapshot-artifact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout export tooling branch
        uses: actions/checkout@v4
        with:
          ref: feature/open-source-generalization
          fetch-depth: 0

      - name: Build sanitized snapshot
        run: |
          git fetch origin main
          python scripts/release/export_public_snapshot.py \
            --ref origin/main \
            --output /tmp/dor-demo-public
          tar --exclude=.git -C /tmp/dor-demo-public -czf /tmp/dor-demo-public.tar.gz .
          mkdir -p /tmp/public-export-artifact
          base64 -w 0 /tmp/dor-demo-public.tar.gz | split -b 400000 - /tmp/public-export-artifact/snapshot.b64.part-
          sha256sum /tmp/dor-demo-public.tar.gz > /tmp/public-export-artifact/SHA256SUMS
          printf '%s\n' 'Reassemble with: cat snapshot.b64.part-* | base64 -d > dor-demo-public.tar.gz' > /tmp/public-export-artifact/README.txt

      - name: Publish artifact branch in private repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan public-export-artifact
          git rm -rf .
          cp -R /tmp/public-export-artifact/. .
          git add .
          git commit -m 'chore: publish sanitized public snapshot artifact'
          git push --force origin public-export-artifact
