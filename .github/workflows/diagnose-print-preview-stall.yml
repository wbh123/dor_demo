name: Diagnose print preview stall

on:
  push:
    branches:
      - 'diagnostics/print-preview-stall-*'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: main
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Prepare canonical font
        working-directory: private-repo/frontend
        run: node scripts/prepare-print-font.mjs
      - name: Add full-preview performance probe
        working-directory: private-repo
        shell: bash
        run: |
          cat > backend-java/server/src/test/java/com/wust/dormitory/label/print/pdf/PrintPreviewPerformanceProbeTest.java <<'JAVA'
          package com.wust.dormitory.label.print.pdf;

          import com.fasterxml.jackson.databind.ObjectMapper;
          import com.wust.dormitory.label.print.PrintTemplateLayoutValidator;
          import com.wust.dormitory.label.print.pdf.model.ResolvedPrintLayout;
          import org.junit.jupiter.api.Test;
          import java.util.List;
          import java.util.concurrent.CompletableFuture;
          import java.util.concurrent.TimeUnit;
          import static org.junit.jupiter.api.Assertions.assertNotNull;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          class PrintPreviewPerformanceProbeTest {
              private static final String SHA = "d68bafcb48a2707749396aa12bbbd833cb70401f3a9a689fd2902c7e0d295964";
              private static final String LAYOUT = """
                  {"schemaVersion":1,"elements":[
                    {"id":"qr","type":"QR_CODE","xMm":2,"yMm":3,"widthMm":18,"heightMm":18,"zIndex":1},
                    {"id":"school","type":"SCHOOL_NAME","xMm":23,"yMm":2,"widthMm":25,"heightMm":4.5,"fontSizePt":9,"minFontSizePt":6,"fontWeight":700,"lineHeight":1.15,"maxLines":1,"align":"LEFT","verticalAlign":"MIDDLE"},
                    {"id":"campus","type":"CAMPUS_NAME","xMm":23,"yMm":6.5,"widthMm":25,"heightMm":4.5,"fontSizePt":8,"minFontSizePt":6,"fontWeight":400,"lineHeight":1.15,"maxLines":1,"align":"LEFT","verticalAlign":"MIDDLE"},
                    {"id":"building","type":"BUILDING_NAME","xMm":23,"yMm":11,"widthMm":14.5,"heightMm":4.5,"fontSizePt":10,"minFontSizePt":6,"fontWeight":700,"lineHeight":1.15,"maxLines":1,"align":"LEFT","verticalAlign":"MIDDLE"},
                    {"id":"floor","type":"FLOOR_NUMBER","xMm":38,"yMm":11,"widthMm":10,"heightMm":4.5,"fontSizePt":8,"minFontSizePt":6,"fontWeight":400,"lineHeight":1.15,"maxLines":1,"align":"LEFT","verticalAlign":"MIDDLE","suffix":"层"},
                    {"id":"room","type":"ROOM_NUMBER","xMm":23,"yMm":19,"widthMm":14.5,"heightMm":4.5,"fontSizePt":11,"minFontSizePt":6,"fontWeight":700,"lineHeight":1.15,"maxLines":1,"align":"LEFT","verticalAlign":"MIDDLE","suffix":"寝室"},
                    {"id":"bed","type":"BED_CODE","xMm":38,"yMm":19,"widthMm":10,"heightMm":4.5,"fontSizePt":11,"minFontSizePt":6,"fontWeight":700,"lineHeight":1.15,"maxLines":1,"align":"LEFT","verticalAlign":"MIDDLE"},
                    {"id":"code","type":"PUBLIC_CODE","xMm":2,"yMm":23,"widthMm":18,"heightMm":3,"fontSizePt":7,"minFontSizePt":6,"fontWeight":400,"lineHeight":1.15,"maxLines":1,"align":"CENTER","verticalAlign":"MIDDLE"}
                  ]}
                  """;
              private static final PrintLayoutEngine.PrintData DATA = new PrintLayoutEngine.PrintData(
                  "武汉科技大学", "黄家湖校区", "北一舍", 3, "301", "2号床", "08351724");

              private Fixture fixture() {
                  String path = System.getProperty("fontPath");
                  PrintFontRegistry registry = new PrintFontRegistry(path, path, SHA, SHA);
                  ObjectMapper mapper = new ObjectMapper();
                  PrintLayoutEngine engine = new PrintLayoutEngine(mapper, new PrintTemplateLayoutValidator(mapper),
                      new PrintTextLayoutEngine(registry), new PrintQrLayoutEngine(), registry);
                  return new Fixture(engine, new PrintPdfRenderer(registry));
              }

              @Test
              void probeColdPdfAndActualConcurrentBrowserPreviewPair() throws Exception {
                  Fixture cold = fixture();
                  long start = System.nanoTime();
                  ResolvedPrintLayout resolved = cold.engine.resolve(LAYOUT, 50, 30, DATA);
                  byte[] pdf = cold.renderer.render(List.of(resolved), PrintPdfRenderer.LayoutCode.SINGLE, id -> null);
                  long coldMs = TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - start);
                  System.out.println("PRINT_PREVIEW_COLD_LAYOUT_PLUS_PDF_MS=" + coldMs);
                  System.out.println("PRINT_PREVIEW_PDF_BYTES=" + pdf.length);
                  assertTrue(pdf.length > 1000);

                  Fixture shared = fixture();
                  start = System.nanoTime();
                  CompletableFuture<?> layoutRequest = CompletableFuture.runAsync(() -> shared.engine.resolve(LAYOUT, 50, 30, DATA));
                  CompletableFuture<?> pdfRequest = CompletableFuture.runAsync(() -> {
                      ResolvedPrintLayout label = shared.engine.resolve(LAYOUT, 50, 30, DATA);
                      byte[] bytes = shared.renderer.render(List.of(label), PrintPdfRenderer.LayoutCode.SINGLE, id -> null);
                      assertNotNull(bytes);
                  });
                  CompletableFuture.allOf(layoutRequest, pdfRequest).get(60, TimeUnit.SECONDS);
                  long pairMs = TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - start);
                  System.out.println("PRINT_PREVIEW_ACTUAL_CONCURRENT_PAIR_MS=" + pairMs);
              }

              private record Fixture(PrintLayoutEngine engine, PrintPdfRenderer renderer) {}
          }
          JAVA
      - name: Run full-preview performance probe
        working-directory: private-repo
        run: >-
          mvn -B -ntp -f backend-java/pom.xml -pl server -am
          -Dtest=PrintPreviewPerformanceProbeTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -DfontPath="$GITHUB_WORKSPACE/private-repo/frontend/public/fonts/NotoSansSC-VF.ttf"
          test
