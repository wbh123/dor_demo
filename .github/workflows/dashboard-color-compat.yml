name: Dashboard Color Compatibility CI

on:
  push:
    branches:
      - 'private-compat/style/admin-dashboard-accent-colors-20260816'

permissions:
  contents: read

jobs:
  dashboard-color-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: style/admin-dashboard-accent-colors-20260816
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: private-repo/frontend
        run: npm ci

      - name: Run dashboard color contract
        working-directory: private-repo/frontend
        run: node --experimental-strip-types --test src/views/admin/admin-dashboard-color-contract.spec.ts

      - name: Run frontend tests
        working-directory: private-repo/frontend
        run: npm test

      - name: Run frontend typecheck
        working-directory: private-repo/frontend
        run: npm run typecheck

      - name: Run frontend production build
        working-directory: private-repo/frontend
        run: npm run build
