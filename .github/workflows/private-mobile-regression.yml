name: Private Mobile Regression CI

on:
  push:
    branches:
      - 'private-compat/agent/mobile-label-reprint-scan-workbench-regressions'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private regression branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: agent/mobile-label-reprint-scan-workbench-regressions
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - name: Fetch private main for version guard
        working-directory: private-repo
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install APP dependencies
        working-directory: private-repo/app
        run: npm install --no-audit --no-fund

      - name: Verify APP version source consistency
        working-directory: private-repo/app
        run: node scripts/check-version-sync.mjs

      - name: Verify APP version bump from main
        working-directory: private-repo/app
        run: node scripts/check-version-bump.mjs origin/main

      - name: Run APP regression tests
        working-directory: private-repo/app
        run: npm test

      - name: Typecheck APP
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Build APP
        working-directory: private-repo/app
        run: npm run build

      - name: Run resource label batch service tests
        working-directory: private-repo
        run: >-
          mvn -f backend-java/pom.xml -B -ntp -pl server -am
          -Dtest=ResourceLabelBatchServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Compile backend server modules
        working-directory: private-repo
        run: mvn -f backend-java/pom.xml -B -ntp -pl server -am -DskipTests compile

      - name: Build Android Debug APK
        working-directory: private-repo/app
        run: npm run android:build:debug
