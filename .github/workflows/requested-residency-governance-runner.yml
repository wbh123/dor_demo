name: Requested Residency Governance Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: requested-residency-governance-runner
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: startsWith(github.head_ref, 'fix/student-residency-governance-ui')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Normalize requested patch script
        run: |
          python scripts/ci/normalize_requested_residency_governance_fixes.py
          python -m py_compile scripts/ci/apply_requested_residency_governance_fixes.py
      - name: Apply requested fixes
        run: python scripts/ci/apply_requested_residency_governance_fixes.py
      - name: Run focused regression contract
        run: python scripts/ci/test_requested_residency_governance_regressions.py
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Run focused backend tests
        run: >-
          mvn -f backend-java/pom.xml -pl server -am test
          -Dtest=AdminStudentResidencyAdjustmentServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Commit verified changes
        run: |
          rm -f scripts/ci/apply_requested_residency_governance_fixes.py
          rm -f scripts/ci/normalize_requested_residency_governance_fixes.py
          rm -f .github/workflows/temp-requested-regression-red.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: 修复在住床位同步与治理界面"
          git push origin HEAD:${{ github.head_ref }}
