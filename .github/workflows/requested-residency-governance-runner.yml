name: Requested Residency Governance Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: requested-residency-governance-runner
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/student-residency-governance-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/student-residency-governance-ui
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply and verify requested fixes
        shell: bash
        run: |
          set +e
          {
            python scripts/ci/normalize_requested_residency_governance_fixes.py
            python -m py_compile scripts/ci/apply_requested_residency_governance_fixes.py
            python scripts/ci/apply_requested_residency_governance_fixes.py
            python scripts/ci/test_requested_residency_governance_regressions.py
            (cd frontend && npm ci && npm run build)
            mvn -f backend-java/pom.xml -pl server -am test \
              -Dtest=AdminStudentResidencyAdjustmentServiceTest \
              -Dsurefire.failIfNoSpecifiedTests=false
          } > /tmp/requested-fix-validation.log 2>&1
          status=$?
          set -e

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -ne 0 ]; then
            tail -n 500 /tmp/requested-fix-validation.log > scripts/ci/last_requested_fix_failure.log
            git add scripts/ci/last_requested_fix_failure.log
            git commit -m "ci: 记录在住治理修复失败位置"
            git push origin HEAD:fix/student-residency-governance-ui
            exit 0
          fi

          rm -f scripts/ci/last_requested_fix_failure.log
          rm -f scripts/ci/apply_requested_residency_governance_fixes.py
          rm -f scripts/ci/normalize_requested_residency_governance_fixes.py
          rm -f .github/workflows/temp-requested-regression-red.yml
          git add -A
          git commit -m "fix: 修复在住床位同步与治理界面"
          git push origin HEAD:fix/student-residency-governance-ui
