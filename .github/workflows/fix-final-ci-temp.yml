name: Finalize Login Copy And Render Contract
on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/dormitory-login-preference-ui-20260805
      - name: Update environment copy and SSR assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          login = Path('frontend/src/views/LoginView.vue')
          text = login.read_text(encoding='utf-8')
          text = text.replace(
              "const institutionName = String(import.meta.env.VITE_INSTITUTION_NAME || '武汉科技大学马德里学院')",
              "const institutionName = String(import.meta.env.VITE_INSTITUTION_NAME || '示例院校')",
          )
          marker = "const icpRecord = String(import.meta.env.VITE_ICP_RECORD || '')\n"
          additions = (
              "const heroTitle = String(import.meta.env.VITE_LOGIN_HERO_TITLE || `${institutionName}学生社区`)\n"
              "const heroDescription = String(import.meta.env.VITE_LOGIN_HERO_DESCRIPTION || '尊重差异、友好相处，共同建设温暖有序的学生社区。')\n"
              "const heroBrandSubtitle = String(import.meta.env.VITE_LOGIN_BRAND_SUBTITLE || '学生社区')\n"
              "const loginServiceName = String(import.meta.env.VITE_LOGIN_SERVICE_NAME || '学生宿舍服务')\n"
          )
          if additions not in text:
              text = text.replace(marker, marker + additions)
          text = text.replace(
              '<div class="madrid-brand"><img class="login-school-logo" :src="logoOnly" :alt="`${institutionName}校徽`" /><div><strong>武汉科技大学</strong><span>马德里学院</span></div></div>\n        <h1>在多元文化校园中<br />安心学习，友好相处</h1>\n        <p>愿每位同学都能在马德里学院的校园生活中，找到彼此尊重、作息合拍的宿舍伙伴，共同建设温暖有序的学生社区。</p>',
              '<div class="madrid-brand"><img class="login-school-logo" :src="logoOnly" :alt="`${institutionName}校徽`" /><div><strong>{{ institutionName }}</strong><span>{{ heroBrandSubtitle }}</span></div></div>\n        <h1 class="login-hero-title">{{ heroTitle }}</h1>\n        <p>{{ heroDescription }}</p>',
          )
          text = text.replace(
              '<div class="brand login-brand school-login-brand"><img :src="logoOnly" :alt="`${institutionName}校徽`" /><div><strong>武汉科技大学马德里学院</strong><span>学生宿舍服务</span></div></div>',
              '<div class="brand login-brand school-login-brand"><img :src="logoOnly" :alt="`${institutionName}校徽`" /><div><strong>{{ institutionName }}</strong><span>{{ loginServiceName }}</span></div></div>',
          )
          text = text.replace(
              '.hero-copy h1 { margin:0; font-size:clamp(34px,4vw,56px); line-height:1.14; letter-spacing:-.03em; }',
              '.hero-copy h1 { margin:0; font-size:clamp(34px,4vw,56px); line-height:1.14; letter-spacing:-.03em; white-space:pre-line; }',
          )
          login.write_text(text, encoding='utf-8')

          test = Path('scripts/ci/test_dormitory_login_preference_ui.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'assert \'武汉科技大学马德里学院\' in login',
              "assert 'VITE_LOGIN_HERO_TITLE' in login and 'VITE_LOGIN_HERO_DESCRIPTION' in login",
          )
          text = text.replace(
              'assert "武汉科技大学马德里学院" in login',
              'assert "VITE_LOGIN_HERO_TITLE" in login and "VITE_LOGIN_HERO_DESCRIPTION" in login',
          )
          test.write_text(text, encoding='utf-8')

          render = Path('scripts/ci/test_student_home_render.mjs')
          text = render.read_text(encoding='utf-8')
          text = text.replace('assert.match(html, /欢迎回来|WELCOME BACK/)', "assert.match(html, /welcome-card/)\n  assert.match(html, /同学/)")
          render.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-final-ci-temp.yml
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: drive login copy from environment and align render contract"
          git push origin HEAD:fix/dormitory-login-preference-ui-20260805
