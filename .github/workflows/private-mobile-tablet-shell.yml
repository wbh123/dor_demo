name: Private Mobile Tablet Shell CI

on:
  push:
    branches:
      - 'private-compat/refactor/mobile-tablet-adaptive-shell-20260814'

permissions:
  contents: read

jobs:
  full-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/mobile-tablet-adaptive-shell-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Record private HEAD
        working-directory: private-repo
        run: git rev-parse HEAD

      - name: Install mobile dependencies
        working-directory: private-repo
        run: npm install --prefix app --no-audit --no-fund

      - name: Run all mobile tests
        working-directory: private-repo
        run: npm --prefix app test

      - name: Generate mobile OpenAPI types
        working-directory: private-repo
        run: npm --prefix app run generate:api

      - name: Typecheck mobile app
        working-directory: private-repo
        run: npm --prefix app run typecheck

      - name: Build mobile app
        working-directory: private-repo
        run: npm --prefix app run build
