name: Private Dorm Staff Bed Verification

on:
  push:
    branches:
      - 'private-compat/fix/dorm-staff-selection-bed-verification-20260815'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private feature branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/dorm-staff-selection-bed-verification-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Run mobile bed verification contracts
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/dorm-staff-bed-verification.spec.ts src/platform/checkin-bed-workflow.spec.ts
      - name: Run authorization contract
        working-directory: private-repo
        run: python3 scripts/ci/test_admin_high_risk_authorization.py
      - name: Run selection bed verification policy test
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl server -am -Dtest=MobileSelectionBedVerificationPolicyTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install
      - name: Typecheck mobile app
        working-directory: private-repo/app
        run: npm run typecheck
      - name: Build mobile app
        working-directory: private-repo/app
        run: npm run build
      - name: Verify backend Java modules
        working-directory: private-repo/backend-java
        run: mvn -B -ntp test
