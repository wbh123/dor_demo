name: Private Dorm Staff Web CI

on:
  push:
    branches:
      - 'private-compat/refactor/dorm-staff-web-shell-20260814'

permissions:
  contents: read

jobs:
  verify-shell-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/dorm-staff-web-shell-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify dorm staff shell contract
        working-directory: private-repo
        run: node scripts/ci/test_dorm_staff_web_shell.mjs

  verify-backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/dorm-staff-web-shell-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Verify dorm staff web controller contract
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl server -am -Dtest=DormStaffWebControllerTest -Dsurefire.failIfNoSpecifiedTests=false test

  verify-inspection-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/dorm-staff-web-shell-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify V46 inspection workflow schema
        working-directory: private-repo
        run: python scripts/db/test_v46_inspection_workflow_schema.py

  verify-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/dorm-staff-web-shell-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json
      - name: Install and generate API types
        working-directory: private-repo
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run --prefix frontend generate:api
      - name: Typecheck frontend
        working-directory: private-repo
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: npm run --prefix frontend typecheck
      - name: Build frontend
        working-directory: private-repo
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: npm run --prefix frontend build
      - name: Verify focused frontend contract
        working-directory: private-repo
        run: node scripts/ci/test_dorm_staff_web_shell.mjs

  verify-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: refactor/dorm-staff-web-shell-20260814
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Verify Java server module
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl server -am test
