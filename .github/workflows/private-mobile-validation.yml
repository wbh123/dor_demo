name: Private Mobile Validation

on:
  push:
    branches:
      - 'mobile-validate/**'

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: integration/mobile-resource-label-selector-main-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install

      - name: Validate resource label print layout
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/resource-label-print-layout.spec.ts

      - name: Validate resource label parsing
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/resource-label.spec.ts

      - name: Validate bounded label queries
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/label-scan-performance-contract.spec.ts

      - name: Validate native scanner contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/native-scanner-contract.spec.ts

      - name: Validate overlay contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/action-overlay.spec.ts

      - name: Run full mobile tests
        working-directory: private-repo/app
        run: npm test

      - name: Run mobile typecheck
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Build mobile web assets
        working-directory: private-repo/app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: private-repo/app
        run: npx cap sync android

      - name: Validate Android
        working-directory: private-repo/app/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
