name: Private Mobile Validation

on:
  push:
    branches:
      - 'mobile-validate/**'

permissions:
  contents: read

jobs:
  baseline-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: main
          token: ${{ secrets.PRIVATE_CI }}
          path: baseline-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install baseline mobile dependencies
        working-directory: baseline-repo/app
        run: npm install --no-audit --no-fund
      - name: Verify known baseline mobile failures
        working-directory: baseline-repo/app
        shell: bash
        run: |
          set +e
          npm test > /tmp/baseline-mobile-tests.log 2>&1
          status=$?
          set -e
          grep -E '^not ok [0-9]+ - ' /tmp/baseline-mobile-tests.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/failures.txt || true
          cat > /tmp/allowed.txt <<'EOF'
          home shows at most three priority rooms and links to the full room workbench
          legacy room and bed labels are resolved by the authenticated label endpoint
          mobile pages do not render generic transient success messages in layout flow
          room workbench is a search page before the room operation page
          student workbench is a search page before the student operation page
          扫码页打开即启用摄像头并支持 torch 和手动输入
          EOF
          sort -u -o /tmp/allowed.txt /tmp/allowed.txt
          unknown=$(comm -23 /tmp/failures.txt /tmp/allowed.txt || true)
          if [ -n "$unknown" ]; then echo "$unknown"; exit 1; fi

  validate-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/app-version-label-selector-v2-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - name: Record private feature HEAD
        working-directory: private-repo
        run: git rev-parse HEAD
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Backend focused tests
        working-directory: private-repo/backend-java
        run: mvn -pl server -am -Dtest=MobileAppReleaseServiceTest,MobileAppVersionControllerTest,MobileAppReleaseDownloadControllerTest,ResourceLabelTargetServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Backend compile package
        working-directory: private-repo/backend-java
        run: mvn -pl starter -am -DskipTests package
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install --no-audit --no-fund
      - name: Resource label selector tests
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/natural-resource-sort.spec.ts src/platform/resource-label-print-layout.spec.ts
      - name: Mobile full regression delta
        working-directory: private-repo/app
        shell: bash
        run: |
          set +e
          npm test > /tmp/mobile-tests.log 2>&1
          status=$?
          set -e
          grep -E '^not ok [0-9]+ - ' /tmp/mobile-tests.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/failures.txt || true
          cat > /tmp/allowed.txt <<'EOF'
          home shows at most three priority rooms and links to the full room workbench
          legacy room and bed labels are resolved by the authenticated label endpoint
          mobile pages do not render generic transient success messages in layout flow
          room workbench is a search page before the room operation page
          student workbench is a search page before the student operation page
          扫码页打开即启用摄像头并支持 torch 和手动输入
          EOF
          sort -u -o /tmp/allowed.txt /tmp/allowed.txt
          unknown=$(comm -23 /tmp/failures.txt /tmp/allowed.txt || true)
          if [ -n "$unknown" ]; then echo "$unknown"; tail -n 260 /tmp/mobile-tests.log; exit 1; fi
      - name: Mobile version consistency
        working-directory: private-repo/app
        run: npm run version:check
      - name: Mobile version bump guard
        working-directory: private-repo/app
        run: node scripts/check-version-bump.mjs origin/main
      - name: Mobile typecheck
        working-directory: private-repo/app
        run: npm run typecheck
      - name: Mobile production build
        working-directory: private-repo/app
        run: npm run build
      - name: Sync Capacitor Android
        working-directory: private-repo/app
        run: npx cap sync android
      - name: Android validation
        working-directory: private-repo/app/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Install web dependencies
        working-directory: private-repo/frontend
        run: npm install --no-audit --no-fund
      - name: Web tests
        working-directory: private-repo/frontend
        run: npm test
      - name: Web typecheck
        working-directory: private-repo/frontend
        run: npm run typecheck
      - name: Web production build
        working-directory: private-repo/frontend
        run: npm run build
