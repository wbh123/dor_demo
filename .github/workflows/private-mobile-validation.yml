name: Private Mobile Validation

on:
  push:
    branches:
      - 'mobile-validate/**'

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/mobile-resource-label-selector-layout-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify resource label print layout contract is red
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/resource-label-print-layout.spec.ts
