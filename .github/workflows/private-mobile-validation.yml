name: Private Mobile Validation

on:
  push:
    branches:
      - 'mobile-validate/**'

permissions:
  contents: read

jobs:
  validate-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/app-version-label-selector-v2-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Backend focused tests
        working-directory: private-repo/backend-java
        run: mvn -pl server -am -Dtest=MobileAppReleaseServiceTest,MobileAppVersionControllerTest,ResourceLabelTargetServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install
      - name: Mobile version consistency
        working-directory: private-repo/app
        run: npm run version:check
      - name: Mobile focused contracts
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/natural-resource-sort.spec.ts src/platform/resource-label-print-layout.spec.ts src/platform/native-scanner-contract.spec.ts
      - name: Mobile typecheck
        working-directory: private-repo/app
        run: npm run typecheck
      - name: Mobile production build
        working-directory: private-repo/app
        run: npm run build
      - name: Sync Capacitor Android
        working-directory: private-repo/app
        run: npx cap sync android
      - name: Android validation
        working-directory: private-repo/app/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Install web dependencies
        working-directory: private-repo/frontend
        run: npm install
      - name: Web typecheck
        working-directory: private-repo/frontend
        run: npm run typecheck
      - name: Web production build
        working-directory: private-repo/frontend
        run: npm run build
