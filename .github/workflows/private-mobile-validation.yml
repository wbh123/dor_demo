name: Private Mobile Validation

on:
  push:
    branches:
      - 'mobile-validate/**'

permissions:
  contents: read

jobs:
  validate-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: feat/app-version-label-selector-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate natural resource sort
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/natural-resource-sort.spec.ts
      - name: Validate scanner layout wait contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/native-scanner-contract.spec.ts
