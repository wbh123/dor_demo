name: Apply layout contract update

on:
  push:
    branches:
      - fix/ui-layout-regressions-20260805
    paths:
      - scripts/ci/apply_layout_contract_update.py
      - .github/workflows/apply-layout-contract-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ui-layout-regressions-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/ci/apply_layout_contract_update.py
      - run: python scripts/ci/test_ui_layout_restoration.py .
      - name: Commit contract update and remove one-time tools
        run: |
          rm scripts/ci/apply_layout_contract_update.py
          rm .github/workflows/apply-layout-contract-update.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: align default-layout contract with simplified editor"
          git push origin HEAD:fix/ui-layout-regressions-20260805
