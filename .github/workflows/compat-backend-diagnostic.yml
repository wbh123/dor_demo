name: Compatibility backend diagnostic

on:
  push:
    branches:
      - test/private-compatible-selection-enhancements-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend and capture log
        shell: bash
        run: |
          set +e
          mvn -f backend-java/pom.xml --batch-mode --no-transfer-progress clean verify > backend-diagnostic.log 2>&1
          status=$?
          echo "$status" > backend-diagnostic.status
          cat backend-diagnostic.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-backend-diagnostic
          path: |
            backend-diagnostic.log
            backend-diagnostic.status
          retention-days: 1
