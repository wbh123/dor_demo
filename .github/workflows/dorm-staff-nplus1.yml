name: Dorm Staff N Plus One

on:
  push:
    branches:
      - 'private-compat/fix/dorm-staff-nplus1-20260815'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout compatibility helpers
        uses: actions/checkout@v5
        with:
          path: ci-repo
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: fix/dorm-staff-nplus1-latest-20260815
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply minimal batch-scope patch
        run: python ci-repo/.github/scripts/patch_dorm_staff_nplus1.py
      - name: Run focused regression test
        working-directory: private-repo
        run: mvn -f backend-java/pom.xml -pl server -am -Dtest=DormStaffWebControllerBatchScopeTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Commit verified patch to private branch
        working-directory: private-repo
        run: |
          git config user.name 'WangBinghao'
          git config user.email '2495680763@qq.com'
          git add backend-java/server/src/main/java/com/wust/dormitory/admin/DormStaffWebController.java
          git diff --cached --quiet && exit 0
          git commit -m 'fix: 宿管工作台批量过滤寝室授权范围'
          git push origin HEAD:fix/dorm-staff-nplus1-latest-20260815

# retry after matcher fix
