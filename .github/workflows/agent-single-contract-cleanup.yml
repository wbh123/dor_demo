name: Agent Single Contract Cleanup

on:
  push:
    branches:
      - agent/ui-business-closure-20260804
    paths:
      - scripts/ci/apply_single_contract_cleanup.py
      - .github/workflows/agent-single-contract-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-business-closure-20260804
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/ci/apply_single_contract_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 清理旧学生录入来源兼容值"
          git push origin HEAD:agent/ui-business-closure-20260804
