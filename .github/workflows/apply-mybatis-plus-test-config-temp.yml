name: Apply MyBatis-Plus Test Configuration

on:
  push:
    branches:
      - verify/mybatis-plus-boot4-runtime-20260806

permissions:
  contents: write

concurrency:
  group: mybatis-plus-test-config-temp
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: verify/mybatis-plus-boot4-runtime-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Migrate test configurations
        run: python scripts/ci/apply_mybatis_plus_test_configuration.py
      - name: Verify foundation contract
        run: python scripts/ci/test_mybatis_foundation.py
      - name: Remove temporary migration files
        run: |
          rm -f scripts/ci/apply_mybatis_plus_test_configuration.py
          rm -f .github/workflows/apply-mybatis-plus-test-config-temp.yml
      - name: Commit formal test changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test: migrate manual configurations to MyBatis-Plus"
          git push origin HEAD:verify/mybatis-plus-boot4-runtime-20260806
