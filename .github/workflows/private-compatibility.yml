name: Android Capacitor Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: android-private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android v1 debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$GITHUB_REF_NAME" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify Vue mobile app
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm test
          npm run typecheck
          npm run build

      - name: Generate Android debug project
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          sed -i 's/minSdkVersion = 24/minSdkVersion = 26/' android/variables.gradle
          npx cap sync android
          grep -q "minSdkVersion = 26" android/variables.gradle
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle

      - name: Verify no Google service runtime dependencies
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/check_android_no_google.sh
          cd app/android
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > ../android-debug-runtime-dependencies.txt
          if grep -EHi 'com\.google\.(firebase|android\.gms|mlkit)|firebase-|play-services-|mlkit' ../android-debug-runtime-dependencies.txt; then
            echo 'Forbidden Google/Firebase runtime dependency detected' >&2
            exit 1
          fi

      - name: Assemble Android Debug APK
        working-directory: private-repo/app/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew lintDebug assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
