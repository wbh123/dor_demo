name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'
    paths-ignore:
      - 'ci/latest-apply-result.txt'
      - 'ci/latest-private-validation.txt'

permissions:
  contents: write

concurrency:
  group: private-compat-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-private-followups:
    name: Apply private follow-ups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve private branch
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          [[ "$private_ref" != "$GITHUB_REF_NAME" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: ci-tools
          persist-credentials: true

      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0

      - name: Apply and publish diagnostics
        id: apply
        shell: bash
        run: |
          set +e
          result="$GITHUB_WORKSPACE/ci-tools/ci/latest-apply-result.txt"
          mkdir -p "$GITHUB_WORKSPACE/ci-tools/ci"
          : > "$result"
          {
            echo "private_ref=${{ steps.target.outputs.private_ref }}"
            echo "private_before=$(git -C private-repo rev-parse HEAD)"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$result"

          python - <<'PY' > /tmp/prepare.log 2>&1
          from pathlib import Path
          p = Path('ci-tools/ci/apply_runtime_followups.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "message.value = '文件已上传，后台预检任务已创建。可以关闭窗口，任务会继续执行。' ",
              "message.value = '文件已上传，后台预检任务已创建。可以关闭窗口，稍后重新查看结果。' "
          )
          p.write_text(text, encoding='utf-8')
          PY
          prepare=$?
          echo "prepare=$prepare" >> "$result"

          if [[ $prepare -eq 0 ]]; then
            python ci-tools/ci/apply_runtime_followups.py > /tmp/runtime.log 2>&1
            runtime=$?
          else
            runtime=99
          fi
          echo "runtime=$runtime" >> "$result"

          if [[ $runtime -eq 0 ]]; then
            python ci-tools/ci/apply_openapi_closure.py > /tmp/openapi.log 2>&1
            openapi=$?
          else
            openapi=99
          fi
          echo "openapi=$openapi" >> "$result"

          push=99
          if [[ $runtime -eq 0 && $openapi -eq 0 ]]; then
            cd private-repo
            if ! git diff --quiet; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add -A
              git commit -m "fix: close import retry policy and site asset contracts" > /tmp/commit.log 2>&1
              commit_code=$?
              if [[ $commit_code -eq 0 ]]; then
                git push origin HEAD:${{ steps.target.outputs.private_ref }} > /tmp/push.log 2>&1
                push=$?
              else
                push=$commit_code
              fi
            else
              echo "no private diff" > /tmp/commit.log
              echo "no private diff" > /tmp/push.log
              push=0
            fi
            cd "$GITHUB_WORKSPACE"
          fi
          echo "push=$push" >> "$result"
          echo "private_after=$(git -C private-repo rev-parse HEAD)" >> "$result"

          for pair in prepare:/tmp/prepare.log:$prepare runtime:/tmp/runtime.log:$runtime openapi:/tmp/openapi.log:$openapi push:/tmp/push.log:$push; do
            IFS=: read -r label logfile code <<< "$pair"
            if [[ "$code" -ne 0 && -f "$logfile" ]]; then
              {
                echo
                echo "===== ${label} failure tail ====="
                tail -n 160 "$logfile"
              } >> "$result"
            fi
          done

          overall=0
          for code in "$prepare" "$runtime" "$openapi" "$push"; do
            [[ "$code" -eq 0 ]] || overall=1
          done
          echo "overall=$overall" >> "$result"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish apply result
        if: always()
        working-directory: ci-tools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/latest-apply-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record private patch application [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fail when patch application failed
        if: steps.apply.outputs.overall != '0'
        run: exit 1
