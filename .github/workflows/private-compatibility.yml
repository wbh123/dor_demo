name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Differential mobile inspection acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Record legacy full-contract status
        continue-on-error: true
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run_contracts.sh

      - name: Verify inspection contracts and modularization
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/test_inspection_openapi_contract.py
          python scripts/ci/test_backend_modularization_boundaries.py

      - name: Verify Java 21 modules
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify

      - name: Verify web frontend
        working-directory: private-repo
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          bash scripts/ci/run_frontend.sh

      - name: Install mobile app dependencies
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false --no-audit --no-fund

      - name: Generate mobile OpenAPI types
        working-directory: private-repo/app
        shell: bash
        run: npm run generate:api

      - name: Check generated mobile OpenAPI drift
        continue-on-error: true
        working-directory: private-repo
        shell: bash
        run: git diff --exit-code -- app/src/api/schema.d.ts

      - name: Verify mobile app tests
        working-directory: private-repo/app
        run: npm test

      - name: Verify mobile app types
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Verify mobile app production build
        working-directory: private-repo/app
        run: npm run build
