name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify private ref end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private ref
        id: checkout_private
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - name: Capture private head
        id: private_head
        working-directory: private-repo
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            private-repo/frontend/package-lock.json
            private-repo/app/package-lock.json

      - name: Verify large-response targeted contracts
        id: large_response_contracts
        continue-on-error: true
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/test_admin_large_response_contract.py
          python scripts/ci/test_bed_confirmation_mybatis.py
          python scripts/ci/test_mobile_admin_p1_contract.py

      - name: Verify targeted Java regression tests
        id: targeted_java
        continue-on-error: true
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl server -am \
            -Dtest=MobileTaskQueryServiceTest,AdminStudentResidencyAdjustmentServiceTest,MobileResidencyOnsiteAdjustmentServiceTest,MobileBedConfirmationPaginationTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify full contracts
        id: full_contracts
        continue-on-error: true
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/test_runtime_error_data_correctness_batch.py
          bash scripts/ci/run_contracts.sh

      - name: Verify modularization does not regress against main
        id: modularization
        continue-on-error: true
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess

          JAVA_ROOT = 'backend-java/server/src/main/java/'
          JAVA_LIMIT = 300
          CONTROLLER_LIMIT = 12
          OVERRIDE = re.compile(r'(?m)^\s*@Override\s*$')
          ROUTE = re.compile(r'(?m)^\s*@(Get|Post|Put|Delete|Patch)Mapping\b')

          def files(ref):
              out = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', ref, '--', JAVA_ROOT], text=True)
              return [p for p in out.splitlines() if p.endswith('.java')]

          def source(ref, path):
              try:
                  return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)
              except subprocess.CalledProcessError:
                  return None

          def snapshot(ref):
              java = {}
              controllers = {}
              for path in files(ref):
                  text = source(ref, path)
                  if text is None:
                      continue
                  java[path] = len(text.splitlines())
                  if path.endswith('Controller.java') and '@RestController' in text:
                      overrides = len(OVERRIDE.findall(text))
                      routes = len(ROUTE.findall(text))
                      controllers[path] = overrides if overrides > 0 else routes
              return java, controllers

          base_java, base_controllers = snapshot('origin/main')
          head_java, head_controllers = snapshot('HEAD')
          errors = []
          for path, lines in head_java.items():
              base = base_java.get(path, 0)
              if lines > JAVA_LIMIT and base <= JAVA_LIMIT:
                  errors.append(f'新增大型 Java 文件: {path} ({lines} 行, main={base})')
              elif base > JAVA_LIMIT and lines > base:
                  errors.append(f'既有大型 Java 文件继续增长: {path} ({base} -> {lines})')
          for path, ops in head_controllers.items():
              base = base_controllers.get(path, 0)
              if ops > CONTROLLER_LIMIT and base <= CONTROLLER_LIMIT:
                  errors.append(f'新增聚合 Controller: {path} ({ops} operations, main={base})')
              elif base > CONTROLLER_LIMIT and ops > base:
                  errors.append(f'既有聚合 Controller 继续增长: {path} ({base} -> {ops})')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print('Differential backend modularization guard passed')
          PY

      - name: Verify private Java modules
        id: java_verify
        continue-on-error: true
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify

      - name: Verify private frontend
        id: frontend_verify
        continue-on-error: true
        working-directory: private-repo
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          bash scripts/ci/run_frontend.sh

      - name: Install private mobile dependencies
        id: mobile_install
        continue-on-error: true
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Verify mobile OpenAPI drift
        id: mobile_openapi
        if: always() && steps.mobile_install.outcome == 'success'
        continue-on-error: true
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Verify mobile tests with per-file isolation
        id: mobile_tests
        if: always() && steps.mobile_install.outcome == 'success'
        continue-on-error: true
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(node -e "const p=require('./package.json'); for (const f of (p.scripts.test.match(/src\\/[^ ]+\\.spec\\.ts/g) || [])) console.log(f)")
          if [[ ${#test_files[@]} -eq 0 ]]; then
            echo "No mobile tests resolved from package.json" >&2
            exit 1
          fi
          echo "Running ${#test_files[@]} mobile contract files with process isolation"
          for test_file in "${test_files[@]}"; do
            node --experimental-strip-types --test "$test_file"
          done

      - name: Verify mobile typecheck
        id: mobile_typecheck
        if: always() && steps.mobile_install.outcome == 'success'
        continue-on-error: true
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Verify mobile production build
        id: mobile_build
        if: always() && steps.mobile_install.outcome == 'success'
        continue-on-error: true
        working-directory: private-repo/app
        run: npm run build

      - name: Report validation outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_HEAD: ${{ steps.private_head.outputs.sha }}
          LARGE_RESPONSE_CONTRACTS: ${{ steps.large_response_contracts.outcome }}
          TARGETED_JAVA: ${{ steps.targeted_java.outcome }}
          FULL_CONTRACTS: ${{ steps.full_contracts.outcome }}
          MODULARIZATION: ${{ steps.modularization.outcome }}
          JAVA_VERIFY: ${{ steps.java_verify.outcome }}
          FRONTEND_VERIFY: ${{ steps.frontend_verify.outcome }}
          MOBILE_INSTALL: ${{ steps.mobile_install.outcome }}
          MOBILE_OPENAPI: ${{ steps.mobile_openapi.outcome }}
          MOBILE_TESTS: ${{ steps.mobile_tests.outcome }}
          MOBILE_TYPECHECK: ${{ steps.mobile_typecheck.outcome }}
          MOBILE_BUILD: ${{ steps.mobile_build.outcome }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          <!-- private-main-large-response-validation-v2 -->
          Private main large-response validation matrix finished.

          - private ref: main
          - private head: ${PRIVATE_HEAD:-unresolved}
          - large-response targeted contracts: ${LARGE_RESPONSE_CONTRACTS:-unknown}
          - targeted Java regression tests: ${TARGETED_JAVA:-unknown}
          - full contracts: ${FULL_CONTRACTS:-unknown}
          - modularization guard: ${MODULARIZATION:-unknown}
          - Java 21 Maven clean verify: ${JAVA_VERIFY:-unknown}
          - Web frontend CI: ${FRONTEND_VERIFY:-unknown}
          - mobile dependency install: ${MOBILE_INSTALL:-unknown}
          - mobile OpenAPI drift: ${MOBILE_OPENAPI:-unknown}
          - mobile tests: ${MOBILE_TESTS:-unknown}
          - mobile typecheck: ${MOBILE_TYPECHECK:-unknown}
          - mobile production build: ${MOBILE_BUILD:-unknown}
          - harness commit: ${{ github.sha }}
          EOF
          )
          gh pr comment 229 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Enforce validation result
        if: always()
        shell: bash
        env:
          LARGE_RESPONSE_CONTRACTS: ${{ steps.large_response_contracts.outcome }}
          TARGETED_JAVA: ${{ steps.targeted_java.outcome }}
          FULL_CONTRACTS: ${{ steps.full_contracts.outcome }}
          MODULARIZATION: ${{ steps.modularization.outcome }}
          JAVA_VERIFY: ${{ steps.java_verify.outcome }}
          FRONTEND_VERIFY: ${{ steps.frontend_verify.outcome }}
          MOBILE_INSTALL: ${{ steps.mobile_install.outcome }}
          MOBILE_OPENAPI: ${{ steps.mobile_openapi.outcome }}
          MOBILE_TESTS: ${{ steps.mobile_tests.outcome }}
          MOBILE_TYPECHECK: ${{ steps.mobile_typecheck.outcome }}
          MOBILE_BUILD: ${{ steps.mobile_build.outcome }}
        run: |
          set -euo pipefail
          for value in \
            "$LARGE_RESPONSE_CONTRACTS" "$TARGETED_JAVA" "$FULL_CONTRACTS" "$MODULARIZATION" \
            "$JAVA_VERIFY" "$FRONTEND_VERIFY" "$MOBILE_INSTALL" "$MOBILE_OPENAPI" \
            "$MOBILE_TESTS" "$MOBILE_TYPECHECK" "$MOBILE_BUILD"; do
            if [[ "$value" != "success" ]]; then
              exit 1
            fi
          done
