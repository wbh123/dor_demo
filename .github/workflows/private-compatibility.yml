name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'
  pull_request:
    branches:
      - main
    paths:
      - '.private-compat-trigger'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify private integration ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout CI helper branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          path: ci-tools
          persist-credentials: false

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0

      - name: Apply requested fixes to private branch
        shell: bash
        run: |
          set -euo pipefail
          python ci-tools/ci/apply_admin_requested_fixes.py
          cd private-repo
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "fix: complete admin scope branding import and scroll changes"
            git push origin HEAD:${{ steps.target.outputs.private_ref }}
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Run focused Java regression tests
        working-directory: private-repo
        shell: bash
        run: >-
          mvn -f backend-java/pom.xml -B -ntp -pl server -am
          -Dtest=AdminNoScopeGrantRegressionTest,WelcomeBrandDefaultsRegressionTest,ImportAttemptHistoryRegressionTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Run focused frontend regression tests
        working-directory: private-repo/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run generate:api
          node --experimental-strip-types --test src/views/admin/requested-admin-fixes.spec.ts
