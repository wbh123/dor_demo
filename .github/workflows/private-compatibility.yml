name: Private Mobile Force Update CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-mobile-force-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-mobile:
    name: Verify private mobile force update gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install APP dependencies
        working-directory: private-repo/app
        run: npm ci

      - name: Verify APP version
        working-directory: private-repo/app
        run: npm run version:check

      - name: Run force update gate contract
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/app-update-gate.spec.ts

      - name: Run all APP tests
        working-directory: private-repo/app
        run: npm test

      - name: Typecheck APP
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Build APP
        working-directory: private-repo/app
        run: npm run build

      - name: Build Android Debug APK
        working-directory: private-repo/app
        run: npm run android:build:debug
