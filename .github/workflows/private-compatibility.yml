name: Android Capacitor Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: android-private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Verify Android v1 debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$GITHUB_REF_NAME" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify startup update gate contract first
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test src/platform/app-update-gate.spec.ts

      - name: Verify recovery restart contract
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test src/platform/connection-recovery-view.spec.ts

      - name: Verify backend Java modules
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify

      - name: Verify Vue mobile app
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm test
          npm run typecheck
          npm run build

      - name: Sync committed Android project
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          test -d android
          npx cap sync android

      - name: Verify Android contracts and runtime dependencies
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/check_android_manifest.py
          bash scripts/ci/check_android_no_google.sh
          cd app/android
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > ../android-debug-runtime-dependencies.txt
          if grep -EHi 'com\.google\.(firebase|android\.gms|mlkit)|firebase-|play-services-|mlkit' ../android-debug-runtime-dependencies.txt; then
            echo 'Forbidden Google/Firebase runtime dependency detected' >&2
            exit 1
          fi
          grep -q 'com.google.zxing:core' ../android-debug-runtime-dependencies.txt
          grep -q 'com.journeyapps:zxing-android-embedded' ../android-debug-runtime-dependencies.txt

      - name: Test lint and assemble Android Debug APK
        working-directory: private-repo/app/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
