name: College Distribution Generator MySQL

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Resolve private ref
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          test "$private_ref" != "$candidate"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run college contracts
        working-directory: private-repo
        run: |
          set -euo pipefail
          python scripts/db/test_college_distribution.py || true
          python scripts/db/generate_navicat_sql.py --scenario realistic --skip-redis
          python scripts/db/test_college_distribution.py

      - name: Execute realistic on MySQL 8.4
        working-directory: private-repo
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot < backend-java/docs/sql/navicat/generated/00_一键重置数据库.sql
          mysql -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM wust_dormitory.student s JOIN wust_dormitory.major m ON m.id=s.major_id WHERE m.college_name='计算机科学与技术学院';" | grep -x '950'
          mysql -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(DISTINCT college_name) FROM wust_dormitory.major WHERE enabled=1;" | grep -x '19'
          mysql -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM wust_dormitory.major WHERE college_name='计算机科学与技术学院' AND enabled=1;" | grep -x '6'

      - name: Execute clean on MySQL 8.4
        working-directory: private-repo
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          python scripts/db/generate_navicat_sql.py --scenario clean --database-name wust_dormitory_clean --skip-redis
          mysql -h127.0.0.1 -uroot < backend-java/docs/sql/navicat/generated/00_一键重置数据库.sql
          mysql -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM wust_dormitory_clean.student s JOIN wust_dormitory_clean.major m ON m.id=s.major_id WHERE m.college_name='计算机科学与技术学院';" | grep -x '950'

      - name: Regenerate default realistic SQL
        working-directory: private-repo
        run: |
          set -euo pipefail
          python scripts/db/generate_navicat_sql.py --scenario realistic --skip-redis

      - name: Commit regenerated SQL to private branch
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-java/docs/sql/navicat/generated/00_一键重置数据库.sql
          if git diff --cached --quiet; then
            echo "Generated SQL already current."
          else
            git commit -m "testdata: regenerate default SQL with college distribution"
            git push origin "HEAD:${{ steps.target.outputs.private_ref }}"
          fi

      - name: Upload generated SQL
        uses: actions/upload-artifact@v4
        with:
          name: generated-college-sql
          path: private-repo/backend-java/docs/sql/navicat/generated/00_一键重置数据库.sql
          if-no-files-found: error
