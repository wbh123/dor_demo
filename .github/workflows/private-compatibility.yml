name: Brand Icon Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: brand-icon-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-brand-icons:
    name: Verify private brand icon integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          test -n "$private_ref"
          test "$private_ref" != "$candidate"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            private-repo/app/package-lock.json
            private-repo/frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify single-source icon wiring
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/assets/icon.png
          cmp app/src/assets/icon.png app/android/app/src/main/res/drawable-nodpi/app_icon_artwork.png
          cmp app/src/assets/icon.png app/public/favicon.png
          cmp app/src/assets/icon.png frontend/public/favicon.png
          grep -q 'android:icon="@mipmap/app_icon"' app/android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/app_icon_round"' app/android/app/src/main/AndroidManifest.xml
          grep -q 'href="/favicon.png"' app/index.html
          grep -q 'href="/favicon.png"' frontend/index.html

      - name: Verify mobile version and web build
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run version:check
          node scripts/check-version-bump.mjs origin/main
          npm run build

      - name: Verify Android launcher resources
        working-directory: private-repo/app/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:processDebugResources

      - name: Verify shared web frontend build
        working-directory: private-repo/frontend
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          npm ci
          npm run build
