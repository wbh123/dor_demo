name: Private Label Revoke Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-label-revoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-private-patch:
    name: Apply label revoke implementation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout CI shim
        uses: actions/checkout@v5
        with:
          path: ci-shim

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0

      - name: Apply implementation patch
        run: python ci-shim/tools/apply_label_revoke_patch.py

      - name: Commit implementation
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wust Dormitory CI"
          git config user.email "ci@wust-dormitory.local"
          git add app backend-java/server/src/main/java/com/wust/dormitory/label/ResourceLabelService.java
          git diff --cached --check
          git commit -m "feat: 支持按编号或扫码作废标签"
          git push origin HEAD:${{ steps.target.outputs.private_ref }}

  verify-private-mobile:
    name: Verify private mobile label revoke
    needs: apply-private-patch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then exit 1; fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json

      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm ci

      - name: Run label revoke contract first
        working-directory: private-repo/app
        run: node --experimental-strip-types --test src/platform/resource-label-quick-revoke.spec.ts

      - name: Run full mobile tests
        working-directory: private-repo/app
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/mobile-test.log"

      - name: Build Android debug app
        working-directory: private-repo/app
        run: npm run android:build:debug

  verify-private-backend:
    name: Verify private label revoke service
    needs: apply-private-patch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then exit 1; fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - name: Run label revoke service tests
        working-directory: private-repo
        run: mvn -f backend-java/pom.xml --batch-mode --no-transfer-progress -Dtest=ResourceLabelServiceTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Run backend verify
        working-directory: private-repo
        run: mvn -f backend-java/pom.xml --batch-mode --no-transfer-progress verify -DskipITs
