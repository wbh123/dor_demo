name: Private Mobile Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-mobile-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-mobile:
    name: Verify private mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - name: Record private commit
        working-directory: private-repo
        run: git rev-parse HEAD

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/app/package-lock.json

      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm ci

      - name: Run mobile tests
        working-directory: private-repo/app
        run: npm test 2>&1 | tee "$RUNNER_TEMP/mobile-test.log"

      - name: Upload mobile test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-log
          path: ${{ runner.temp }}/mobile-test.log
          if-no-files-found: error

      - name: Build Android debug app
        working-directory: private-repo/app
        run: npm run android:build:debug
