name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'
  pull_request:
    branches:
      - main
    paths:
      - '.private-compat-trigger'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify private integration ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Contracts 01-105
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          grep '^python ' scripts/ci/run_contracts.sh | sed -n '1,105p' | bash

      - name: Contract 106 admin route and brand assets
        working-directory: private-repo
        run: python scripts/ci/test_admin_route_render_and_brand_assets.py

      - name: Contract 107 entitlement recommendation concurrency
        working-directory: private-repo
        run: python scripts/ci/test_entitlement_recommendation_concurrency.py

      - name: Contract 108 audit notification analytics
        working-directory: private-repo
        run: python scripts/ci/test_audit_notification_analytics.py

      - name: Contract 109 governance OpenAPI
        working-directory: private-repo
        run: python scripts/ci/test_governance_openapi.py

      - name: Contract 110 governance schema alignment
        working-directory: private-repo
        run: python scripts/ci/test_governance_schema_alignment.py

      - name: Contracts 111-end
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          grep '^python ' scripts/ci/run_contracts.sh | sed -n '111,$p' | bash

      - name: Verify private Java modules
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify

      - name: Verify private frontend
        working-directory: private-repo
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          bash scripts/ci/run_frontend.sh
