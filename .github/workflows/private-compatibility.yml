name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

jobs:
  verify-private-ref:
    name: Verify current private main modularization scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: main
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run current modularization scanner
        working-directory: private-repo
        run: python scripts/ci/test_backend_modularization_boundaries.py
