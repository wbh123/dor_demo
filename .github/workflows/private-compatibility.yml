name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'
    paths-ignore:
      - 'ci/latest-private-validation.txt'

permissions:
  contents: write

concurrency:
  group: private-compat-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify private integration ref
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$GITHUB_REF_NAME" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout CI helper branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: ci-tools
          persist-credentials: true

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0

      - name: Apply verified runtime follow-ups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('ci-tools/ci/apply_runtime_followups.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "message.value = '文件已上传，后台预检任务已创建。可以关闭窗口，任务会继续执行。' ",
              "message.value = '文件已上传，后台预检任务已创建。可以关闭窗口，稍后重新查看结果。' "
          )
          p.write_text(text, encoding='utf-8')
          PY
          python ci-tools/ci/apply_runtime_followups.py
          cd private-repo
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "fix: close import retry and policy snapshot gaps"
            git push origin HEAD:${{ steps.target.outputs.private_ref }}
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Validate private branch
        id: validate
        shell: bash
        run: |
          set +e
          private_sha="$(git -C private-repo rev-parse HEAD)"
          mkdir -p ci-tools/ci
          result="ci-tools/ci/latest-private-validation.txt"
          : > "$result"
          {
            echo "private_ref=${{ steps.target.outputs.private_ref }}"
            echo "private_sha=$private_sha"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$result"

          mvn -f private-repo/backend-java/pom.xml -B -ntp -pl server -am -DskipTests package > /tmp/java-compile.log 2>&1
          java_compile=$?
          echo "java_compile=$java_compile" >> "$result"

          if [[ $java_compile -eq 0 ]]; then
            mvn -f private-repo/backend-java/pom.xml -B -ntp -pl server -am \
              -Dtest=AdminNoScopeGrantRegressionTest,WelcomeBrandDefaultsRegressionTest,ImportAttemptHistoryRegressionTest,SiteMetadataAssetServiceRegressionTest \
              -Dsurefire.failIfNoSpecifiedTests=false test > /tmp/java-regression.log 2>&1
            java_regression=$?
          else
            java_regression=99
            echo "skipped because Java compile failed" > /tmp/java-regression.log
          fi
          echo "java_regression=$java_regression" >> "$result"

          python private-repo/scripts/ci/test_site_metadata_openapi_contract.py > /tmp/openapi-contract.log 2>&1
          openapi_contract=$?
          echo "openapi_contract=$openapi_contract" >> "$result"

          cd private-repo/frontend
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1
          npm_ci=$?
          echo "npm_ci=$npm_ci" >> "$GITHUB_WORKSPACE/$result"

          if [[ $npm_ci -eq 0 ]]; then
            npm test > /tmp/frontend-test.log 2>&1
            frontend_test=$?
            npm run build > /tmp/frontend-build.log 2>&1
            frontend_build=$?
          else
            frontend_test=99
            frontend_build=99
            echo "skipped because npm ci failed" > /tmp/frontend-test.log
            echo "skipped because npm ci failed" > /tmp/frontend-build.log
          fi
          cd "$GITHUB_WORKSPACE"
          echo "frontend_test=$frontend_test" >> "$result"
          echo "frontend_build=$frontend_build" >> "$result"

          overall=0
          for code in "$java_compile" "$java_regression" "$openapi_contract" "$npm_ci" "$frontend_test" "$frontend_build"; do
            if [[ "$code" -ne 0 ]]; then overall=1; fi
          done
          echo "overall=$overall" >> "$result"

          if [[ $overall -ne 0 ]]; then
            for pair in \
              "java_compile:/tmp/java-compile.log:$java_compile" \
              "java_regression:/tmp/java-regression.log:$java_regression" \
              "openapi_contract:/tmp/openapi-contract.log:$openapi_contract" \
              "npm_ci:/tmp/npm-ci.log:$npm_ci" \
              "frontend_test:/tmp/frontend-test.log:$frontend_test" \
              "frontend_build:/tmp/frontend-build.log:$frontend_build"; do
              IFS=: read -r label logfile code <<< "$pair"
              if [[ "$code" -ne 0 ]]; then
                {
                  echo
                  echo "===== ${label} failure tail ====="
                  tail -n 140 "$logfile"
                } >> "$result"
              fi
            done
          fi
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish validation result
        if: always() && steps.validate.outcome == 'success'
        working-directory: ci-tools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/latest-private-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record private validation result [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fail workflow when validation failed
        if: steps.validate.outputs.overall != '0'
        run: exit 1
