name: Android Capacitor Bootstrap CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: android-private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bootstrap:
    name: Generate and verify Android shell
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$GITHUB_REF_NAME" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build Vue mobile app
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm test
          npm run typecheck
          npm run build

      - name: Generate secured Android shell
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android
          npx cap add android
          sed -i 's/minSdkVersion = 24/minSdkVersion = 26/' android/variables.gradle
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Verify Android contracts and dependencies
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/check_android_manifest.py
          bash scripts/ci/check_android_no_google.sh
          cd app/android
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > ../android-debug-runtime-dependencies.txt
          if grep -EHi 'com\.google\.(firebase|android\.gms|mlkit)|firebase-|play-services-|mlkit' ../android-debug-runtime-dependencies.txt; then
            echo 'Forbidden Google/Firebase runtime dependency detected' >&2
            exit 1
          fi
          ./gradlew lintDebug assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Commit verified Android source project
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dor-demo-ci"
          git config user.email "ci@users.noreply.github.com"
          git add app/android
          if git diff --cached --quiet; then
            echo "No Android source changes to commit"
            exit 1
          fi
          git commit -m "feat: bootstrap Capacitor Android project"
          git push origin "HEAD:${{ steps.target.outputs.private_ref }}"
