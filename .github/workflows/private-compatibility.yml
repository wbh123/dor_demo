name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify mobile auth scope and labels
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          test "$private_ref" != "$candidate"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private feature branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            private-repo/frontend/package-lock.json
            private-repo/app/package-lock.json

      - name: Verify V49 and V50 contracts
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          v49 = Path('backend-java/server/src/main/resources/db/migration/V49__split_admin_scope_read_write.sql').read_text()
          v50 = Path('backend-java/server/src/main/resources/db/migration/V50__add_resource_labels.sql').read_text()
          required49 = ['scope_access', "'READ'", "'WRITE'", "'ROOM'", 'uk_admin_profile_scope_access']
          required50 = ['public_code CHAR(8)', "REGEXP '^[0-9]{8}$'", "'UNBOUND'", "'BOUND'", "'REVOKED'", 'uk_resource_label_public_code']
          missing = [x for x in required49 if x not in v49] + [x for x in required50 if x not in v50]
          if missing:
              raise SystemExit('missing migration contract: ' + ', '.join(missing))
          print('V49/V50 contracts OK')
          PY

      - name: Compile private Java modules
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -DskipTests package 2>&1 | tee ../../java-compile.log

      - name: Run focused Java tests
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl server -am test \
            -Dtest=AdminAuthorizationServiceTest,AccountAdminGrantServiceTest,ResourceLabelCodeGeneratorTest \
            -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee ../../java-focused-tests.log

      - name: Verify private Java modules
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp clean verify 2>&1 | tee ../../java-full-verify.log

      - name: Upload Java validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-validation-logs
          path: |
            java-compile.log
            java-focused-tests.log
            java-full-verify.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Verify private frontend
        working-directory: private-repo
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          bash scripts/ci/run_frontend.sh

      - name: Verify mobile TypeScript contracts
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --experimental-strip-types --test src/platform/session-invalidator.spec.ts src/platform/resource-label.spec.ts
          npm run build

      - name: Verify Android debug build
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm run android:build:debug
