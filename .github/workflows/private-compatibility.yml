name: Private Mobile App Verification

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile-app:
    name: Verify private mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install mobile dependencies
        working-directory: private-repo/app
        run: npm install --no-audit --no-fund

      - name: Run complete mobile test suite
        working-directory: private-repo/app
        run: npm test

      - name: Generate mobile OpenAPI types
        working-directory: private-repo/app
        run: npm run generate:api

      - name: Type-check mobile app
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Build mobile web assets
        working-directory: private-repo/app
        run: npm run build

      - name: Verify school emblem bundle
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/logo-only.png
          test -s dist/logo-only.png
          echo "verified dist/logo-only.png"

      - name: Sync Capacitor Android project
        working-directory: private-repo/app
        run: npx cap sync android

      - name: Build Android debug package
        working-directory: private-repo/app/android
        run: ./gradlew assembleDebug
