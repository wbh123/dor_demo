name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify backup key management
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install backup recovery Python dependencies
        working-directory: private-repo
        run: python -m pip install -r scripts/ops/requirements.txt
      - name: Verify backup key and existing recovery safety
        working-directory: private-repo
        run: |
          python -m unittest \
            scripts/ops/test_generate_backup_key.py \
            scripts/ops/test_backup_recovery.py \
            scripts/ops/test_backup_recovery_drill_safety.py -v
      - name: Verify backup key focused Java behavior
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl server -am -Dtest=BackupKeyManagementServiceTest,PythonBackupRecoveryCliGatewayTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify Java full suite
        working-directory: private-repo/backend-java
        run: mvn -B -ntp clean verify
      - name: Verify Web frontend full suite
        working-directory: private-repo
        run: bash scripts/ci/run_frontend.sh
