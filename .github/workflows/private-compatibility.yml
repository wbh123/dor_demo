name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Differential mobile inspection acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Verify inspection OpenAPI contract
        working-directory: private-repo
        run: python scripts/ci/test_inspection_openapi_contract.py

      - name: Reject newly-large Java classes
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r path; do
            [[ -z "$path" || ! -f "$path" ]] && continue
            current=$(wc -l < "$path")
            (( current <= 300 )) && continue
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              base=$(git show "origin/main:$path" | wc -l)
            else
              base=0
            fi
            if (( base <= 300 )); then
              echo "新增大型 Java 类: $path ($base -> $current)" >&2
              failed=1
            fi
          done < <(git diff --name-only origin/main...HEAD -- backend-java/server/src/main/java)
          exit "$failed"

      - name: Verify web frontend
        working-directory: private-repo
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: bash scripts/ci/run_frontend.sh

      - name: Install mobile app dependencies
        working-directory: private-repo/app
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Generate mobile OpenAPI types
        working-directory: private-repo/app
        run: npm run generate:api

      - name: Check generated mobile OpenAPI drift
        id: schema_drift
        continue-on-error: true
        working-directory: private-repo
        run: git diff --exit-code -- app/src/api/schema.d.ts

      - name: Verify mobile app tests
        working-directory: private-repo/app
        run: npm test

      - name: Verify mobile app types
        working-directory: private-repo/app
        run: npm run typecheck

      - name: Verify mobile app production build
        working-directory: private-repo/app
        run: npm run build

      - name: Verify Java 21 modules
        working-directory: private-repo/backend-java
        run: mvn -B -ntp clean verify

      - name: Record legacy full-contract status
        continue-on-error: true
        working-directory: private-repo
        run: bash scripts/ci/run_contracts.sh
