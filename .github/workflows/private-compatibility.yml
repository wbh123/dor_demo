name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'
    paths-ignore:
      - 'ci/latest-apply-result.txt'
      - 'ci/latest-private-validation.txt'

permissions:
  contents: write

concurrency:
  group: private-compat-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Apply and verify private integration ref
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve private branch
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          [[ "$private_ref" != "$GITHUB_REF_NAME" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: ci-tools
          persist-credentials: true

      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Prepare deterministic patch helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('ci-tools/ci/apply_private_followups_v2.py')
          text = path.read_text(encoding='utf-8')
          strict = "    if count != 1:\n        raise RuntimeError(f'{path}: expected one marker, found {count}: {old[:120]!r}')\n"
          if strict in text:
              text = text.replace(strict, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply, regenerate, verify and push
        id: verify
        shell: bash
        run: |
          set +e
          result="$GITHUB_WORKSPACE/ci-tools/ci/latest-private-validation.txt"
          mkdir -p "$GITHUB_WORKSPACE/ci-tools/ci"
          : > "$result"
          {
            echo "private_ref=${{ steps.target.outputs.private_ref }}"
            echo "private_before=$(git -C private-repo rev-parse HEAD)"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$result"

          python ci-tools/ci/apply_private_followups_v2.py > /tmp/patch.log 2>&1
          patch=$?
          echo "patch=$patch" >> "$result"

          cd private-repo/frontend
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1
          npm_ci=$?
          cd "$GITHUB_WORKSPACE"
          echo "npm_ci=$npm_ci" >> "$result"

          if [[ $patch -eq 0 ]]; then
            python private-repo/scripts/db/generate_school_deployment_sql.py > /tmp/deployment-generate.log 2>&1
            deployment_generate=$?
            python private-repo/scripts/db/generate_baseline_database.py --profile deployment > /tmp/baseline-generate.log 2>&1
            baseline_generate=$?
          else
            deployment_generate=99
            baseline_generate=99
          fi
          echo "deployment_generate=$deployment_generate" >> "$result"
          echo "baseline_generate=$baseline_generate" >> "$result"

          if [[ $npm_ci -eq 0 && $patch -eq 0 ]]; then
            cd private-repo/frontend
            npm run generate:api > /tmp/api-generate.log 2>&1
            api_generate=$?
            cd "$GITHUB_WORKSPACE"
          else
            api_generate=99
          fi
          echo "api_generate=$api_generate" >> "$result"

          if [[ $patch -eq 0 && $api_generate -eq 0 ]]; then
            mvn -f private-repo/backend-java/pom.xml -B -ntp -pl model,server -am test > /tmp/java-test.log 2>&1
            java_test=$?
          else
            java_test=99
          fi
          echo "java_test=$java_test" >> "$result"

          python private-repo/scripts/ci/test_site_metadata_openapi_contract.py > /tmp/openapi-contract.log 2>&1
          openapi_contract=$?
          echo "openapi_contract=$openapi_contract" >> "$result"

          python private-repo/scripts/db/test_generate_school_deployment.py > /tmp/deployment-test.log 2>&1
          deployment_test=$?
          echo "deployment_test=$deployment_test" >> "$result"

          if [[ $npm_ci -eq 0 && $api_generate -eq 0 ]]; then
            cd private-repo/frontend
            npm test > /tmp/frontend-test.log 2>&1
            frontend_test=$?
            npm run build > /tmp/frontend-build.log 2>&1
            frontend_build=$?
            cd "$GITHUB_WORKSPACE"
          else
            frontend_test=99
            frontend_build=99
          fi
          echo "frontend_test=$frontend_test" >> "$result"
          echo "frontend_build=$frontend_build" >> "$result"

          python private-repo/scripts/db/generate_school_deployment_sql.py --check > /tmp/deployment-check.log 2>&1
          deployment_check=$?
          echo "deployment_check=$deployment_check" >> "$result"

          python -m unittest private-repo/scripts/db/test_frozen_schema.py private-repo/scripts/db/test_1000_student_sql.py -v > /tmp/db-tests.log 2>&1
          db_tests=$?
          echo "db_tests=$db_tests" >> "$result"

          git -C private-repo diff --check > /tmp/diff-check.log 2>&1
          diff_check=$?
          echo "diff_check=$diff_check" >> "$result"

          overall=0
          for code in "$patch" "$npm_ci" "$deployment_generate" "$baseline_generate" "$api_generate" "$java_test" "$openapi_contract" "$deployment_test" "$frontend_test" "$frontend_build" "$deployment_check" "$db_tests" "$diff_check"; do
            [[ "$code" -eq 0 ]] || overall=1
          done

          push=99
          if [[ $overall -eq 0 ]]; then
            cd private-repo
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "feat: harden admin configuration workflows" > /tmp/commit.log 2>&1
              commit_code=$?
              if [[ $commit_code -eq 0 ]]; then
                git push origin HEAD:${{ steps.target.outputs.private_ref }} > /tmp/push.log 2>&1
                push=$?
              else
                push=$commit_code
              fi
            else
              echo "no private diff" > /tmp/commit.log
              echo "no private diff" > /tmp/push.log
              push=0
            fi
            cd "$GITHUB_WORKSPACE"
          fi
          echo "push=$push" >> "$result"
          if [[ $overall -eq 0 && $push -ne 0 ]]; then overall=1; fi
          echo "private_after=$(git -C private-repo rev-parse HEAD)" >> "$result"
          echo "overall=$overall" >> "$result"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"

          for pair in \
            patch:/tmp/patch.log:$patch \
            npm_ci:/tmp/npm-ci.log:$npm_ci \
            deployment_generate:/tmp/deployment-generate.log:$deployment_generate \
            baseline_generate:/tmp/baseline-generate.log:$baseline_generate \
            api_generate:/tmp/api-generate.log:$api_generate \
            java_test:/tmp/java-test.log:$java_test \
            openapi_contract:/tmp/openapi-contract.log:$openapi_contract \
            deployment_test:/tmp/deployment-test.log:$deployment_test \
            frontend_test:/tmp/frontend-test.log:$frontend_test \
            frontend_build:/tmp/frontend-build.log:$frontend_build \
            deployment_check:/tmp/deployment-check.log:$deployment_check \
            db_tests:/tmp/db-tests.log:$db_tests \
            diff_check:/tmp/diff-check.log:$diff_check \
            push:/tmp/push.log:$push; do
            IFS=: read -r label logfile code <<< "$pair"
            if [[ "$code" -ne 0 && -f "$logfile" ]]; then
              {
                echo
                echo "===== ${label} failure tail ====="
                tail -n 180 "$logfile"
              } >> "$result"
            fi
          done
          exit 0

      - name: Publish validation result
        if: always()
        working-directory: ci-tools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/latest-private-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record private validation result [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fail when private validation failed
        if: steps.verify.outputs.overall != '0'
        run: exit 1
