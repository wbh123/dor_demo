name: Private Feature Validation

on:
  push:
    branches:
      - 'private-compat/**'
    paths-ignore:
      - 'ci/latest-feature-validation.txt'

permissions:
  contents: write

concurrency:
  group: private-feature-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend-red:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve private branch
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: ci-tools
          persist-credentials: true
      - name: Checkout private branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json
      - name: Run private frontend tests
        id: test
        shell: bash
        run: |
          set +e
          cd private-repo/frontend
          npm ci --no-audit --no-fund > /tmp/npm-ci.log 2>&1
          npm_ci=$?
          if [[ $npm_ci -eq 0 ]]; then npm test > /tmp/frontend-test.log 2>&1; frontend_test=$?; else frontend_test=99; fi
          cd "$GITHUB_WORKSPACE"
          result="ci-tools/ci/latest-feature-validation.txt"
          {
            echo "private_ref=${{ steps.target.outputs.private_ref }}"
            echo "private_head=$(git -C private-repo rev-parse HEAD)"
            echo "npm_ci=$npm_ci"
            echo "frontend_test=$frontend_test"
            if [[ $frontend_test -ne 0 && -f /tmp/frontend-test.log ]]; then
              echo "===== frontend_test failure tail ====="
              tail -n 160 /tmp/frontend-test.log
            fi
          } > "$result"
          echo "frontend_test=$frontend_test" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish feature validation result
        if: always()
        working-directory: ci-tools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/latest-feature-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record feature validation [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Fail on frontend test failure
        if: steps.test.outputs.frontend_test != '0'
        run: exit 1
