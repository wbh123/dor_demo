name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify backup recovery admin console
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          [[ -n "$private_ref" && "$private_ref" != "$candidate" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Verify console architecture contract
        working-directory: private-repo
        run: node scripts/ci/test_backup_recovery_admin_console.mjs

      - name: Verify console Java behavior
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -o pipefail
          set +e
          mvn -B -ntp -pl server -am -Dtest=BackupRecoveryConsoleServiceTest -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee /tmp/backup-console-java.log
          status=${PIPESTATUS[0]}
          {
            echo '### Backup recovery console Java tail'
            echo '```text'
            tail -n 180 /tmp/backup-console-java.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
