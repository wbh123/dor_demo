name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify private integration ref
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          private_ref="${GITHUB_REF_NAME#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$GITHUB_REF_NAME" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Compile Java production and test sources
        working-directory: private-repo
        shell: bash
        run: mvn -f backend-java/pom.xml -B -ntp -pl server -am -DskipTests package

      - name: Run requested Java regressions
        working-directory: private-repo
        shell: bash
        run: >-
          mvn -f backend-java/pom.xml -B -ntp -pl server -am
          -Dtest=AdminNoScopeGrantRegressionTest,WelcomeBrandDefaultsRegressionTest,ImportAttemptHistoryRegressionTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Install frontend dependencies
        working-directory: private-repo/frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend regression suite
        working-directory: private-repo/frontend
        run: npm test

      - name: Typecheck and build frontend
        working-directory: private-repo/frontend
        run: npm run build
