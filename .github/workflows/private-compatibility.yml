name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-mobile-ref:
    name: Verify private mobile Android ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify mobile app contract
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix private-repo/app --no-audit --no-fund
          npm --prefix private-repo/app test
