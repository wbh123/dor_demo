name: Private Feature Validation

on:
  push:
    branches:
      - 'private-compat/**'
    paths-ignore:
      - 'ci/latest-feature-validation.txt'

permissions:
  contents: write

jobs:
  feature-red:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve private branch
        id: target
        run: echo "private_ref=${GITHUB_REF_NAME#private-compat/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: ci-tools
          persist-credentials: true
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Run feature tests
        id: test
        shell: bash
        run: |
          set +e
          cd private-repo/frontend
          npm ci --no-audit --no-fund >/tmp/npm.log 2>&1; npm_ci=$?
          if [[ $npm_ci -eq 0 ]]; then npm test >/tmp/front.log 2>&1; frontend=$?; else frontend=99; fi
          cd "$GITHUB_WORKSPACE"
          mvn -f private-repo/backend-java/pom.xml -B -ntp -pl server -am -Dtest=MobileAppVersionControllerTest -Dsurefire.failIfNoSpecifiedTests=false test >/tmp/java.log 2>&1; java=$?
          result="ci-tools/ci/latest-feature-validation.txt"
          {
            echo "private_ref=${{ steps.target.outputs.private_ref }}"
            echo "private_head=$(git -C private-repo rev-parse HEAD)"
            echo "npm_ci=$npm_ci"
            echo "frontend_test=$frontend"
            echo "java_qr_test=$java"
            for pair in frontend:/tmp/front.log:$frontend java:/tmp/java.log:$java; do IFS=: read -r label log code <<< "$pair"; if [[ $code -ne 0 ]]; then echo "===== $label failure tail ====="; tail -n 120 "$log"; fi; done
          } > "$result"
          echo "failed=$(( frontend != 0 || java != 0 ))" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish result
        if: always()
        working-directory: ci-tools
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/latest-feature-validation.txt
          if ! git diff --cached --quiet; then git commit -m "ci: record feature validation [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Fail on expected red
        if: steps.test.outputs.failed != '0'
        run: exit 1
