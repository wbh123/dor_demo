name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'
  pull_request:
    branches:
      - main
    paths:
      - '.private-compat-trigger'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify private integration ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json

      - name: Contract 01 campus management
        working-directory: private-repo
        run: python scripts/subscription/test_campus_management_contract.py

      - name: Contract 02 building card density
        working-directory: private-repo
        run: python scripts/frontend/test_building_card_density_campus_filter.py

      - name: Contract 03 single bed layout sync
        working-directory: private-repo
        run: python scripts/ci/test_single_bed_room_layout_dependency_sync.py

      - name: Contract 04 notification structured action
        working-directory: private-repo
        run: python scripts/frontend/test_notification_structured_action_contract.py

      - name: Contract 05 notification token translation
        working-directory: private-repo
        run: python scripts/frontend/test_notification_token_translation_contract.py

      - name: Contract 06 feature authorization closure
        working-directory: private-repo
        run: python scripts/subscription/test_feature_authorization_closure.py

      - name: Contract 07 feature code references
        working-directory: private-repo
        run: python scripts/subscription/test_feature_code_references.py

      - name: Contract 08 feature catalog alignment
        working-directory: private-repo
        run: python scripts/subscription/test_feature_catalog_runtime_alignment.py

      - name: Contract 09 runtime data correctness
        working-directory: private-repo
        run: python scripts/ci/test_runtime_error_data_correctness_batch.py

      - name: Contract 10 backend service convergence
        working-directory: private-repo
        run: python scripts/ci/test_backend_small_service_convergence.py

      - name: Contract 11 team service convergence
        working-directory: private-repo
        run: python scripts/ci/test_student_team_service_convergence.py

      - name: Contract 12 OpenAPI controller split D1
        working-directory: private-repo
        run: python scripts/ci/test_openapi_controller_split_d1.py

      - name: Contract remaining suite
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          tail -n +13 scripts/ci/run_contracts.sh | bash

      - name: Verify private Java modules
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify

      - name: Verify private frontend
        working-directory: private-repo
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          bash scripts/ci/run_frontend.sh
