name: Private Feature Validation

on:
  push:
    branches:
      - 'private-compat/**'
    paths-ignore:
      - 'ci/latest-feature-validation.txt'
  pull_request:
    branches:
      - main
    paths:
      - '.private-compat-trigger'
      - '.github/workflows/private-compatibility.yml'
      - 'ci/apply_app_download_ui_unification.py'
      - 'ci/apply_app_download_ui_followups.py'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve private branch
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          [[ "$private_ref" != "$candidate" ]]
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          path: ci-tools
          persist-credentials: true
      - uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml
      - name: Apply implementation and validate
        id: verify
        shell: bash
        run: |
          set +e
          result="$GITHUB_WORKSPACE/ci-tools/ci/latest-feature-validation.txt"
          : > "$result"
          echo "private_ref=${{ steps.target.outputs.private_ref }}" >> "$result"
          echo "private_before=$(git -C private-repo rev-parse HEAD)" >> "$result"

          python ci-tools/ci/apply_app_download_ui_unification.py >/tmp/patch.log 2>&1; patch=$?
          if [[ $patch -eq 0 ]]; then
            python ci-tools/ci/apply_app_download_ui_followups.py >>/tmp/patch.log 2>&1; patch=$?
          fi
          echo "patch=$patch" >> "$result"
          if [[ $patch -eq 0 ]]; then
            cd private-repo/frontend
            npm ci --no-audit --no-fund >/tmp/npm.log 2>&1; npm_ci=$?
            if [[ $npm_ci -eq 0 ]]; then
              npm test >/tmp/front.log 2>&1; frontend=$?
              npm run build >/tmp/build.log 2>&1; build=$?
            else frontend=99; build=99; fi
            cd "$GITHUB_WORKSPACE"
            mvn -f private-repo/backend-java/pom.xml -B -ntp -pl model,server -am test >/tmp/java.log 2>&1; java=$?
            (cd private-repo && bash scripts/ci/run_contracts.sh) >/tmp/contracts.log 2>&1; contracts=$?
            python private-repo/scripts/db/generate_school_deployment_sql.py --check >/tmp/deploy-check.log 2>&1; deploy_check=$?
            python private-repo/scripts/db/generate_baseline_database.py --profile deployment >/tmp/baseline.log 2>&1; baseline=$?
            git -C private-repo diff --check >/tmp/diff.log 2>&1; diff=$?
          else
            npm_ci=99; frontend=99; build=99; java=99; contracts=99; deploy_check=99; baseline=99; diff=99
          fi
          for pair in npm_ci:$npm_ci frontend_test:$frontend frontend_build:$build java_test:$java contracts:$contracts deployment_check:$deploy_check baseline_generate:$baseline diff_check:$diff; do echo "$pair" | tr ':' '=' >> "$result"; done
          overall=0
          for code in "$patch" "$npm_ci" "$frontend" "$build" "$java" "$contracts" "$deploy_check" "$baseline" "$diff"; do [[ $code -eq 0 ]] || overall=1; done
          echo "overall=$overall" >> "$result"
          for pair in patch:/tmp/patch.log:$patch frontend:/tmp/front.log:$frontend build:/tmp/build.log:$build java:/tmp/java.log:$java contracts:/tmp/contracts.log:$contracts deployment:/tmp/deploy-check.log:$deploy_check baseline:/tmp/baseline.log:$baseline diff:/tmp/diff.log:$diff; do
            IFS=: read -r label log code <<< "$pair"
            if [[ $code -ne 0 && -f "$log" ]]; then echo "===== $label failure tail =====" >> "$result"; tail -n 180 "$log" >> "$result"; fi
          done
          echo "===== validation summary ====="
          cat "$result"
          if [[ $overall -eq 0 ]]; then
            cd private-repo
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "feat: add public app download and unify form controls"
              git push origin HEAD:${{ steps.target.outputs.private_ref }}
            fi
            echo "private_after=$(git rev-parse HEAD)" >> "$result"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish result
        if: always() && github.event_name == 'push'
        working-directory: ci-tools
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/latest-feature-validation.txt
          if ! git diff --cached --quiet; then git commit -m "ci: record feature validation [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Fail when implementation validation failed
        if: steps.verify.outputs.overall != '0'
        run: exit 1
