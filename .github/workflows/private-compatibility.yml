name: Private Compatibility CI

on:
  push:
    branches:
      - 'private-compat/**'
  pull_request:
    branches:
      - main
    paths:
      - '.private-compat-trigger'

permissions:
  contents: read

concurrency:
  group: private-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-private-ref:
    name: Verify private integration ref
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          private_ref="${candidate#private-compat/}"
          if [[ -z "$private_ref" || "$private_ref" == "$candidate" ]]; then
            echo "Invalid compatibility branch name" >&2
            exit 1
          fi
          if [[ ! "$private_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsupported private ref characters" >&2
            exit 1
          fi
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - name: Verify targeted Java regressions
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl server -am \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=AccountAdminGrantServiceTest,MobileSecurityIsolationContractTest,InspectionMapperContractTest,InspectionMapperRuntimeMappingTest,InspectionRoomServiceTest,InspectionRoomReopenServiceTest,MobileInspectionServiceTest,MobileInspectionViewServiceTest,MobileInspectionControllerTest,InspectionIssueServiceTest \
            test
