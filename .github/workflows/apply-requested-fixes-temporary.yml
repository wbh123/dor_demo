name: Apply requested fixes temporary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: fix/requested-ui-20260804
          fetch-depth: 0
      - name: Rebuild and verify patch
        run: |
          echo "ac279feefc310f9ca5a68eed6c7cb0d7e7a89299bbd6bbe90bc5b756e5459673  .automation/requested-fixes.part00a" | sha256sum -c -
          echo "533043819c9a952e7a411f36a4af6f2540f3bcb92ed3a3dc35e4b13393db9438  .automation/requested-fixes.part00b" | sha256sum -c -
          cat .automation/requested-fixes.part00a .automation/requested-fixes.part00b .automation/requested-fixes.part01 .automation/requested-fixes.part02 .automation/requested-fixes.part03 | base64 -d > /tmp/requested.patch.gz
          echo "8f6ef3f3d482ef9b8de17abcc11caec7c8fa40ffe4f93dba5d91a485b57bcd8c  /tmp/requested.patch.gz" | sha256sum -c -
          gzip -dc /tmp/requested.patch.gz > /tmp/requested.patch
          git apply --check /tmp/requested.patch
          git apply /tmp/requested.patch
      - name: Commit requested fixes
        run: |
          rm -rf .automation
          rm -f .github/workflows/apply-requested-fixes-temporary.yml
          git config user.name "wbh123"
          git config user.email "21192079+wbh123@users.noreply.github.com"
          git add -A
          git commit -m "fix: 完善布局、欢迎语、组队与通知交互"
          git push origin HEAD:fix/requested-ui-20260804
