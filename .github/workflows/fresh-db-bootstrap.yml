name: Fresh Database Flyway CI

on:
  push:
    branches:
      - 'private-compat/**'

permissions:
  contents: read

jobs:
  fresh-db-flyway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Resolve private branch name
        id: target
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_REF_NAME"
          private_ref="${candidate#private-compat/}"
          test -n "$private_ref"
          test "$private_ref" != "$candidate"
          echo "private_ref=$private_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout private integration branch
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: ${{ steps.target.outputs.private_ref }}
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - name: Create existing but empty application database
        shell: bash
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE wust_dormitory_fresh CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          test "$(mysql -h127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='wust_dormitory_fresh';")" = "0"

      - name: Build Spring Boot service
        working-directory: private-repo/backend-java
        run: mvn -B -ntp -pl starter -am clean package -DskipTests

      - name: Start Spring Boot and let Flyway initialize the empty database
        working-directory: private-repo
        env:
          WUST_DORMITORY_DB_HOST: 127.0.0.1
          WUST_DORMITORY_DB_PORT: '3306'
          WUST_DORMITORY_DB_NAME: wust_dormitory_fresh
          WUST_DORMITORY_DB_USER: root
          WUST_DORMITORY_DB_PASSWORD: root
          WUST_DORMITORY_REDIS_HOST: 127.0.0.1
          WUST_DORMITORY_REDIS_PORT: '6379'
          WUST_DORMITORY_REDIS_PASSWORD: ''
          WUST_DORMITORY_SERVER_PORT: '18080'
        shell: bash
        run: |
          set -euo pipefail
          java -jar backend-java/starter/target/Service.jar > /tmp/fresh-db-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/fresh-db-app.log' EXIT

          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              grep -q '"status":"UP"' /tmp/health.json
              grep -q 'Started WustDormitorySelectApplication' /tmp/fresh-db-app.log
              mysql -h127.0.0.1 -uroot -proot wust_dormitory_fresh -Nse "SELECT version FROM flyway_schema_history WHERE success=1 ORDER BY installed_rank DESC LIMIT 1;" | grep -qx '50'
              echo 'FRESH_DB_FLYWAY_READY'
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo 'Spring Boot exited before becoming healthy' >&2
              cat /tmp/fresh-db-app.log >&2
              exit 1
            fi
            sleep 2
          done

          echo 'Timed out waiting for Spring Boot health' >&2
          cat /tmp/fresh-db-app.log >&2
          exit 1
