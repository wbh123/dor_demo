name: Apply Room Update Contract Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python scripts/ci/apply_room_update_contract_fix.py
      - name: Verify regression contract
        run: python scripts/ci/test_room_update_contract_sync.py
      - name: Remove temporary files
        run: |
          rm -f scripts/ci/apply_room_update_contract_fix.py
          rm -f .github/workflows/room-update-contract-fix-temp.yml
      - name: Commit formal fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: synchronize room update request contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
