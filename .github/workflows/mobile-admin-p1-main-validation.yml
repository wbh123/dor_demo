name: Mobile Admin P1 Main Validation

on:
  push:
    branches:
      - 'private-compat/main'
    paths:
      - '.mobile-p1-main-trigger'
      - '.github/workflows/mobile-admin-p1-main-validation.yml'

permissions:
  contents: read

jobs:
  validate-mobile-p1-main:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private main
        uses: actions/checkout@v5
        with:
          repository: wbh123/Wust-Dormitory-Select
          ref: main
          token: ${{ secrets.PRIVATE_CI }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private main head
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="080b117ec409a20df884d930c5ff98afc2cf23b3"
          echo "private-main-head=$actual"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate P1 security idempotency and database contracts
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/test_mobile_admin_p1_contract.py
          python scripts/db/generate_navicat_sql.py --scenario realistic --check
          python scripts/db/test_database_dictionary_current.py
          python -m unittest scripts/db/test_navicat_database_integrity.py -v

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate mobile app
        working-directory: private-repo/app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: private-repo/backend-java/pom.xml

      - name: Validate backend
        working-directory: private-repo/backend-java
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify

      - name: Validate existing web frontend
        working-directory: private-repo
        shell: bash
        env:
          VITE_INSTITUTION_NAME: Example University
          VITE_CAMPUS_NAME: Example Campus
        run: |
          set -euo pipefail
          bash scripts/ci/run_frontend.sh
